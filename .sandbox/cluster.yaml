# The kubeconfig of the sandbox for the k3s cluster on this host. It holds no secret.
# `just sandbox setup` replaces @K8S_HOST@ with the name of this host. It writes the result to ~/.local/state/sandbox/kube/cluster.yaml.
# sandbox.container mounts that folder read-only, and KUBECONFIG points to the file, so a plain `kubectl` works in the sandbox.
# The token is a placeholder. The proxy swaps in the real token for this host only. See proxy/iron-proxy.yaml.
# The server is a name and not an IP address, because the proxy needs the server name of the TLS handshake.
# The file has no CA. The sandbox trusts the CA of the proxy, and the proxy checks the certificate of the cluster.
apiVersion: v1
kind: Config
clusters:
  - name: k8s_dev
    cluster:
      server: https://@K8S_HOST@:6443
users:
  - name: k8s_dev
    user:
      token: sandbox-placeholder-K8S_DEV
contexts:
  - name: k8s_dev
    context: {cluster: k8s_dev, user: k8s_dev}
current-context: k8s_dev
