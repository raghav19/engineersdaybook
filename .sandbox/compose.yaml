# The Podman sandbox: a hardened rootless container with no network. iron-proxy runs on the host and is its only way out.
# Run it with `just sandbox <recipe>`. The justfile sets SANDBOX_STATE_DIR and SANDBOX_RUN_DIR, makes the CA and starts the proxy.
#
# The owner of the volumes. The container uses the default rootless map of Podman. The volume option uid and gid counts ids of the
# rootless user namespace (`podman unshare`). In the default map, these ids are the ids in the container. So the option is the id of agent: 1000.
# On the host, container id N (N >= 1) is the host id 100000 + N - 1, so agent is the host id 100999 (see /proc/self/uid_map).
# If you change the user id of agent, change the volume option (x-agent-volume) to the same id.
# podman-compose 1.6.0 puts all services in one pod unless you turn this off. A pod shares one network namespace.
name: sandbox
x-podman:
  in_pod: false

# The volumes belong to the user agent. Podman gives a volume to this owner when it makes the volume. The sandbox sees 1000:1000.
x-agent-volume: &agent-volume
  driver_opts: {o: "uid=1000,gid=1000"}

volumes:
  # The clone of the repo. The work of the agent stays here after you quit. `down` keeps it.
  sandbox-workspace:
    <<: *agent-volume
    name: sandbox-workspace
  # The login and settings of Claude Code, and its plugins.
  sandbox-claude-home:
    <<: *agent-volume
    name: sandbox-claude-home
  # The sessions of Qwen Code.
  sandbox-qwen-home:
    <<: *agent-volume
    name: sandbox-qwen-home
  # The history, the settings and the memory of Headroom.
  sandbox-headroom-home:
    <<: *agent-volume
    name: sandbox-headroom-home
  # The layout of Herdr (session.json and session-snapshots). A new sandbox restores the panes.
  sandbox-herdr:
    <<: *agent-volume
    name: sandbox-herdr
  # The Terraform provider cache (TF_PLUGIN_CACHE_DIR in image/mise.toml).
  sandbox-terraform-providers:
    <<: *agent-volume
    name: sandbox-terraform-providers

x-sandbox: &sandbox
  image: localhost/sandbox-dev:latest
  # No network at all: the container has the loopback interface only. The proxy on the host is the only way out (see the relay in image/sandbox-entry).
  network_mode: none
  # The image entry (sandbox-entry) starts as root. In rootless Podman that is the host user, who owns the proxy socket. The entry drops to the user agent.
  user: "0:0"
  working_dir: /home/agent
  cap_drop: [ALL]
  # SETUID and SETGID: the entry changes to the user agent. SETPCAP: the entry empties the bounding set of the relay and of the agent.
  cap_add: [SETUID, SETGID, SETPCAP]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 4096
  mem_limit: 3g
  cpus: 4
  environment:
    # The placeholders. They must equal the proxy_value lines in proxy/iron-proxy.yaml. They are not secrets.
    GH_TOKEN: sandbox-placeholder-GH_TOKEN
    CLAUDE_CODE_OAUTH_TOKEN: sandbox-placeholder-CLAUDE_CODE_OAUTH_TOKEN
    QWEN_API_KEY: sandbox-placeholder-QWEN_API_KEY
    GHCR_PUSH_TOKEN: sandbox-placeholder-GHCR_PUSH_TOKEN
    # The relay in the sandbox listens on 127.0.0.1:3128 and copies to the proxy socket. Tools that ignore these variables have no route.
    HTTP_PROXY: http://127.0.0.1:3128
    HTTPS_PROXY: http://127.0.0.1:3128
    http_proxy: http://127.0.0.1:3128
    https_proxy: http://127.0.0.1:3128
    NO_PROXY: localhost,127.0.0.1
    no_proxy: localhost,127.0.0.1
    NODE_USE_ENV_PROXY: "1" # Node.js 24 and newer reads the proxy variables only with this value
    HOME: /home/agent
    COLORTERM: truecolor
    SANDBOX_WORKSPACE: /home/agent/engineersdaybook # the path of the clone
    SANDBOX_BRANCH: ${SANDBOX_BRANCH:-} # the branch of the host checkout. The clone starts on it.
    REPO_URL: https://github.com/raghav19/engineersdaybook # the URL of origin in the clone
    GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-agent} # git reads the identity from these four variables
    GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-agent}
    GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-agent@localhost}
    GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-agent@localhost}
    MISE_TRUSTED_CONFIG_PATHS: /home/agent/engineersdaybook # mise trusts the mise.toml files in the clone
    MISE_IGNORED_CONFIG_PATHS: /home/agent/engineersdaybook/mise.toml # the root mise.toml of the clone lists host tools
    CLAUDE_CONFIG_DIR: /home/agent/.claude
    DISABLE_UPDATES: "1" # the claude that mise installs does not update itself
    HEADROOM_HARD_WATCHDOG_SECS: "0" # 0 turns off the watchdog
    NODE_OPTIONS: --use-system-ca
    REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  volumes:
    # The public CA of the proxy. sandbox-entry adds it to the trust store of the sandbox.
    - ${SANDBOX_STATE_DIR:?run this through just}/ca.crt:/usr/local/share/ca-certificates/sandbox-proxy.crt:ro
    # The folder of the proxy socket. A folder, because the host recreates the socket file when the bridge restarts.
    - ${SANDBOX_RUN_DIR:?run this through just}:/run/sandbox/proxy
    # The .git folder of the host repo. The clone is made from it. The mount is read-only, so the sandbox cannot change the host repo.
    - ${SANDBOX_GIT_DIR:?run this through just}:/run/sandbox/source:ro
    # The Omarchy theme of the host, for the TTT editor.
    - ${HOME}/.local/state/omarchy/current/theme:/home/agent/.local/state/omarchy/current/theme:ro
    - sandbox-workspace:/home/agent/engineersdaybook
    - sandbox-claude-home:/home/agent/.claude
    - sandbox-qwen-home:/home/agent/.qwen
    - sandbox-headroom-home:/home/agent/.headroom
    - sandbox-herdr:/home/agent/.herdr
    - sandbox-terraform-providers:/home/agent/.cache/terraform-providers

services:
  # The container stays up after you close the terminal. `just sandbox run` opens Herdr in it with `podman exec`.
  sandbox:
    <<: *sandbox
    container_name: sandbox

  # The egress self-test: `just sandbox selftest`. It runs as the command of a container, with no volume of the agent.
  selftest:
    <<: *sandbox
    container_name: sandbox-selftest
    profiles: [selftest]
    command:
      - egress-selftest
      - -p
      - 'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-ant-[A-Za-z0-9_-]{20,}'
      - -a
      - https://api.github.com/zen
      - example.com
    volumes:
      - ${SANDBOX_STATE_DIR:?run this through just}/ca.crt:/usr/local/share/ca-certificates/sandbox-proxy.crt:ro
      - ${SANDBOX_RUN_DIR:?run this through just}:/run/sandbox/proxy
      - ./egress-selftest.sh:/usr/local/bin/egress-selftest:ro
