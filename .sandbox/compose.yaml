name: agent-sandbox

# Two containers, not one pod. A pod would share the network of both containers (a setting of podman-compose).
x-podman: { in_pod: false }

# The two sandbox containers. `just sandbox run` and `just sandbox build` start them. The justfile sets the SANDBOX_* variables.
# Both containers have no network. The host proxy (.sandbox/proxy) is their only way out.

# The environment of both containers. The values are not secrets.
# The placeholders: the proxy swaps in the real tokens. They must equal the proxy_value lines of the proxy config.
x-env: &env
  GH_TOKEN: sandbox-placeholder-GH_TOKEN
  CLAUDE_CODE_OAUTH_TOKEN: sandbox-placeholder-CLAUDE_CODE_OAUTH_TOKEN
  QWEN_API_KEY: sandbox-placeholder-QWEN_API_KEY
  GHCR_PUSH_TOKEN: sandbox-placeholder-GHCR_PUSH_TOKEN
  # The relay in sandbox-entry listens here. A tool that ignores these variables has no route.
  HTTP_PROXY: http://127.0.0.1:3128
  HTTPS_PROXY: http://127.0.0.1:3128
  http_proxy: http://127.0.0.1:3128
  https_proxy: http://127.0.0.1:3128
  NO_PROXY: localhost,127.0.0.1
  NODE_USE_ENV_PROXY: "1"
  # The CA of the proxy is a read-only mount over this file. Each tool needs to read it.
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  NODE_OPTIONS: --use-system-ca
  # The home, the clone and the git identity of the agent.
  HOME: /home/agent
  TMPDIR: /tmp
  COLORTERM: truecolor
  SANDBOX_WORKSPACE: /home/agent/engineersdaybook
  REPO_URL: https://github.com/raghav19/engineersdaybook
  GIT_AUTHOR_NAME: agent
  GIT_COMMITTER_NAME: agent
  GIT_AUTHOR_EMAIL: agent@localhost
  GIT_COMMITTER_EMAIL: agent@localhost
  # The tool settings.
  MISE_TRUSTED_CONFIG_PATHS: /home/agent/engineersdaybook
  MISE_IGNORED_CONFIG_PATHS: /home/agent/engineersdaybook/mise.toml
  CLAUDE_CONFIG_DIR: /home/agent/.claude
  DISABLE_UPDATES: "1"
  HEADROOM_HARD_WATCHDOG_SECS: "0"
  # The justfile sets this variable. It is the branch of the host checkout.
  SANDBOX_BRANCH: ${SANDBOX_BRANCH}

x-sandbox: &sandbox
  image: localhost/sandbox-dev:latest
  runtime: crun
  network_mode: none
  # The container starts as the user agent. In rootless Podman, that user is a subuid, not you.
  user: agent
  working_dir: /home/agent
  cap_drop: [ALL]
  security_opt: [no-new-privileges]
  pids_limit: 1024
  mem_limit: 3g
  cpus: 4
  tmpfs: [/tmp, /run]
  environment: *env

# YAML cannot join two lists, so each service has its own list of mounts.
# The first four mounts of each list have the flag :ro. The agent cannot change the CA, the socket folder, the repo or the theme.
services:
  # The agent sandbox.
  # It has no capability.
  sandbox:
    <<: *sandbox
    container_name: sandbox
    read_only: true
    volumes:
      - ${SANDBOX_CA}:/etc/ssl/certs/ca-certificates.crt:ro
      - ${SANDBOX_SOCKET}:/run/sandbox/proxy:ro
      - ${SANDBOX_GIT_DIR}:/run/sandbox/source:ro
      - ${SANDBOX_THEME}:/home/agent/.omarchy-theme:ro
      - sandbox-home:/home/agent

  # The build sandbox. It adds the capabilities that buildah needs for chroot isolation. It has no SYS_ADMIN and a writable root.
  # It has its own home. It sees the home of the agent at /src, read-only.
  # The user agent keeps these capabilities. CHOWN, DAC_OVERRIDE and FOWNER set the owner and the access of files.
  # SYS_CHROOT is for the chroot of a build step. SETUID and SETGID are for a USER step.
  sandbox-build:
    <<: *sandbox
    container_name: sandbox-build
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SYS_CHROOT, SETUID, SETGID]
    environment:
      <<: *env
      BUILDAH_ISOLATION: chroot
    volumes:
      - ${SANDBOX_CA}:/etc/ssl/certs/ca-certificates.crt:ro
      - ${SANDBOX_SOCKET}:/run/sandbox/proxy:ro
      - ${SANDBOX_GIT_DIR}:/run/sandbox/source:ro
      - ${SANDBOX_THEME}:/home/agent/.omarchy-theme:ro
      - sandbox-build-home:/home/agent
      - sandbox-home:/src:ro

# The names do not change, so the volumes of the earlier setup keep working.
volumes:
  sandbox-home: { name: sandbox-home }
  sandbox-build-home: { name: sandbox-build-home }
