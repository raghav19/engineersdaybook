name: agent-sandbox

# One container, not one pod (a setting of podman-compose).
x-podman: { in_pod: false }

# The agent sandbox. `just sandbox run` starts it. The justfile sets the SANDBOX_* variables.
# The container has no network. The host proxy (.sandbox/proxy) is its only way out.
services:
  sandbox:
    image: localhost/sandbox-dev:latest
    container_name: sandbox
    runtime: crun
    network_mode: none
    # The container starts as the user agent. In rootless Podman, that user is a subuid, not you.
    user: agent
    working_dir: /home/agent
    # The container is healthy after sandbox-start writes /tmp/sandbox-ready. `podman ps` shows the state.
    # A failed check in the first 180 s does not count. After that, three failed checks in a row make the container unhealthy.
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/sandbox-ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    # The root file system is read-only.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    pids_limit: 1024
    mem_limit: 3g
    cpus: 4
    tmpfs: [/tmp, /run]
    # The environment of the container. The values are not secrets.
    # The placeholders: the proxy swaps in the real tokens. They must equal the proxy_value lines of the proxy config.
    environment:
      GH_TOKEN: sandbox-placeholder-GH_TOKEN
      CLAUDE_CODE_OAUTH_TOKEN: sandbox-placeholder-CLAUDE_CODE_OAUTH_TOKEN
      QWEN_API_KEY: sandbox-placeholder-QWEN_API_KEY
      GHCR_PUSH_TOKEN: sandbox-placeholder-GHCR_PUSH_TOKEN
      # The relay in sandbox-entry listens here. A tool that ignores these variables has no route.
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128
      http_proxy: http://127.0.0.1:3128
      https_proxy: http://127.0.0.1:3128
      NO_PROXY: localhost,127.0.0.1
      NODE_USE_ENV_PROXY: "1"
      # The CA of the proxy is a read-only mount over this file. Each tool needs to read it.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      NODE_OPTIONS: --use-system-ca
      # The home, the clone and the git identity of the agent.
      HOME: /home/agent
      TMPDIR: /tmp
      COLORTERM: truecolor
      SANDBOX_WORKSPACE: /home/agent/engineersdaybook
      REPO_URL: https://github.com/raghav19/engineersdaybook
      GIT_AUTHOR_NAME: agent
      GIT_COMMITTER_NAME: agent
      GIT_AUTHOR_EMAIL: agent@localhost
      GIT_COMMITTER_EMAIL: agent@localhost
      # The tool settings.
      MISE_TRUSTED_CONFIG_PATHS: /home/agent/engineersdaybook
      MISE_IGNORED_CONFIG_PATHS: /home/agent/engineersdaybook/mise.toml
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      DISABLE_UPDATES: "1"
      HEADROOM_HARD_WATCHDOG_SECS: "0"
      # The justfile sets this variable. It is the branch of the host checkout.
      SANDBOX_BRANCH: ${SANDBOX_BRANCH}
    volumes:
      # The first four mounts have the flag :ro. The agent cannot change the CA, the socket folder, the repo or the theme.
      - ${SANDBOX_CA}:/etc/ssl/certs/ca-certificates.crt:ro
      - ${SANDBOX_SOCKET}:/run/sandbox/proxy:ro
      - ${SANDBOX_GIT_DIR}:/run/sandbox/source:ro
      - ${SANDBOX_THEME}:/home/agent/.omarchy-theme:ro
      - sandbox-home:/home/agent

# The name does not change, so the volume of the earlier setup keeps working.
volumes:
  sandbox-home: { name: sandbox-home }
