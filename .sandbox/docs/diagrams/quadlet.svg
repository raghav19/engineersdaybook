<rect x="0" y="0" width="1300" height="1340" fill="#ffffff"/>
<text x="20" y="38" font-size="22" font-weight="bold" fill="#000000">How Quadlet controls the sandbox</text>

<rect x="20" y="640" width="310" height="110" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="175" y="668.8" font-weight="bold">The four .container files</text><text x="175" y="689.8">sandbox-agent, sandbox-builder</text><text x="175" y="710.8">sandbox-proxy</text><text x="175" y="731.8">sandbox-builder-proxy</text></g>

<rect x="380" y="635" width="220" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="490" y="679.3" font-weight="bold">Quadlet generator</text><text x="490" y="700.3">reads the .container files</text><text x="490" y="721.3">writes the .service files</text></g>

<rect x="20" y="860" width="340" height="84" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="190" y="886.3" font-weight="bold">Podman limits are not used</text><text x="190" y="907.3">--memory and --cpus: gVisor ignores them</text><text x="190" y="928.3">(runsc.conf: ignore-cgroups)</text></g>

<rect x="20" y="980" width="340" height="84" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="190" y="1006.3" font-weight="bold">PartOf the agent</text><text x="190" y="1027.3">A stop of sandbox-agent.service</text><text x="190" y="1048.3">stops the builder and both proxies</text></g>

<rect x="700" y="90" width="580" height="250" rx="12" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<line x1="700" y1="130" x2="1280" y2="130" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="712" y="115.3">sandbox-builder-proxy.service: one cgroup</text></g>

<rect x="720" y="145" width="540" height="70" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="990" y="174.8" font-weight="bold">Limits of the service</text><text x="990" y="195.8">MemoryMax=256M   MemorySwapMax=0   TasksMax=256</text></g>

<rect x="720" y="240" width="160" height="76" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="800" y="272.8" font-weight="bold">podman run</text><text x="800" y="293.8">--cgroups=split</text></g>

<rect x="920" y="240" width="110" height="76" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="975" y="272.8" font-weight="bold">conmon</text><text x="975" y="293.8">in the cgroup</text></g>

