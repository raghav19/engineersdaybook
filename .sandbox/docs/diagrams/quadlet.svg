<rect x="310" y="398" width="230" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="425" y="424.3" font-weight="bold">Quadlet generator</text><text x="425" y="445.3">reads the .container files</text><text x="425" y="466.3">writes the .service files</text></g>

<rect x="20" y="720" width="400" height="84" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="220" y="746.3" font-weight="bold">Podman limits are not used</text><text x="220" y="767.3">--memory and --cpus: gVisor ignores them</text><text x="220" y="788.3">(runsc.conf: ignore-cgroups)</text></g>

