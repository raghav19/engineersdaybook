<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="810" viewBox="0 0 1380 810" font-family="Helvetica, Arial, sans-serif" fill="#000000">
<defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect width="1380" height="810" fill="#ffffff"/>
<text x="20" y="30" dominant-baseline="central" font-size="22" font-weight="bold">The agent sandbox in six concepts</text>
<rect x="290" y="90" width="620" height="520" rx="16" fill="#ffffff" stroke="#333333" stroke-width="2" stroke-dasharray="8 4"/>
<text font-weight="bold" x="338" y="107.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="338" dy="0">The agent sandbox: a rootless Podman container on gVisor</tspan><tspan x="338" dy="19">read-only root, no capabilities, no network device</tspan></text>
<rect x="20" y="180" width="220" height="70" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="130.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="130.0" dy="0" font-weight="bold">Your request</tspan><tspan x="130.0" dy="17">a prompt in a Herdr pane</tspan></text>
<rect x="320" y="170" width="270" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="455.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="455.0" dy="0" font-weight="bold">Agent</tspan><tspan x="455.0" dy="17">Claude Code or Qwen Code</tspan></text>
<rect x="610" y="170" width="270" height="90" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="745.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="745.0" dy="0" font-weight="bold">Software</tspan><tspan x="745.0" dy="17">the tools of the image</tspan><tspan x="745.0" dy="17">docker build goes to the builder</tspan></text>
<rect x="320" y="340" width="560" height="90" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="600.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="600.0" dy="0" font-weight="bold">Workspace</tspan><tspan x="600.0" dy="17">a private clone of the repo in /home/agent</tspan><tspan x="600.0" dy="17">The .git folder of your checkout is read-only.</tspan></text>
<rect x="320" y="480" width="560" height="90" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="600.0" y="516.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="600.0" dy="0" font-weight="bold">Saved state</tspan><tspan x="600.0" dy="17">The volume sandbox-home keeps the clone, the logins and the histories.</tspan></text>
<rect x="990" y="170" width="360" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1170.0" y="189.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1170.0" dy="0" font-weight="bold">Network gate</tspan><tspan x="1170.0" dy="17">proxy.sock leads to the host proxy.</tspan><tspan x="1170.0" dy="17">Listed hosts, methods and paths pass.</tspan><tspan x="1170.0" dy="17">Other requests get 403.</tspan></text>
<rect x="990" y="340" width="360" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1170.0" y="359.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1170.0" dy="0" font-weight="bold">Key holder</tspan><tspan x="1170.0" dy="17">The host proxy swaps a placeholder</tspan><tspan x="1170.0" dy="17">for the real token, for listed hosts only.</tspan><tspan x="1170.0" dy="17">The real tokens come from Bitwarden.</tspan></text>
<rect x="990" y="510" width="360" height="90" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="1170.0" y="538.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1170.0" dy="0" font-weight="bold">Listed hosts</tspan><tspan x="1170.0" dy="17">GitHub, the model APIs, registries</tspan><tspan x="1170.0" dy="17">and the listed docs sites</tspan></text>
<rect x="290" y="690" width="620" height="90" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="600.0" y="709.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="600.0" dy="0" font-weight="bold">You</tspan><tspan x="600.0" dy="17">Approve tool calls in Claude Code. Follow each step in Herdr and in the audit log.</tspan><tspan x="600.0" dy="17">Stop it with just sandbox rm. Read the diff before you merge.</tspan><tspan x="600.0" dy="17">Undo: each task has its own worktree and branch.</tspan></text>
<line x1="240" y1="215.0" x2="320" y2="215.0" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="455.0" y1="260" x2="455.0" y2="340" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="880" y1="215.0" x2="990" y2="215.0" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<text x="935.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-style="italic">requests</text>
<line x1="1170.0" y1="260" x2="1170.0" y2="340" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="1170.0" y1="430" x2="1170.0" y2="510" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="600.0" y1="690" x2="600.0" y2="610" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<text x="608.0" y="650.0" text-anchor="start" dominant-baseline="central" font-size="14" font-style="italic">allow or deny</text>
<circle cx="314" cy="114" r="16" fill="#6c8ebf"/>
<text x="314" y="114" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">1</text>
<circle cx="324" cy="344" r="16" fill="#6c8ebf"/>
<text x="324" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">2</text>
<circle cx="324" cy="484" r="16" fill="#6c8ebf"/>
<text x="324" y="484" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">5</text>
<circle cx="994" cy="174" r="16" fill="#6c8ebf"/>
<text x="994" y="174" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">3</text>
<circle cx="994" cy="344" r="16" fill="#6c8ebf"/>
<text x="994" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">4</text>
<circle cx="294" cy="694" r="16" fill="#6c8ebf"/>
<text x="294" y="694" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">6</text>
</svg>
