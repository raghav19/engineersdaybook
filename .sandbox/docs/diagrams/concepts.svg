<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="810" viewBox="0 0 1380 810" font-family="Helvetica, Arial, sans-serif" fill="#000000">
<defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect width="1380" height="810" fill="#ffffff"/>
<text x="20" y="30" dominant-baseline="central" font-size="22" font-weight="bold">The six concepts of an agent sandbox</text>
<rect x="290" y="90" width="620" height="520" rx="16" fill="#ffffff" stroke="#333333" stroke-width="2" stroke-dasharray="8 4"/>
<text font-weight="bold" x="338" y="107.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="338" dy="0">The sandbox: a computer of its own</tspan><tspan x="338" dy="19">A container starts fast. A user-space kernel</tspan><tspan x="338" dy="19">or a microVM gives a stronger wall.</tspan></text>
<rect x="20" y="180" width="220" height="70" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="130.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="130.0" dy="0" font-weight="bold">Your request</tspan><tspan x="130.0" dy="17">a task for the agent</tspan></text>
<rect x="320" y="170" width="270" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="455.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="455.0" dy="0" font-weight="bold">Agent</tspan><tspan x="455.0" dy="17">the model and its client</tspan></text>
<rect x="610" y="170" width="270" height="90" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="745.0" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="745.0" dy="0" font-weight="bold">Software</tspan><tspan x="745.0" dy="17">the tools that the task needs</tspan></text>
<rect x="320" y="340" width="560" height="90" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="600.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="600.0" dy="0" font-weight="bold">Workspace</tspan><tspan x="600.0" dy="17">only the files and folders that the task needs</tspan><tspan x="600.0" dy="17">Mount the rest read-only, or leave it out.</tspan></text>
<rect x="320" y="480" width="560" height="90" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="600.0" y="516.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="600.0" dy="0" font-weight="bold">Saved state</tspan><tspan x="600.0" dy="17">Decide what stays after a restart: a volume, a snapshot or nothing.</tspan></text>
<rect x="990" y="170" width="360" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1170.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1170.0" dy="0" font-weight="bold">Network gate</tspan><tspan x="1170.0" dy="17">No network device. One way out, to a proxy.</tspan><tspan x="1170.0" dy="17">Listed hosts pass. The proxy blocks the rest.</tspan></text>
<rect x="990" y="340" width="360" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1170.0" y="359.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1170.0" dy="0" font-weight="bold">Key holder</tspan><tspan x="1170.0" dy="17">Real keys stay outside the sandbox.</tspan><tspan x="1170.0" dy="17">The sandbox holds placeholders. The proxy</tspan><tspan x="1170.0" dy="17">swaps in a key for its listed hosts only.</tspan></text>
<rect x="990" y="510" width="360" height="90" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="1170.0" y="546.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1170.0" dy="0" font-weight="bold">Outside services</tspan><tspan x="1170.0" dy="17">APIs, websites and registries</tspan></text>
<rect x="290" y="690" width="620" height="90" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="600.0" y="709.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="600.0" dy="0" font-weight="bold">You</tspan><tspan x="600.0" dy="17">Approve each risky action. Follow each step in a log.</tspan><tspan x="600.0" dy="17">Stop the sandbox at any time.</tspan><tspan x="600.0" dy="17">Undo the changes of one task, not the whole workspace.</tspan></text>
<path d="M240 215.0 L320 215.0" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<path d="M455.0 260 C455.0 300.0 600.0 300.0 600.0 340" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<path d="M880 215.0 L990 215.0" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<text x="935.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-style="italic">requests</text>
<path d="M1170.0 260 L1170.0 340" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<path d="M1170.0 430 L1170.0 510" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<path d="M600.0 690 L600.0 610" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<text x="608.0" y="650.0" text-anchor="start" dominant-baseline="central" font-size="14" font-style="italic">allow or deny</text>
<circle cx="314" cy="114" r="16" fill="#6c8ebf"/>
<text x="314" y="114" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">1</text>
<circle cx="324" cy="344" r="16" fill="#6c8ebf"/>
<text x="324" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">2</text>
<circle cx="324" cy="484" r="16" fill="#6c8ebf"/>
<text x="324" y="484" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">5</text>
<circle cx="994" cy="174" r="16" fill="#6c8ebf"/>
<text x="994" y="174" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">3</text>
<circle cx="994" cy="344" r="16" fill="#6c8ebf"/>
<text x="994" y="344" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">4</text>
<circle cx="294" cy="694" r="16" fill="#6c8ebf"/>
<text x="294" y="694" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">6</text>
</svg>
