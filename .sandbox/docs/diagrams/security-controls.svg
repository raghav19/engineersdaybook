<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1130" viewBox="0 0 1800 1130" font-family="Helvetica, Arial, sans-serif" fill="#000000">
<defs>
<marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d79b00"/></marker>
</defs>
<rect width="1800" height="1130" fill="#ffffff"/>
<text x="20" y="30" dominant-baseline="central" font-size="22" font-weight="bold">Security controls of the agent sandbox</text>
<rect x="20" y="80" width="580" height="506" rx="16" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<line x1="20" y1="140" x2="600" y2="140" stroke="#82b366" stroke-width="2"/>
<text x="30" y="100.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="30" dy="0">Agent sandbox</tspan><tspan x="30" dy="19">rootless Podman, gVisor</tspan></text>
<rect x="20" y="666" width="580" height="428" rx="16" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<line x1="20" y1="726" x2="600" y2="726" stroke="#82b366" stroke-width="2"/>
<text x="30" y="686.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="30" dy="0">Builder (new for each session)</tspan><tspan x="30" dy="19">rootless Podman, gVisor</tspan></text>
<rect x="1020" y="80" width="480" height="506" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<line x1="1020" y1="140" x2="1500" y2="140" stroke="#6c8ebf" stroke-width="2"/>
<text x="1030" y="100.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="1030" dy="0">Host proxy container</tspan><tspan x="1030" dy="19">rootless Podman</tspan></text>
<rect x="1020" y="666" width="480" height="350" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<line x1="1020" y1="726" x2="1500" y2="726" stroke="#6c8ebf" stroke-width="2"/>
<text x="1030" y="686.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="1030" dy="0">Builder proxy container</tspan><tspan x="1030" dy="19">rootless Podman</tspan></text>
<rect x="40" y="156" width="250" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="165.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="165.0" dy="0">Agent tools</tspan><tspan x="165.0" dy="19">Claude, Qwen, Herdr, Fresh</tspan><tspan x="165.0" dy="19">hold placeholders only</tspan></text>
<rect x="380" y="156" width="200" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="480.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="480.0" dy="0">socat relay</tspan><tspan x="480.0" dy="19">127.0.0.1:3128</tspan><tspan x="480.0" dy="19">to proxy.sock</tspan></text>
<rect x="40" y="262" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">gVisor</tspan><tspan x="170.0" dy="17">Syscalls go to gVisor,</tspan><tspan x="170.0" dy="17">not to the host kernel</tspan></text>
<rect x="320" y="262" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">No network device</tspan><tspan x="450.0" dy="17">The proxy socket is</tspan><tspan x="450.0" dy="17">the only way out</tspan></text>
<rect x="40" y="340" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">No root, no capability</tspan><tspan x="170.0" dy="17">user agent (a subuid),</tspan><tspan x="170.0" dy="17">no-new-privileges</tspan></text>
<rect x="320" y="340" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Read-only root file system</tspan><tspan x="450.0" dy="17">tmpfs for /tmp and /run,</tspan><tspan x="450.0" dy="17">/etc/docker read-only</tspan></text>
<rect x="40" y="418" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Read-only mounts</tspan><tspan x="170.0" dy="17">CA, proxy socket,</tspan><tspan x="170.0" dy="17">builder socket</tspan></text>
<rect x="320" y="418" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Limits in the Quadlet service</tspan><tspan x="450.0" dy="17">3 GB, 4 CPUs, 2048 threads,</tspan><tspan x="450.0" dy="17">no swap</tspan></text>
<rect x="40" y="496" width="540" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="310.0" y="514.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="310.0" dy="0">Private clone of the repo</tspan><tspan x="310.0" dy="17">Your .git is read-only. The agent</tspan><tspan x="310.0" dy="17">cannot plant a git hook.</tspan></text>
<rect x="40" y="742" width="250" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="165.0" y="761.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="165.0" dy="0">BuildKit (buildkitd)</tspan><tspan x="165.0" dy="19">runs the build steps</tspan><tspan x="165.0" dy="19">of the agent</tspan></text>
<rect x="380" y="742" width="200" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="480.0" y="761.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="480.0" dy="0">socat relay</tspan><tspan x="480.0" dy="19">127.0.0.1:3129</tspan><tspan x="480.0" dy="19">to proxy.sock</tspan></text>
<rect x="40" y="848" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="866.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">gVisor</tspan><tspan x="170.0" dy="17">Syscalls go to gVisor,</tspan><tspan x="170.0" dy="17">not to the host kernel</tspan></text>
<rect x="320" y="848" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="866.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">No network device</tspan><tspan x="450.0" dy="17">The proxy socket is</tspan><tspan x="450.0" dy="17">the only way out</tspan></text>
<rect x="40" y="926" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="944.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">No token, no secret</tspan><tspan x="170.0" dy="17">The builder holds</tspan><tspan x="170.0" dy="17">none</tspan></text>
<rect x="320" y="926" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="944.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Three capabilities</tspan><tspan x="450.0" dy="17">SETUID, SETGID, SYS_CHROOT,</tspan><tspan x="450.0" dy="17">no others</tspan></text>
<rect x="40" y="1004" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="1022.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Cache in memory</tspan><tspan x="170.0" dy="17">tmpfs of 1 GB, gone with</tspan><tspan x="170.0" dy="17">the session</tspan></text>
<rect x="320" y="1004" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="1022.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Limits in the Quadlet service</tspan><tspan x="450.0" dy="17">2 GB, 2 CPUs, 1024 threads,</tspan><tspan x="450.0" dy="17">no swap</tspan></text>
<rect x="720" y="156" width="180" height="76" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="810.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="810.0" dy="0">proxy.sock</tspan><tspan x="810.0" dy="19">one Unix socket,</tspan><tspan x="810.0" dy="19">the only way out</tspan></text>
<rect x="720" y="742" width="180" height="76" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="810.0" y="761.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="810.0" dy="0">proxy.sock</tspan><tspan x="810.0" dy="19">one Unix socket,</tspan><tspan x="810.0" dy="19">the only way out</tspan></text>
<rect x="1040" y="156" width="440" height="76" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1260.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1260.0" dy="0">iron-proxy</tspan><tspan x="1260.0" dy="19">socat joins proxy.sock to</tspan><tspan x="1260.0" dy="19">port 18080 in the container</tspan></text>
<rect x="1040" y="262" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Allowlist of hosts</tspan><tspan x="1147.5" dy="17">Any other host</tspan><tspan x="1147.5" dy="17">gets 403</tspan></text>
<rect x="1265" y="262" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Path rules</tspan><tspan x="1372.5" dy="17">Write to one repo and</tspan><tspan x="1372.5" dy="17">one ghcr.io namespace</tspan></text>
<rect x="1040" y="340" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">TLS ended with its CA</tspan><tspan x="1147.5" dy="17">ca.key stays here;</tspan><tspan x="1147.5" dy="17">sandbox gets ca.crt</tspan></text>
<rect x="1265" y="340" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Token swap</tspan><tspan x="1372.5" dy="17">Placeholder to real</tspan><tspan x="1372.5" dy="17">token, listed hosts</tspan></text>
<rect x="1040" y="418" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Audit log</tspan><tspan x="1147.5" dy="17">One JSON line for</tspan><tspan x="1147.5" dy="17">each request</tspan></text>
<rect x="1265" y="418" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">No root, no capability</tspan><tspan x="1372.5" dy="17">Read-only root fs,</tspan><tspan x="1372.5" dy="17">no-new-privileges</tspan></text>
<rect x="1040" y="496" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="514.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Limits in the service</tspan><tspan x="1147.5" dy="17">512 MB, 512 threads,</tspan><tspan x="1147.5" dy="17">no swap</tspan></text>
<rect x="1265" y="496" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="514.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Access token</tspan><tspan x="1372.5" dy="17">systemd-creds, encrypted</tspan><tspan x="1372.5" dy="17">not given to iron-proxy</tspan></text>
<rect x="1040" y="742" width="440" height="76" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1260.0" y="761.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1260.0" dy="0">iron-proxy</tspan><tspan x="1260.0" dy="19">socat joins proxy.sock to</tspan><tspan x="1260.0" dy="19">port 18080 in the container</tspan></text>
<rect x="1040" y="848" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="866.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Allowlist of host names</tspan><tspan x="1147.5" dy="17">TLS passes through.</tspan><tspan x="1147.5" dy="17">Other hosts get 403.</tspan></text>
<rect x="1265" y="848" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="866.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">No token, no CA</tspan><tspan x="1372.5" dy="17">The proxy holds no</tspan><tspan x="1372.5" dy="17">secret.</tspan></text>
<rect x="1040" y="926" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="944.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">No root, no capability</tspan><tspan x="1147.5" dy="17">Read-only root fs,</tspan><tspan x="1147.5" dy="17">no-new-privileges</tspan></text>
<rect x="1265" y="926" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="944.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Limits in the service</tspan><tspan x="1372.5" dy="17">256 MB, 256 threads,</tspan><tspan x="1372.5" dy="17">no swap</tspan></text>
<rect x="1620" y="60" width="160" height="70" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="1700.0" y="85.5" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold"><tspan x="1700.0" dy="0">Bitwarden</tspan><tspan x="1700.0" dy="19">Secrets Manager</tspan></text>
<rect x="1620" y="170" width="160" height="680" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1700.0" y="500.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1700.0" dy="0">Internet</tspan><tspan x="1700.0" dy="19">allowed hosts</tspan></text>
