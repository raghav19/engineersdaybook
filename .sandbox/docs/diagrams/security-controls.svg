<text x="425.0" y="357.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="425.0" dy="0">Path rules for writes</tspan><tspan x="425.0" dy="17">One repo, one namespace</tspan></text>
<rect x="320" y="398" width="210" height="98" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="425.0" y="421.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="425.0" dy="0">Proxy ends HTTPS</tspan><tspan x="425.0" dy="17">Its own CA lets it read</tspan><tspan x="425.0" dy="17">the request. Sandbox</tspan><tspan x="425.0" dy="17">trusts only this CA.</tspan></text>
<rect x="320" y="506" width="210" height="44" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="425.0" y="528.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="425.0" dy="0">Audit log</tspan></text>
