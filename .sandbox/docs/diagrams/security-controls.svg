<text x="450.0" y="1037.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">3 capabilities only</tspan><tspan x="450.0" dy="17">SETUID, SETGID, SYS_CHROOT</tspan></text>
