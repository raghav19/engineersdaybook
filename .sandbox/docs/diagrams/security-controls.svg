<text x="1700.0" y="125.5" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold"><tspan x="1700.0" dy="0">Bitwarden</tspan><tspan x="1700.0" dy="19">Secrets Manager</tspan></text>
