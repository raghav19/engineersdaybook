</defs>
<rect width="1800" height="1320" fill="#ffffff"/>
<text x="20" y="30" dominant-baseline="central" font-size="22" font-weight="bold">Security controls of the agent sandbox</text>
<rect x="20" y="80" width="580" height="510" rx="16" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<line x1="20" y1="140" x2="600" y2="140" stroke="#82b366" stroke-width="2"/>
<text x="30" y="100.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="30" dy="0">Agent sandbox</tspan><tspan x="30" dy="19">rootless Podman</tspan></text>
<rect x="1020" y="80" width="480" height="510" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<line x1="1020" y1="140" x2="1500" y2="140" stroke="#6c8ebf" stroke-width="2"/>
<text x="1030" y="100.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="1030" dy="0">Host proxy container</tspan><tspan x="1030" dy="19">rootless Podman</tspan></text>
<rect x="20" y="810" width="580" height="470" rx="16" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<line x1="20" y1="870" x2="600" y2="870" stroke="#82b366" stroke-width="2"/>
<text x="30" y="830.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="30" dy="0">Builder (new for each session)</tspan><tspan x="30" dy="19">rootless Podman</tspan></text>
<rect x="1020" y="810" width="480" height="378" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<line x1="1020" y1="870" x2="1500" y2="870" stroke="#6c8ebf" stroke-width="2"/>
<text x="1030" y="830.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="1030" dy="0">Builder proxy container</tspan><tspan x="1030" dy="19">rootless Podman</tspan></text>
<rect x="40" y="436" width="540" height="134" rx="16" fill="#ffffff" stroke="#9673a6" stroke-width="2"/>
<line x1="40" y1="468" x2="580" y2="468" stroke="#9673a6" stroke-width="2"/>
<text x="50" y="452.0" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="50" dy="0">gVisor: userspace kernel</tspan></text>
<rect x="40" y="880" width="540" height="134" rx="16" fill="#ffffff" stroke="#9673a6" stroke-width="2"/>
<line x1="40" y1="912" x2="580" y2="912" stroke="#9673a6" stroke-width="2"/>
<text x="50" y="896.0" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="50" dy="0">gVisor: userspace kernel</tspan></text>
<rect x="40" y="156" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">No network device</tspan><tspan x="170.0" dy="17">The proxy socket is</tspan><tspan x="170.0" dy="17">the only way out</tspan></text>
<rect x="320" y="156" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">No root, no capability</tspan><tspan x="450.0" dy="17">user agent (a subuid),</tspan><tspan x="450.0" dy="17">no-new-privileges</tspan></text>
<rect x="40" y="234" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Read-only root file system</tspan><tspan x="170.0" dy="17">tmpfs for /tmp and /run,</tspan><tspan x="170.0" dy="17">/etc/docker read-only</tspan></text>
<rect x="320" y="234" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Read-only mounts</tspan><tspan x="450.0" dy="17">CA, proxy socket,</tspan><tspan x="450.0" dy="17">builder socket</tspan></text>
<rect x="40" y="312" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Limits in the Quadlet service</tspan><tspan x="170.0" dy="17">3 GB, 4 CPUs, 2048 threads,</tspan><tspan x="170.0" dy="17">no swap</tspan></text>
<rect x="320" y="312" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Private clone of the repo</tspan><tspan x="450.0" dy="17">Your .git is read-only:</tspan><tspan x="450.0" dy="17">no git hook for the agent</tspan></text>
<rect x="60" y="480" width="250" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="185.0" y="499.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="185.0" dy="0">Agent tools</tspan><tspan x="185.0" dy="19">Claude, Qwen, Herdr, Fresh</tspan><tspan x="185.0" dy="19">hold placeholders only</tspan></text>
<rect x="400" y="480" width="160" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="480.0" y="499.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="480.0" dy="0">socat relay</tspan><tspan x="480.0" dy="19">127.0.0.1:3128</tspan><tspan x="480.0" dy="19">to proxy.sock</tspan></text>
<rect x="60" y="924" width="250" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="185.0" y="943.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="185.0" dy="0">BuildKit (buildkitd)</tspan><tspan x="185.0" dy="19">reached by docker over</tspan><tspan x="185.0" dy="19">buildkitd.sock</tspan></text>
<rect x="400" y="924" width="160" height="76" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="480.0" y="943.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="480.0" dy="0">socat relay</tspan><tspan x="480.0" dy="19">127.0.0.1:3129</tspan><tspan x="480.0" dy="19">to proxy.sock</tspan></text>
<rect x="40" y="1034" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="1052.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">No network device</tspan><tspan x="170.0" dy="17">The proxy socket is</tspan><tspan x="170.0" dy="17">the only way out</tspan></text>
<rect x="320" y="1034" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="1052.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">No token, no secret</tspan><tspan x="450.0" dy="17">The builder holds</tspan><tspan x="450.0" dy="17">none</tspan></text>
<rect x="40" y="1112" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="1130.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Three capabilities</tspan><tspan x="170.0" dy="17">SETUID, SETGID, SYS_CHROOT,</tspan><tspan x="170.0" dy="17">no others</tspan></text>
<rect x="320" y="1112" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="1130.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Cache in memory</tspan><tspan x="450.0" dy="17">tmpfs of 1 GB, gone with</tspan><tspan x="450.0" dy="17">the session</tspan></text>
<rect x="40" y="1190" width="260" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="1208.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Limits in the Quadlet service</tspan><tspan x="170.0" dy="17">2 GB, 2 CPUs, 1024 threads,</tspan><tspan x="170.0" dy="17">no swap</tspan></text>
<rect x="720" y="480" width="180" height="76" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="810.0" y="499.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="810.0" dy="0">proxy.sock</tspan><tspan x="810.0" dy="19">one Unix socket,</tspan><tspan x="810.0" dy="19">the only way out</tspan></text>
<rect x="720" y="924" width="180" height="76" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="810.0" y="943.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="810.0" dy="0">proxy.sock</tspan><tspan x="810.0" dy="19">one Unix socket,</tspan><tspan x="810.0" dy="19">the only way out</tspan></text>
<rect x="1040" y="156" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Allowlist of hosts</tspan><tspan x="1147.5" dy="17">Any other host</tspan><tspan x="1147.5" dy="17">gets 403</tspan></text>
<rect x="1265" y="156" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="174.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Path rules</tspan><tspan x="1372.5" dy="17">Write to one repo and</tspan><tspan x="1372.5" dy="17">one ghcr.io namespace</tspan></text>
<rect x="1040" y="234" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">TLS ended with its CA</tspan><tspan x="1147.5" dy="17">ca.key stays here;</tspan><tspan x="1147.5" dy="17">sandbox gets ca.crt</tspan></text>
<rect x="1265" y="234" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="252.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Token swap</tspan><tspan x="1372.5" dy="17">Placeholder to real</tspan><tspan x="1372.5" dy="17">token, listed hosts</tspan></text>
<rect x="1040" y="312" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Audit log</tspan><tspan x="1147.5" dy="17">One JSON line for</tspan><tspan x="1147.5" dy="17">each request</tspan></text>
<rect x="1265" y="312" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="330.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">No root, no capability</tspan><tspan x="1372.5" dy="17">Read-only root fs,</tspan><tspan x="1372.5" dy="17">no-new-privileges</tspan></text>
<rect x="1040" y="390" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="408.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Limits in the service</tspan><tspan x="1147.5" dy="17">512 MB, 512 threads,</tspan><tspan x="1147.5" dy="17">no swap</tspan></text>
<rect x="1265" y="390" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="408.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Access token</tspan><tspan x="1372.5" dy="17">systemd-creds, encrypted</tspan><tspan x="1372.5" dy="17">not given to iron-proxy</tspan></text>
<rect x="1040" y="480" width="440" height="76" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1260.0" y="499.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1260.0" dy="0">iron-proxy</tspan><tspan x="1260.0" dy="19">socat joins proxy.sock to</tspan><tspan x="1260.0" dy="19">port 18080 in the container</tspan></text>
<rect x="1040" y="924" width="440" height="76" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1260.0" y="943.0" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1260.0" dy="0">iron-proxy</tspan><tspan x="1260.0" dy="19">socat joins proxy.sock to</tspan><tspan x="1260.0" dy="19">port 18080 in the container</tspan></text>
<rect x="1040" y="1020" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="1038.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">Allowlist of host names</tspan><tspan x="1147.5" dy="17">TLS passes through.</tspan><tspan x="1147.5" dy="17">Other hosts get 403.</tspan></text>
<rect x="1265" y="1020" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="1038.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">No token, no CA</tspan><tspan x="1372.5" dy="17">The proxy holds no</tspan><tspan x="1372.5" dy="17">secret.</tspan></text>
<rect x="1040" y="1098" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1147.5" y="1116.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1147.5" dy="0">No root, no capability</tspan><tspan x="1147.5" dy="17">Read-only root fs,</tspan><tspan x="1147.5" dy="17">no-new-privileges</tspan></text>
<rect x="1265" y="1098" width="215" height="70" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1372.5" y="1116.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1372.5" dy="0">Limits in the service</tspan><tspan x="1372.5" dy="17">256 MB, 256 threads,</tspan><tspan x="1372.5" dy="17">no swap</tspan></text>
<rect x="20" y="670" width="1480" height="60" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="760.0" y="690.5" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold"><tspan x="760.0" dy="0">Host kernel (Linux)</tspan><tspan x="760.0" dy="19">gVisor stands between each sandbox and this kernel. The proxy containers run without gVisor.</tspan></text>
