<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="1326" viewBox="0 0 1890 1326" font-family="Helvetica, Arial, sans-serif" fill="#000000">
<defs>
<marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d79b00"/></marker>
</defs>
<rect width="1890" height="1326" fill="#ffffff"/>
<text x="20" y="30" dominant-baseline="central" font-size="22" font-weight="bold">Security controls of the agent sandbox</text>
<rect x="1010" y="80" width="580" height="498" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<text x="1020" y="100.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="1020" dy="0">Host proxy container</tspan><tspan x="1020" dy="19">rootless Podman, no gVisor</tspan></text>
<rect x="1030" y="440" width="540" height="118" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1300.0" y="489.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1300.0" dy="0">iron-proxy</tspan><tspan x="1300.0" dy="19">socat to 127.0.0.1:18080</tspan></text>
<rect x="1030" y="150" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="171.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">Allowlist of hosts</tspan><tspan x="1160.0" dy="17">Other hosts get 403</tspan></text>
<rect x="1310" y="150" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="171.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">Path rules for writes</tspan><tspan x="1440.0" dy="17">One repo, one namespace</tspan></text>
<rect x="1030" y="220" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">TLS termination</tspan><tspan x="1160.0" dy="17">Own CA lets it read requests</tspan><tspan x="1160.0" dy="17">Sandbox trusts only this CA</tspan></text>
<rect x="1310" y="220" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">Token swap: placeholder</tspan><tspan x="1440.0" dy="17">becomes the real token,</tspan><tspan x="1440.0" dy="17">for listed hosts only</tspan></text>
<rect x="1030" y="290" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="311.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">Audit log</tspan><tspan x="1160.0" dy="17">One JSON line per request</tspan></text>
<rect x="1310" y="290" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="311.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">Encrypted access token</tspan><tspan x="1440.0" dy="17">Not given to iron-proxy</tspan></text>
<rect x="1030" y="360" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="373.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">No capability, no new</tspan><tspan x="1160.0" dy="17">privilege, read-only</tspan><tspan x="1160.0" dy="17">root file system</tspan></text>
<rect x="1310" y="360" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="390.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">Limits: 512 MB</tspan></text>
<rect x="1010" y="788" width="580" height="498" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<text x="1020" y="1246.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="1020" dy="0">Builder proxy container</tspan><tspan x="1020" dy="19">rootless Podman, no gVisor</tspan></text>
<rect x="1030" y="808" width="540" height="118" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1300.0" y="857.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1300.0" dy="0">iron-proxy</tspan><tspan x="1300.0" dy="19">socat to 127.0.0.1:18080</tspan></text>
<rect x="1030" y="946" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="967.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">Allowlist of host names</tspan><tspan x="1160.0" dy="17">Other hosts get 403</tspan></text>
<rect x="1310" y="946" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="967.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">TLS passthrough</tspan><tspan x="1440.0" dy="17">Only the host name is checked</tspan></text>
<rect x="1030" y="1016" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="1037.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">No CA</tspan><tspan x="1160.0" dy="17">It cannot read the traffic</tspan></text>
<rect x="1310" y="1016" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="1046.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">No capability</tspan></text>
<rect x="1030" y="1086" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="1116.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">No new privilege</tspan></text>
<rect x="1310" y="1086" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="1116.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">Read-only root file system</tspan></text>
<rect x="1030" y="1156" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1160.0" y="1186.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1160.0" dy="0">Limits: 256 MB</tspan></text>
<rect x="1310" y="1156" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1440.0" y="1186.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1440.0" dy="0">Wiped when the session ends</tspan></text>
<rect x="20" y="80" width="580" height="498" rx="16" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<text x="30" y="100.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="30" dy="0">Agent sandbox</tspan><tspan x="30" dy="19">rootless Podman</tspan></text>
<rect x="40" y="440" width="540" height="118" rx="16" fill="#ffffff" stroke="#9673a6" stroke-width="2"/>
<text x="50" y="456.0" text-anchor="start" dominant-baseline="central" font-size="14"><tspan x="50" dy="0">gVisor: userspace kernel</tspan></text>
<rect x="40" y="150" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">No network device</tspan></text>
<rect x="320" y="150" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">No root user</tspan></text>
<rect x="40" y="220" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">No capability</tspan></text>
<rect x="320" y="220" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">No new privilege</tspan></text>
<rect x="40" y="290" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="320.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Read-only root file system</tspan></text>
<rect x="320" y="290" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="311.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Read-only mounts</tspan><tspan x="450.0" dy="17">CA, proxy and builder sockets</tspan></text>
<rect x="40" y="360" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="170.0" y="390.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="170.0" dy="0">Limits: 3 GB, 4 CPUs</tspan></text>
<rect x="320" y="360" width="260" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="450.0" y="381.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="450.0" dy="0">Private clone of the repo</tspan><tspan x="450.0" dy="17">Your .git is read-only</tspan></text>
