<rect x="20" y="788" width="580" height="498" rx="16" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<text x="30" y="1246.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="30" dy="0">Builder</tspan><tspan x="30" dy="19">rootless Podman</tspan></text>
