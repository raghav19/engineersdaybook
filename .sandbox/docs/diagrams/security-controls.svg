<text x="905.0" y="313.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="905.0" dy="0">Token swap</tspan><tspan x="905.0" dy="17">Placeholder becomes the</tspan><tspan x="905.0" dy="17">real token, for listed</tspan><tspan x="905.0" dy="17">hosts only</tspan></text>
<rect x="800" y="398" width="210" height="44" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
