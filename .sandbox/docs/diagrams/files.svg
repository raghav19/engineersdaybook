<rect x="0" y="0" width="1560" height="960" fill="#ffffff"/>
<text x="20" y="38" font-size="22" font-weight="bold" fill="#000000">How the files connect</text>

<rect x="20" y="70" width="420" height="70" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="230" y="99.8" font-weight="bold">justfile</text><text x="230" y="120.8">setup and build make the files below. run starts them.</text></g>

<rect x="1070" y="60" width="440" height="84" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1290" y="86.3" font-weight="bold">Placeholders must match</text><text x="1290" y="107.3">sandbox-agent.container, managed-settings.json,</text><text x="1290" y="128.3">docker-config.json and agent/proxy/iron-proxy.yaml</text></g>

<rect x="20" y="170" width="420" height="740" rx="12" fill="#ffffff" stroke="#d6b656" stroke-width="2"/>
<line x1="20" y1="210" x2="440" y2="210" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="32" y="195.3">In the repo: .sandbox/</text></g>

<rect x="600" y="170" width="420" height="740" rx="12" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<line x1="600" y1="210" x2="1020" y2="210" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="612" y="195.3">Made on your host</text></g>

<rect x="1180" y="170" width="340" height="740" rx="12" fill="#ffffff" stroke="#6c8ebf" stroke-width="2"/>
<line x1="1180" y1="210" x2="1520" y2="210" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="1192" y="195.3">Running</text></g>

<rect x="40" y="230" width="380" height="120" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="230" y="274.3" font-weight="bold">agent/proxy/</text><text x="230" y="295.3">Containerfile, proxy.container</text><text x="230" y="316.3">iron-proxy.yaml</text></g>

<rect x="620" y="230" width="380" height="120" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="810" y="274.3" font-weight="bold">image localhost/sandbox-proxy</text><text x="810" y="295.3">unit link sandbox-proxy.container</text><text x="810" y="316.3">config link, ca.crt, ca.key, bws-token</text></g>

<rect x="1200" y="230" width="300" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1350" y="274.3" font-weight="bold">sandbox-proxy (crun)</text><text x="1350" y="295.3">mounts the config, ca.crt, ca.key,</text><text x="1350" y="316.3">bws-token and the proxy.sock folder</text></g>

<rect x="40" y="410" width="380" height="120" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="230" y="454.3" font-weight="bold">agent/</text><text x="230" y="475.3">image/: Dockerfile, sandbox-start, configs</text><text x="230" y="496.3">sandbox-agent.container, runsc.conf</text></g>

<rect x="620" y="410" width="380" height="120" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="810" y="454.3" font-weight="bold">image localhost/sandbox-dev</text><text x="810" y="475.3">unit link sandbox-agent.container</text><text x="810" y="496.3">flags link, repo.git link, ca.crt</text></g>

<rect x="1200" y="410" width="300" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1350" y="454.3" font-weight="bold">sandbox-agent (gVisor)</text><text x="1350" y="475.3">mounts ca.crt and the .git of the repo,</text><text x="1350" y="496.3">the proxy.sock and buildkitd.sock folders</text></g>

<rect x="40" y="590" width="380" height="120" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="230" y="634.3" font-weight="bold">builder/</text><text x="230" y="655.3">image/: Containerfile</text><text x="230" y="676.3">sandbox-builder.container, runsc.conf</text></g>

<rect x="620" y="590" width="380" height="120" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="810" y="634.3" font-weight="bold">image localhost/sandbox-builder</text><text x="810" y="655.3">unit link sandbox-builder.container</text><text x="810" y="676.3">gVisor flags link</text></g>

<rect x="1200" y="590" width="300" height="120" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1350" y="634.3" font-weight="bold">sandbox-builder (gVisor)</text><text x="1350" y="655.3">mounts the buildkitd.sock folder and</text><text x="1350" y="676.3">the proxy.sock of the builder proxy</text></g>

<rect x="40" y="770" width="380" height="120" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="230" y="814.3" font-weight="bold">builder/proxy/</text><text x="230" y="835.3">Containerfile, proxy.container</text><text x="230" y="856.3">iron-proxy.yaml</text></g>

<rect x="620" y="770" width="380" height="120" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="810" y="814.3" font-weight="bold">image localhost/sandbox-builder-proxy</text><text x="810" y="835.3">unit link sandbox-builder-proxy.container</text><text x="810" y="856.3">config link iron-proxy-builder.yaml</text></g>

<rect x="1200" y="770" width="300" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1350" y="814.3" font-weight="bold">sandbox-builder-proxy (crun)</text><text x="1350" y="835.3">mounts the config</text><text x="1350" y="856.3">and the proxy.sock folder</text></g>

