<path d="M890,492 L730,492" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,492 L450,492" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M810,614 L810,497" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#r)"/>
<text x="240.0" y="240.0" font-size="14" text-anchor="middle" fill="#000000">TCP</text>
<g font-size="14" text-anchor="middle" fill="#000000"><text x="550.0" y="226.0">connect</text><text x="550.0" y="242.0">Unix socket</text></g>
<g font-size="14" text-anchor="middle" fill="#000000"><text x="835.0" y="226.0">opens</text><text x="835.0" y="242.0">Unix socket</text></g>
<text x="810.0" y="482.0" font-size="14" text-anchor="middle" fill="#000000">TCP 127.0.0.1:18080</text>
<text x="490.0" y="482.0" font-size="14" text-anchor="middle" fill="#000000">HTTPS</text>
<rect x="930.0" y="344.0" width="140.0" height="62.0" fill="#ffffff"/>
<g font-size="14" text-anchor="middle" fill="#000000"><text x="1000.0" y="361.0">Unix socket</text><text x="1000.0" y="379.0">first connection</text><text x="1000.0" y="397.0">starts the service</text></g>
