<rect x="620" y="206" width="180" height="84" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="710.0" y="229.3" font-weight="bold">gVisor gofer</text><text x="710.0" y="250.3">opens the socket</text><text x="710.0" y="271.3">for the sentry</text></g>

<rect x="890" y="198" width="220" height="100" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1000.0" y="218.8" font-weight="bold">proxy.sock</text><text x="1000.0" y="239.8">Unix socket file,</text><text x="1000.0" y="260.8">owned by</text><text x="1000.0" y="281.8">sandbox-bridge.socket</text></g>

<rect x="890" y="450" width="220" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1000.0" y="483.8" font-weight="bold">sandbox-bridge.service</text><text x="1000.0" y="504.8">systemd-socket-proxyd</text></g>

<rect x="560" y="450" width="200" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="660.0" y="473.3" font-weight="bold">iron-proxy</text><text x="660.0" y="494.3">allowlist, TLS,</text><text x="660.0" y="515.3">token swap</text></g>

<rect x="360" y="457" width="120" height="70" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="420.0" y="483.8" font-weight="bold">Internet</text><text x="420.0" y="504.8">allowed hosts</text></g>

<path d="M230,248 L310,248" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M500,248 L620,248" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M800,248 L890,248" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M1000,298 L1000,450" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M890,492 L760,492" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M560,492 L480,492" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
