<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1140" height="740" viewBox="0 0 1140 740" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
</defs>
<rect x="0" y="0" width="1140" height="740" fill="#ffffff"/>
<text x="20" y="38" font-size="22" font-weight="bold" fill="#000000">Network path of the sandbox with gVisor</text>

<rect x="20" y="90" width="480" height="230" rx="12" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<line x1="20" y1="150" x2="500" y2="150" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="32" y="111.8">Container network namespace</text><text x="32" y="132.8">(only lo, no route out)</text></g>

<rect x="40" y="160" width="440" height="140" rx="12" fill="#ffffff" stroke="#9673a6" stroke-width="2"/>
<line x1="40" y1="196" x2="480" y2="196" stroke="#9673a6" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="52" y="183.3">gVisor sentry (guest kernel)</text></g>

<rect x="60" y="210" width="150" height="76" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="135.0" y="239.8" font-weight="bold">Agent tools</text><text x="135.0" y="260.8">HTTPS_PROXY</text></g>

<rect x="270" y="210" width="190" height="76" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="365.0" y="239.8" font-weight="bold">socat relay</text><text x="365.0" y="260.8">127.0.0.1:3128</text></g>

<rect x="600" y="206" width="180" height="84" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="690.0" y="229.3" font-weight="bold">gVisor gofer</text><text x="690.0" y="250.3">opens the socket</text><text x="690.0" y="271.3">for the sentry</text></g>

<rect x="890" y="198" width="220" height="100" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1000.0" y="218.8" font-weight="bold">proxy.sock</text><text x="1000.0" y="239.8">Unix socket file,</text><text x="1000.0" y="260.8">owned by</text><text x="1000.0" y="281.8">sandbox-bridge.socket</text></g>

<rect x="890" y="450" width="220" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="1000.0" y="483.8" font-weight="bold">sandbox-bridge.service</text><text x="1000.0" y="504.8">systemd-socket-proxyd</text></g>

<rect x="530" y="450" width="200" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="630.0" y="473.3" font-weight="bold">iron-proxy</text><text x="630.0" y="494.3">allowlist, TLS,</text><text x="630.0" y="515.3">token swap</text></g>

<rect x="330" y="457" width="120" height="70" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="390.0" y="483.8" font-weight="bold">Internet</text><text x="390.0" y="504.8">allowed hosts</text></g>

<rect x="680" y="614" width="260" height="84" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="810.0" y="637.3" font-weight="bold">nftables rule</text><text x="810.0" y="658.3">only your user may connect</text><text x="810.0" y="679.3">to ports 18080 to 18089</text></g>

<path d="M210,248 L270,248" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,248 L600,248" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M780,248 L890,248" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
