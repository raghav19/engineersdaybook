<text x="845.0" y="238.0" font-size="14" text-anchor="middle" fill="#000000">opens</text>
<text x="825.0" y="482.0" font-size="14" text-anchor="middle" fill="#000000">127.0.0.1:18080</text>
<rect x="930.0" y="352.0" width="140.0" height="44.0" fill="#ffffff"/>
