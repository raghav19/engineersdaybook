<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1140" height="580" viewBox="0 0 1140 580" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
</defs>
<rect x="0" y="0" width="1140" height="580" fill="#ffffff"/>
<text x="20" y="38" font-size="22" font-weight="bold" fill="#000000">Network path of the sandbox with gVisor</text>

<rect x="20" y="90" width="520" height="230" rx="12" fill="#ffffff" stroke="#82b366" stroke-width="2"/>
<line x1="20" y1="150" x2="540" y2="150" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="32" y="111.8">Container network namespace</text><text x="32" y="132.8">(only lo, no route out)</text></g>

<rect x="40" y="160" width="480" height="140" rx="12" fill="#ffffff" stroke="#9673a6" stroke-width="2"/>
<line x1="40" y1="196" x2="520" y2="196" stroke="#9673a6" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="52" y="183.3">gVisor sentry (guest kernel)</text></g>

<rect x="60" y="210" width="170" height="76" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="145.0" y="239.8" font-weight="bold">Agent tools</text><text x="145.0" y="260.8">HTTPS_PROXY</text></g>

<rect x="310" y="210" width="190" height="76" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
