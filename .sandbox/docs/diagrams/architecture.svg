<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="262" y="111.8">Agent container</text><text x="262" y="132.8">Podman, rootless, hardened</text><text x="262" y="153.8">gVisor: the guest kernel</text></g>

