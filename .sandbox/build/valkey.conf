# The config of the build queue. The users and their rights are in users.acl. `just sandbox queue` renders that file from queue-policy.yaml.
# No TCP port. Only the Unix socket.
port 0
unixsocket /run/valkey/valkey.sock
unixsocketperm 700
aclfile /conf/users.acl
# No file on disk. A restart of the queue drops the waiting jobs.
appendonly no
save ""
dir /tmp
# A context is up to 64 MB. When the memory is full, a SET fails, and the queue keeps working.
maxmemory 256mb
maxmemory-policy noeviction
proto-max-bulk-len 64mb
