# The gVisor runtimes of the sandbox and of the builder. `just sandbox setup` links this file to ~/.config/containers/containers.conf.d/runsc.conf.
# sandbox.container selects runsc with --runtime=runsc. Podman finds the runsc binary in its standard folders, /usr/local/bin among them.
# builder/sandbox-builder.container selects runsc-builder. A runtime name other than runsc needs the full path of the binary.
# If your runsc is somewhere else, change the path of runsc-builder, and add the line runsc = ["/path/to/runsc"] below it.

[engine.runtimes]
runsc-builder = ["/usr/local/bin/runsc"]

[engine.runtimes_flags]
runsc = [
    # Rootless runsc cannot make a systemd scope. The service limits in sandbox.container replace the limits of Podman.
    "ignore-cgroups",
    # gVisor uses the empty network namespace of the container, not a network stack of its own. With its own stack, the guest has no loopback.
    "network=host",
    # The guest may connect to the proxy socket that the container mounts. gVisor blocks this by default.
    "host-uds=open",
]
# The builder has the same binary and other flags.
runsc-builder = [
    # Rootless runsc cannot make a systemd scope. The service limits in sandbox-builder.container replace the limits of Podman.
    "ignore-cgroups",
    # gVisor runs its own network stack and gives the guest no interface except the loopback. The builder needs no other network.
    "network=none",
    # The guest may make a socket in a mounted host folder. buildkitd makes buildkitd.sock this way. The sandbox needs only open.
    "host-uds=create",
]
# TODO: test network=none for runsc in place of network=host. The check: socat binds 127.0.0.1:3128 in the sandbox, a tool reaches the proxy through it,
# and `podman exec sandbox curl --noproxy '*' -m 4 https://1.1.1.1` still fails. If it passes, remove network=host and the ExecStartPost line of sandbox.container.
