# The gVisor runtime of the sandbox. `just sandbox setup` links this file to ~/.config/containers/containers.conf.d/runsc.conf.
# sandbox.container selects the runtime with --runtime=runsc. Podman finds the runsc binary in its standard folders, /usr/local/bin among them.
# If your runsc is somewhere else, add these two lines at the top of this file:
#   [engine.runtimes]
#   runsc = ["/path/to/runsc"]

[engine.runtimes_flags]
runsc = [
    # Rootless runsc cannot make a systemd scope. The service limits in sandbox.container replace the limits of Podman.
    "ignore-cgroups",
    # gVisor uses the empty network namespace of the container, not a network stack of its own. With its own stack, the guest has no loopback.
    "network=host",
    # The guest may connect to the proxy socket that the container mounts. gVisor blocks this by default.
    "host-uds=open",
]
