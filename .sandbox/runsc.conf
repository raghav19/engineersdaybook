# The gVisor runtimes: runsc for the sandbox, runsc-builder for the builder. `just sandbox setup` links this file to ~/.config/containers/containers.conf.d/runsc.conf.
# Podman finds runsc in its standard folders, /usr/local/bin among them. A runtime with another name needs the full path.
# If your runsc is somewhere else, change the path of runsc-builder and add runsc = ["/path/to/runsc"] below it.

[engine.runtimes]
runsc-builder = ["/usr/local/bin/runsc"]

[engine.runtimes_flags]
runsc = [
    # Rootless runsc cannot make a systemd scope. The service limits in sandbox-agent.container replace the limits of Podman.
    "ignore-cgroups",
    # gVisor uses the empty network namespace of the container, not a network stack of its own. With its own stack, the guest has no loopback.
    "network=host",
    # The guest may connect to the proxy socket that the container mounts. gVisor blocks this by default.
    "host-uds=open",
]
runsc-builder = [
    # Same reason as for runsc.
    "ignore-cgroups",
    # gVisor keeps its own network stack. The builder has no network device. The relay needs only the loopback.
    "network=none",
    # buildkitd makes its socket in a mounted host folder, and the relay connects to the socket of the builder proxy.
    "host-uds=all",
]
# TODO: test network=none for runsc. Check: socat binds 127.0.0.1:3128, a tool reaches the proxy, and `podman exec sandbox-agent curl --noproxy '*' -m 4 https://1.1.1.1` fails.
# If it passes, remove network=host and the ExecStartPost line of sandbox-agent.container.
