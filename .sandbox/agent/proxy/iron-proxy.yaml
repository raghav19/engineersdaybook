# The config of iron-proxy, the only way out of the sandbox. It runs in the container sandbox-proxy (proxy.container).
# The sandbox has no network. It reaches the proxy through a relay and a Unix socket, and it sends HTTPS_PROXY requests (CONNECT) to tunnel_listen.
# The proxy ends the TLS with its own CA and checks the allowlist below. Any other host gets 403.
# The sandbox holds only the placeholders. The proxy replaces a placeholder with the real value in a request to the hosts of its rule.
# The real values come from the environment of the proxy. This file has the names of the variables, never the values.
# The placeholders in sandbox-agent.container, in agent/image/configs/agents/managed-settings.json and in agent/image/configs/tools/docker-config.json must equal the proxy_value lines.
# The unit mounts ca.crt and ca.key in /etc/iron-proxy, the folder that the proxy runs in.
# All listeners are on the loopback of the container. The ports do not exist on the host. The builder proxy uses the same ports in its own container.
# iron-proxy requires the DNS, HTTP and HTTPS listeners. The sandbox does not use them.
dns:
  listen: "127.0.0.1:18084"
  proxy_ip: "127.0.0.1"
proxy:
  http_listen: "127.0.0.1:18081"
  https_listen: "127.0.0.1:18082"
  # The tunnel takes CONNECT and SOCKS5. socat in the container joins it to the Unix socket that the sandbox mounts.
  tunnel_listen: "127.0.0.1:18080"
tls:
  ca_cert: /etc/iron-proxy/ca.crt
  ca_key: /etc/iron-proxy/ca.key
metrics:
  listen: "127.0.0.1:18083"
transforms:
  - name: allowlist
    config:
      domains:
        # Claude Code
        - api.anthropic.com
        - claude.ai
        - console.anthropic.com
        - platform.claude.com
        - code.claude.com
        # Qwen Code: the Token Plan (international, Singapore) endpoint
        - token-plan.ap-southeast-1.maas.aliyuncs.com
        # GitHub is in rules below, not here: reads are open and writes are limited to one repository.
        # MCP servers
        - mcp.draw.io
        - schemas.fluxoperator.dev
        # Container images (podman). Docker Hub needs the registry, the token service and a CDN for the blobs.
        # The CDN host changes (cloudflare, cloudfront), so *.docker.com covers it.
        - registry-1.docker.io
        - auth.docker.io
        - "*.docker.com"
        # GitHub Container Registry. The blobs come from pkg-containers.githubusercontent.com. The host ghcr.io is in rules below, not here.
        - pkg-containers.githubusercontent.com
        # Tool downloads
        - proxy.golang.org
        - sum.golang.org
        - releases.hashicorp.com
        - registry.terraform.io
        - mise.jdx.dev
        - astral.sh
        - "*.astral.sh"
        - pypi.org
        - files.pythonhosted.org
        - registry.npmjs.org
        # Chart and OCI registries that the cluster uses (blob.istio.io redirects to istio-release.r2.istio.io)
        - istio.io
        - "*.istio.io"
        - istio-release.storage.googleapis.com
        - cr.agentgateway.dev
        - quay.io
        - "*.quay.io"
        - charts.dexidp.io
        # Schemas
        - www.schemastore.org
        # Documentation and project sites, for research
        - artifacthub.io
        - backstage.io
        - kind.sigs.k8s.io
        - just.systems
        - fluxcd.io
        - fluxoperator.dev
        - spiffe.github.io
        - docs.ansible.com
        - argo-cd.readthedocs.io
        - pkl-lang.org
        - kubernetes.io
        - helm.sh
        - kubectl.docs.kubernetes.io
        - docs.aws.amazon.com
        - docs.k3s.io
        - agentgateway.dev
        - cuelang.org
        - spiffe.io
        - owasp.org
        - fluxcd.control-plane.io
        - doc.traefik.io
        - cloud.google.com
        # Other
        - crl.microsoft.com
      # ghcr.io takes reads in any namespace and writes only in the namespace raghav19. Other writes get 403.
      # The proxy checks the CONNECT first, before it sees a path. So ghcr.io needs a CONNECT rule.
      rules:
        - {host: ghcr.io, methods: [CONNECT]}
        - {host: ghcr.io, methods: [GET, HEAD], paths: ["/token", "/v2/", "/v2/*"]}
        - {host: ghcr.io, methods: [POST, PATCH, PUT], paths: ["/v2/raghav19/*"]}
      # GitHub. Reads are open. Writes go to the repository raghav19/engineersdaybook only, so an injected agent cannot send data to another repository, a gist or an issue elsewhere.
      # Each host needs a CONNECT rule, because the proxy decides at the CONNECT. The proxy cannot read the body of a request.
      # Static hosts: reads only.
        - {host: "*.githubusercontent.com", methods: [CONNECT, GET, HEAD]}
        - {host: github.githubassets.com, methods: [CONNECT, GET, HEAD]}
        - {host: www.githubstatus.com, methods: [CONNECT, GET, HEAD]}
      # Git over HTTPS and release downloads. A clone or a pull is a POST of git-upload-pack and reads any repository. A push is a POST of git-receive-pack in the repository of this project only.
        - {host: github.com, methods: [CONNECT]}
        - {host: github.com, methods: [GET, HEAD]}
        - {host: github.com, methods: [POST], paths: ["/*/*/git-upload-pack"]}
        - {host: github.com, methods: [POST], paths: ["/raghav19/engineersdaybook/git-receive-pack", "/raghav19/engineersdaybook.git/git-receive-pack"]}
      # The REST API. A write is possible in the repository of this project only. A gist, a fork or an issue in another repository gets 403. GraphQL gets 403, because its path does not show what a query writes.
        - {host: api.github.com, methods: [CONNECT]}
        - {host: api.github.com, methods: [GET, HEAD]}
        - {host: api.github.com, methods: [POST, PATCH, PUT, DELETE], paths: ["/repos/raghav19/engineersdaybook/*"]}
      # The GitHub MCP server. Only the URL /mcp/ is open, and the section mcp below limits the tools.
        - {host: api.githubcopilot.com, methods: [CONNECT]}
        - {host: api.githubcopilot.com, methods: [GET, POST, DELETE], paths: ["/mcp", "/mcp/"]}
  - name: secrets
    config:
      secrets:
        # GitHub: git (Basic authentication), the API and the GitHub MCP server.
        - source: {type: env, var: GH_TOKEN}
          replace: {proxy_value: sandbox-placeholder-GH_TOKEN, match_headers: [Authorization]}
          rules:
            - {host: github.com}
            - {host: api.github.com}
            - {host: api.githubcopilot.com}
        # Claude Code
        - source: {type: env, var: CLAUDE_CODE_OAUTH_TOKEN}
          replace: {proxy_value: sandbox-placeholder-CLAUDE_CODE_OAUTH_TOKEN, match_headers: [Authorization]}
          rules:
            - {host: api.anthropic.com}
        # Qwen Code: the Token Plan (international, Singapore) endpoint
        - source: {type: env, var: QWEN_API_KEY}
          replace: {proxy_value: sandbox-placeholder-QWEN_API_KEY, match_headers: [Authorization]}
          rules:
            - {host: token-plan.ap-southeast-1.maas.aliyuncs.com}
        # GitHub Container Registry: the login of crane (push and pull)
        - source: {type: env, var: GITHUB_TOKEN}
          replace: {proxy_value: sandbox-placeholder-GHCR_PUSH_TOKEN, match_headers: [Authorization]}
          rules:
            - {host: ghcr.io}
# The policy of the GitHub MCP server. It covers the toolsets in X-MCP-Toolsets of the settings files: context, issues, pull_requests and repos.
# A tool that is not listed gets an error, and tools/list hides it. The tools merge_pull_request, delete_file, delete_repository, create_repository and fork_repository stay out of the list.
# A read tool works in any repository. A write tool works in raghav19/engineersdaybook only.
mcp:
  servers:
    - name: github
      rules:
        - {host: api.githubcopilot.com, paths: ["/mcp", "/mcp/"]}
      tools:
        - {name: get_me}
        - {name: get_team_members}
        - {name: get_teams}
        - {name: issue_read}
        - {name: list_issues}
        - {name: search_issues}
        - {name: list_issue_types}
        - {name: list_issue_fields}
        - {name: list_pull_requests}
        - {name: pull_request_read}
        - {name: search_pull_requests}
        - {name: get_commit}
        - {name: get_file_contents}
        - {name: get_latest_release}
        - {name: get_release_by_tag}
        - {name: get_tag}
        - {name: list_branches}
        - {name: list_commits}
        - {name: list_releases}
        - {name: list_repository_collaborators}
        - {name: list_tags}
        - {name: search_code}
        - {name: search_commits}
        - {name: search_repositories}
        - name: add_issue_comment
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: issue_write
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: sub_issue_write
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: update_issue_comment
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: add_comment_to_pending_review
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: add_reply_to_pull_request_comment
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: create_pull_request
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: pull_request_review_write
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: update_pull_request
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: update_pull_request_branch
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: create_branch
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: create_or_update_file
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
        - name: push_files
          when:
            - {path: owner, equals: raghav19}
            - {path: repo, equals: engineersdaybook}
log:
  level: info
