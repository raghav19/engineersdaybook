[tools]
just = "1.59"
yq = "4.54"
jq = "1.8"
fd = "10.5"
prek = "0.5"
ruff = "0.17"
gitleaks = "8.30"
yamlfmt = "0.21"
shfmt = "3.14"
ty = "0.0"
"github:sinelaw/fresh" = "0.5"
