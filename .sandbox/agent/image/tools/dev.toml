"github:AlexanderGrooff/mermaid-ascii" = { version = "1.6", version_prefix = "" }
# Plannotator is one 237 MB binary. It has no bash completion, so sandbox:completions has no line for it.
"github:backnotprop/plannotator" = "0.29"
