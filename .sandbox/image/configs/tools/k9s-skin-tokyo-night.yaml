# Tokyo Night skin for k9s. The background stays the color of the terminal.
k9s:
  body:
    fgColor: "#c0caf5"
    bgColor: default
    logoColor: "#7aa2f7"
  prompt:
    fgColor: "#c0caf5"
    bgColor: default
    suggestColor: "#bb9af7"
  help:
    fgColor: "#c0caf5"
    bgColor: default
    sectionColor: "#9ece6a"
    keyColor: "#7aa2f7"
    numKeyColor: "#f7768e"
  frame:
    title:
      fgColor: "#7dcfff"
      bgColor: default
      highlightColor: "#ff9e64"
      counterColor: "#e0af68"
      filterColor: "#bb9af7"
    border:
      fgColor: "#3b4261"
      focusColor: "#7aa2f7"
    menu:
      fgColor: "#c0caf5"
      keyColor: "#7aa2f7"
      numKeyColor: "#f7768e"
    crumbs:
      fgColor: "#1a1b26"
      bgColor: default
      activeColor: "#7aa2f7"
    status:
      newColor: "#7dcfff"
      modifyColor: "#7aa2f7"
      addColor: "#9ece6a"
      pendingColor: "#ff9e64"
      errorColor: "#f7768e"
      highlightColor: "#e0af68"
      killColor: "#bb9af7"
      completedColor: "#565f89"
  info:
    fgColor: "#ff9e64"
    sectionColor: "#c0caf5"
  views:
    table:
      fgColor: "#c0caf5"
      bgColor: default
      cursorFgColor: "#1a1b26"
      cursorBgColor: "#7aa2f7"
      markColor: "#bb9af7"
      header:
        fgColor: "#e0af68"
        bgColor: default
        sorterColor: "#7dcfff"
    xray:
      fgColor: "#c0caf5"
      bgColor: default
      cursorColor: "#7aa2f7"
      cursorTextColor: "#1a1b26"
      graphicColor: "#7dcfff"
    charts:
      bgColor: default
      defaultDialColors:
        - "#7aa2f7"
        - "#f7768e"
      defaultChartColors:
        - "#7aa2f7"
        - "#f7768e"
      resourceColors:
        cpu:
          - "#7dcfff"
          - "#7aa2f7"
        mem:
          - "#ff9e64"
          - "#e0af68"
    yaml:
      keyColor: "#7aa2f7"
      colonColor: "#565f89"
      valueColor: "#c0caf5"
    logs:
      fgColor: "#c0caf5"
      bgColor: default
      indicator:
        fgColor: "#c0caf5"
        bgColor: "#3b4261"
        toggleOnColor: "#9ece6a"
        toggleOffColor: "#565f89"
  dialog:
    fgColor: "#c0caf5"
    bgColor: default
    buttonFgColor: "#1a1b26"
    buttonBgColor: "#565f89"
    buttonFocusFgColor: "#1a1b26"
    buttonFocusBgColor: "#7aa2f7"
    labelFgColor: "#e0af68"
    fieldFgColor: "#c0caf5"
