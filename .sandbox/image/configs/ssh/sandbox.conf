# The sshd of the sandbox. The host connects through the published port 127.0.0.1:2222 (see compose.yaml).
# Only the key of `just sandbox run` can log in, and only as the user agent.
# Port 2222, because the sandbox has no capability to bind a port below 1024.
Port 2222
HostKey /var/lib/sandbox/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /etc/ssh/sandbox_authorized_keys
AllowUsers agent
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PrintMotd no
