# The storage of buildah in the sandbox. The vfs driver needs no mount and no user namespace, so it works with an empty capability set.
# The graphroot is a folder in the volume sandbox-home, so the images stay after a restart. The runroot is in the tmpfs of /tmp.
[storage]
driver = "vfs"
graphroot = "/home/agent/.buildah/storage"
runroot = "/tmp/containers-run"
