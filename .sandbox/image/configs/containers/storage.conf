# The storage of buildah in the sandbox. The vfs driver needs no mount and no user namespace, so it works with an empty capability set.
# The graphroot is a volume (see compose.yaml, volume containers). The runroot is in the tmpfs of /tmp.
# The volume is not below ~/.local: a mount there would make root own the folders above it.
[storage]
driver = "vfs"
graphroot = "/home/agent/.buildah/storage"
runroot = "/tmp/containers-run"
