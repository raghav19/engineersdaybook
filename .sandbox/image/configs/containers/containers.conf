# The default mounts and settings of each container that podman starts in the sandbox.
# The egress proxy puts its CA in the trust store of the sandbox, not in the trust store of a container.
# This mount makes a container trust the same CAs as the sandbox. Without it, a download over HTTPS in a RUN step fails.
[containers]
volumes = ["/etc/ssl/certs:/etc/ssl/certs:ro"]
