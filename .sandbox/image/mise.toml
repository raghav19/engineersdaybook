# The system config of mise in the image: the settings of the tools and the bash completions. The tools are in tools/, one file for each group.
# The Dockerfile puts these exact versions in the image. mise reads this file and the files of tools/ from /etc/mise/conf.d/.
# The root mise.toml is for the host only (kind, msb, bws, iron-proxy). The image does not read it.
# If both sides use a tool (kubectl, helm, kustomize), both files list it.
# This folder is in image/, not in .sandbox/. No recipe runs here, so the mise of the host does not load these files.
# node (npm is part of it) and python are in tools/runtimes.toml. python is 3.13, as in the repo scripts and tools.

# The mise shims in the sandbox set these values.
[env]
EDITOR = "nano"
LANG = "C.UTF-8"
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/terraform-providers"
CHECKPOINT_DISABLE = "1"  # Terraform does not check its version at checkpoint-api.hashicorp.com
COMPLETIONS_DIR = "{{ get_env(name='COMPLETIONS_DIR', default=env.HOME ~ '/.local/share/bash-completion/completions') }}"  # the Dockerfile sets the same path at build time
# Headroom (sandbox-start starts it) sends no telemetry, makes no update check and downloads nothing from Hugging Face. huggingface.co is not in the egress allow list.
HEADROOM_TELEMETRY = "off"
HEADROOM_BEACON = "off"
HEADROOM_UPDATE_CHECK = "off"
DO_NOT_TRACK = "1"
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1"  # marksman (the Markdown language server) runs on .NET. The image has no ICU library, and this setting lets .NET start without it
HF_HUB_OFFLINE = "1"
# Ponytail (sandbox-start installs the plugin) puts no codebase map in the session context. This saves input tokens.
PONYTAIL_MAP = "0"
PONYTAIL_DEFAULT_MODE = "full"

[hooks.enter]
# kubectl shorthand with completion
shell = "bash"
script = """
alias k=kubectl
complete -F __start_kubectl k
"""

# The Dockerfile runs this task after it installs the tools. COMPLETIONS_DIR comes from [env]. The build sets it.
# If you run the task in the sandbox, the default is ~/.local/share/bash-completion/completions. Bash loads completions from this folder when it needs them.
[tasks."sandbox:completions"]
description = "Write the bash completions into $COMPLETIONS_DIR"
run = """
mkdir -p "$COMPLETIONS_DIR"
kubectl completion bash > "$COMPLETIONS_DIR/kubectl"
helm completion bash > "$COMPLETIONS_DIR/helm"
kustomize completion bash > "$COMPLETIONS_DIR/kustomize"
k9s completion bash > "$COMPLETIONS_DIR/k9s"
fd --gen-completions bash > "$COMPLETIONS_DIR/fd"
flux completion bash > "$COMPLETIONS_DIR/flux"
just --completions bash > "$COMPLETIONS_DIR/just"
yq shell-completion bash > "$COMPLETIONS_DIR/yq"
herdr completion bash > "$COMPLETIONS_DIR/herdr"
uv generate-shell-completion bash > "$COMPLETIONS_DIR/uv"
gitleaks completion bash > "$COMPLETIONS_DIR/gitleaks"
flux9s completions bash > "$COMPLETIONS_DIR/flux9s"
echo complete -C terraform terraform > "$COMPLETIONS_DIR/terraform"
echo complete -C terragrunt terragrunt > "$COMPLETIONS_DIR/terragrunt"
"""

# The Dockerfile runs this task. It reads ~/.config/fresh/plugins.yaml with yq: one key for each package.
# A package keeps the file .commit. If it holds the commit of the list, the task does not fetch the package again.
[tasks."fresh:plugins"]
description = "Install the Fresh packages of plugins.yaml at their pinned commits"
shell = "bash -euo pipefail -c"
run = '''
# Fresh reads its packages from ~/.config/fresh. A test can set FRESH_CONFIG_DIR to use another folder.
cfg="${FRESH_CONFIG_DIR:-$HOME/.config/fresh}"
list="$cfg/plugins.yaml"
# A scratch folder for the fetches. The trap removes it when the task ends, also after an error.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
# field NAME prints one field of the package in $name, for example: field repo
field() { yq ".\"$name\".$1" "$list"; }

# One turn of the loop for each key of plugins.yaml. The key is the name of the package.
yq 'keys | .[]' "$list" | while read -r name; do
  commit=$(field commit)
  # The kind gives the folder: plugin to plugins/packages, language to languages/packages, theme to themes/packages.
  dest="$cfg/$(field kind)s/packages/$name"

  # The file .commit holds the commit of the last install. If it is the pinned commit, there is nothing to do.
  if [ "$(cat "$dest/.commit" 2>/dev/null)" = "$commit" ]; then
    echo "ok  $name (installed)"
    continue
  fi

  # Fetch only the pinned commit, with no history. This works with a full hash, and it needs no tag.
  git -C "$tmp" init -q "$name"
  git -C "$tmp/$name" fetch -q --depth 1 "$(field repo)" "$commit"
  git -C "$tmp/$name" checkout -q FETCH_HEAD

  # Replace the old copy with the folder of the package. A monorepo has more than one package, so copy the subdir and not the repo.
  rm -rf "$dest"
  mkdir -p "${dest%/*}"
  cp -r "$tmp/$name/$(field subdir)" "$dest"
  # The package does not need the git data. Write the commit in .commit for the next run.
  rm -rf "$dest/.git"
  echo "$commit" >"$dest/.commit"
  echo "ok  $name (installed now)"
done
'''
