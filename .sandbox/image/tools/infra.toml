[tools]
kubectl = "1.37"
helm = "4.3"
kustomize = "5.8"
k9s = "0.51"
"github:dgunzy/flux9s" = { version = "1.5", asset_pattern = "flux9s-linux-x86_64-musl.tar.gz" }
terragrunt = "1.1"
terraform = "1.16"
flux2 = "2.10"
"github:home-operations/flate" = "0.6"
"github:fluxcd/flux-schema" = "0.17"
# docker is the client of the builder. It needs no daemon. The Dockerfile adds the plugin buildx.
docker-cli = "29.10"
# buildx is the build client. It is a docker plugin, so rename_exe gives it the name docker-buildx. config.json adds /opt/mise/shims to the plugin folders.
"github:docker/buildx" = { version = "0.39.0", rename_exe = "docker-buildx" }
# crane pushes the tar of a build to a registry. It reads the login from the config of docker.
crane = "0.22"
