# The Kubernetes clusters that the sandbox may reach. All developers share this file. It holds no secret and no address.
# `just sandbox clusters` reads it and your own kubeconfig. It writes the kubeconfig of the sandbox and the rules of the proxy.
#
# The name of a context in your kubeconfig decides everything. A name must look like k8s_dev: k8s_, then lower-case letters, digits or _.
# A context is exposed only if a rule matches its name. The first rule that matches wins. A context that matches no rule stays hidden.
# Name your contexts with kubectx: `kubectx k8s_dev=<old name>`.
#   match   a glob for the name of the context
#   access  a profile below. `none` hides the context.
policy:
  - {match: "k8s_prod",   access: none}
  - {match: "k8s_*_prod", access: none}
  - {match: "k8s_dev",    access: write-scratch}
  - {match: "k8s_*_dev",  access: write-scratch}
  - {match: "k8s_*",      access: read-only}

# A request must match a rule of its profile, or the proxy answers 403. CONNECT is the setup of the tunnel, so each profile needs it.
access:
  read-only:     {methods: [CONNECT, GET]}
  write-scratch: {methods: [CONNECT, GET, POST, PUT, PATCH, DELETE]}

# `just sandbox token k8s_dev` makes a token for a context that logs in with a certificate (the k3s default).
# The host makes the token for this ServiceAccount and keeps it. The sandbox never holds it.
token:
  serviceaccount: sandbox-agent
  namespace: sandbox-agent
  duration: 1h
