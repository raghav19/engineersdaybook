# The config of the builder proxy. The builder reaches the internet through it. It runs in the container sandbox-builder-proxy (proxy.container).
# It holds no token and no CA. The mode sni-only passes TLS through to the real host and checks only the host name.
# A build step cannot get a token from it. The proxy of the sandbox (iron-proxy.yaml) holds the tokens, and the builder cannot reach it.
# All listeners are on the loopback of the container. The ports do not exist on the host. The proxy of the sandbox uses the same ports in its own container.
dns:
  listen: "127.0.0.1:18084"
  proxy_ip: "127.0.0.1"
proxy:
  http_listen: "127.0.0.1:18081"
  https_listen: "127.0.0.1:18082"
  # The tunnel takes CONNECT. socat in the container joins it to the Unix socket that the builder mounts.
  tunnel_listen: "127.0.0.1:18080"
tls:
  mode: sni-only
metrics:
  listen: "127.0.0.1:18083"
transforms:
  - name: allowlist
    config:
      domains:
        # Image registries for FROM
        - registry-1.docker.io
        - auth.docker.io
        - "*.docker.com"
        - ghcr.io
        - pkg-containers.githubusercontent.com
        - quay.io
        - "*.quay.io"
        # Packages for RUN
        - proxy.golang.org
        - sum.golang.org
        - registry.npmjs.org
        - pypi.org
        - files.pythonhosted.org
        - releases.hashicorp.com
        - deb.debian.org
        - security.debian.org
        - dl-cdn.alpinelinux.org
        # Source and release downloads
        - github.com
        - api.github.com
        - "*.githubusercontent.com"
