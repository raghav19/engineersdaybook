# The gVisor runtime of the builder (runtime runsc-builder). `just sandbox setup` links this file to ~/.config/containers/containers.conf.d/sandbox-builder-runsc.conf.
# The name runsc-builder gives the builder its own flags. Podman needs the full path of a runtime with another name. If your runsc is somewhere else, change the path.

[engine.runtimes]
runsc-builder = ["/usr/local/bin/runsc"]

[engine.runtimes_flags]
runsc-builder = [
    # Rootless runsc cannot make a systemd scope. The service limits in sandbox-builder.container replace the limits of Podman.
    "ignore-cgroups",
    # gVisor keeps its own network stack. The builder has no network device. The relay needs only the loopback.
    "network=none",
    # buildkitd makes its socket in a mounted host folder, and the relay connects to the socket of the builder proxy.
    "host-uds=all",
]
