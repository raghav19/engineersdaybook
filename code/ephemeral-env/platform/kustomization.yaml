# The root of the OCI artifact. `just publish` pushes this folder. The root applies the namespace and the Flux Kustomizations in sync.yaml.
# Each of those applies its own folder. Later PRs add folders to addons/, apps/ and sandboxes/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sync.yaml
