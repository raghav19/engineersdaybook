# The order of the platform. Each Flux Kustomization applies one folder of this artifact and waits until its objects are Ready.
# The Boutique waits for istiod: a pod that starts before the injection webhook exists starts without its sidecar and nothing reports it.
# `wait: true` makes Flux check the HelmReleases and the Deployments, so `dependsOn` means "Ready", not "applied".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addons-istio
  namespace: flux-system
spec:
  interval: 10m
  path: ./addons/istio
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addons-observability
  namespace: flux-system
spec:
  interval: 10m
  path: ./addons/observability
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: addons-istio
  sourceRef:
    kind: OCIRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-boutique
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/boutique
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: addons-istio
  sourceRef:
    kind: OCIRepository
    name: flux-system
