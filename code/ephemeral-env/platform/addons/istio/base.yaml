# The Istio base chart: the CRDs and the cluster roles of the control plane. Flux (helm-controller) installs it.
# The three Istio versions in this folder (base, istiod and the chart repository) are one release: 1.31.1.
# The CRD policy is CreateReplace: Helm never upgrades the files in a chart's crds/ folder, and never deletes them.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: istio-system
spec:
  interval: 10m
  url: https://blob.istio.io/istio-release/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 10m
  releaseName: istio-base
  chart:
    spec:
      chart: base
      version: "1.31.1"
      sourceRef:
        kind: HelmRepository
        name: istio
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  # Flux must never prune a CRD: deleting a CRD deletes every custom resource of its kind.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: CustomResourceDefinition}
            patch: |
              - op: add
                path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
                value: disabled
