# The Istio control plane (istiod), sidecar mode only: no ambient components (no istio-cni, no ztunnel).
# istiod is the CA of the mesh (its own CA). There is no SPIRE, so pods need no template annotation.
# The HelmRepository in base.yaml is the chart source.
# Add chart values under spec.values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 10m
  releaseName: istiod
  chart:
    spec:
      chart: istiod
      version: "1.31.1"
      sourceRef:
        kind: HelmRepository
        name: istio
  dependsOn:
    - name: istio-base
