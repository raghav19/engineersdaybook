apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - namespace.yaml
  # Online Boutique v0.10.7, unchanged. The commit hash pins the file, because a tag can move.
  # kustomize-controller fetches this URL on every reconcile, so the cluster needs access to raw.githubusercontent.com.
  - https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/5b608cb1dfe317d05e4f1bb8c99b7618452fde87/release/kubernetes-manifests.yaml
  - httproute.yaml
patches:
  # The release makes `frontend-external` a LoadBalancer on port 80. Traefik holds node port 80 through ServiceLB.
  # Users reach the shop through the HTTPRoute, so this Service is not needed.
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
