# The route from the Traefik Gateway to the Service frontend. The Gateway listener `web` allows routes from all namespaces (traefik-config.yaml).
# Traefik is not in the mesh, so it sends plain HTTP to the sidecar of the frontend pod. The mesh stays in PERMISSIVE mode for this.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: boutique
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
