<rect x="40" y="466" width="280" height="64" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="6,4"/>
<text x="180.0" y="489.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1. List the changed files</text>
<text x="180.0" y="507.0" font-size="14" text-anchor="middle" dominant-baseline="middle">diff of the PR base and head</text>
<rect x="40" y="610" width="280" height="72" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="6,4"/>
<text x="180.0" y="628.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2. Map the files to services</text>
<text x="180.0" y="646.0" font-size="14" text-anchor="middle" dominant-baseline="middle">path-to-service map</text>
<text x="180.0" y="664.0" font-size="14" text-anchor="middle" dominant-baseline="middle">a shared file adds all consumers</text>
<rect x="40" y="762" width="280" height="64" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="6,4"/>
<text x="180.0" y="785.0" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="bold">3. Build each affected service</text>
<text x="180.0" y="803.0" font-size="14" text-anchor="middle" dominant-baseline="middle">push eph-&lt;name&gt;:&lt;sha&gt;</text>
<rect x="40" y="906" width="280" height="72" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-dasharray="6,4"/>
