---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: eck-operator
  namespace: kube-system
spec:
  chart: eck-operator
  targetNamespace: observability
  createNamespace: true
  repo: https://helm.elastic.co
  version: 3.2.0
  valuesContent: |
    installCRDs: false
    telemetry:
      disabled: true