---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: observability
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
  rules:
    - backendRefs:
        - name: kibana-kb-http
          port: 5601
      matches:
        - path:
            value: /kibana