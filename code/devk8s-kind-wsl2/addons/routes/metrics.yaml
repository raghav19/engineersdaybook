---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: prometheus-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: observability
spec:
  parentRefs:
      - name: traefik
        namespace: traefik
  rules:
    - backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
      matches:
        - path:
            type: PathPrefix
            value: /prometheus
