# Egress allowlist for the sandboxed MCP server.
#
# Enforcement does NOT come from this file. It comes from the mcp-egress-*
# network having no route off-box (see compose.yaml) — a server that ignores
# HTTPS_PROXY finds there is nowhere else to go. This file decides only which
# destinations are permitted once traffic arrives here.
#
# One ACL pair per server, matched on source subnet, so each server reaches
# only its own destinations. There is one server today and the src ACL is
# therefore redundant; it stays because the per-server shape is the point —
# a second server means a second network, a second subnet and a second pair
# of rules, and that repetition is exactly what Part 3 argues against.
#
# Source subnet is the discriminator rather than, say, a listening port per
# server, because a port is chosen by the caller: a compromised server would
# simply dial the other one's port and inherit its allowlist. A source address
# is assigned by the bridge, and `--cap-drop ALL` removes the CAP_NET_RAW and
# CAP_NET_ADMIN a container would need to change or spoof it.
#
# The subnet below is pinned in compose.yaml; see the comment there for how
# the range was chosen. Editing one file without the other silently breaks the
# scoping — or, worse, swaps it.

http_port 3128

# Resolve A before AAAA. The bridge networks have no IPv6 route, so without
# this any destination publishing an AAAA record fails with an opaque
# `TCP_TUNNEL/503` while IPv4-only hosts work fine. api.github.com is
# IPv4-only today, which makes this belt-and-braces rather than load-bearing
# — but it costs nothing and the day GitHub adds AAAA it stops being free.
dns_v4_first on

# The ICMP pinger measures RTT for peer selection. There are no cache_peers
# here, and `--cap-drop ALL` takes the CAP_NET_RAW it needs, so it would only
# log `FATAL: Unable to open any ICMP sockets` on every start.
pinger_enable off

# --- per-server source networks -------------------------------------------
acl github_net src 10.123.2.0/24

# --- per-server destination allowlists -------------------------------------
# github: one host, which is the entire point of the server. The value is not
# that it stops the server working — it is that a token minted inside this
# container can only ever be spent toward this one destination.
acl github_hosts dstdomain api.github.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow github_net github_hosts
http_access deny all

# No caching: this is a policy point, not an accelerator.
cache deny all

# Every outbound attempt, allowed or denied, to `docker logs mcp-egress-proxy`.
# This is the network-side half of the audit trail. It only works because the
# container starts as uid 13 and never drops privileges — see compose.yaml.
access_log stdio:/dev/stdout
