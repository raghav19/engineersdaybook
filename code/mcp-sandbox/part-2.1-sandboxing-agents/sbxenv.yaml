---
schemaVersion: "1"
name: sandbox-dev
agent: sbx-kit-shell
workspace:
  path: ../../..
  clone: true
args:
  appId:
    description: GitHub App id. Not a secret.
    required: true
  installationId:
    description: GitHub App installation id. Not a secret.
    required: true
  keyPath:
    description: Path to the GitHub App private key on the host. A path, never its contents.
    required: true
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  - docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ghcr.io/raghav19/dev-agent-sandbox/dev-tools@sha256:7b75337b3d815ddae40bd8f571cff5bec6997ba4fb80468fccfd5890648584c2 # task sandbox:build pins this to the digest it pushed
sandboxOptions:
  cpus: 2
  memory: 2g
secrets:
  github-mcp:
    command: ${{ env.fileDir }}/scripts/mint-gh-app-token.sh ${{ env.args.appId }} ${{ env.args.installationId }} ${{ env.args.keyPath }}
    refresh: 55m
bindings:
  github-mcp:
    apiKey:
      domains:
        - api.githubcopilot.com
