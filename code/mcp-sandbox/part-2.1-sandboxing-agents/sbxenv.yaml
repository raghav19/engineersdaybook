---
schemaVersion: "1"
name: dev-agent-sbx
agent: dev-agent-sandbox
workspace:
  path: ../../..
  clone: true
args:
  appId:
    description: GitHub App id. Not a secret.
    default: "4999686"
  installationId:
    description: GitHub App installation id. Not a secret.
    default: "162969352"
  keyPath:
    description: Path to the GitHub App private key on the host. A path, never its contents.
    default: $HOME/.config/mcp-gh/mcp-gh-local.2026-09-19.private-key.pem
kits:
  - ghcr.io/raghav19/dev-agent-sandbox@sha256:0c3f875bd43d5c25e4ee605e5878c277b32fec8a8ffada12ce334ddb08066b10 # written by task sandbox:pin
sandboxOptions:
  cpus: 2
  memory: 2g
secrets:
  github-mcp:
    command: ${{ env.fileDir }}/mint-gh-app-token.sh ${{ env.args.appId }} ${{ env.args.installationId }} ${{ env.args.keyPath }}
    refresh: 55m
bindings:
  github-mcp:
    apiKey:
      domains:
        - api.githubcopilot.com
