---
schemaVersion: "1"
name: dev-agent-sbx
agent: sbx-kit-shell
workspace:
  path: ../../..
  clone: true
args:
  appId:
    description: GitHub App id. Not a secret.
    required: true
  installationId:
    description: GitHub App installation id. Not a secret.
    required: true
  keyPath:
    description: Path to the GitHub App private key on the host. A path, never its contents.
    required: true
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  - docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ghcr.io/raghav19/dev-agent-sandbox/dev-tools@sha256:8ebd83fa8b379cbd397092c9c9d52ebc165df2ce9c9d510f1a4e52099e39a788 # task sandbox:build pins this to the digest it pushed
sandboxOptions:
  cpus: 2
  memory: 2g
secrets:
  github-mcp:
    command: ${{ env.fileDir }}/scripts/mint-gh-app-token.sh ${{ env.args.appId }} ${{ env.args.installationId }} ${{ env.args.keyPath }}
    refresh: 55m
bindings:
  github-mcp:
    apiKey:
      domains:
        - api.githubcopilot.com
