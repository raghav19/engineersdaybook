# syntax=docker/sandbox-kit:3
# dev-agent-sandbox: a jailed Claude Code sandbox for developers of this repo.
# One set kit: the Claude workload plus this repo's own capabilities.
# No arguments: nothing here is specific to a person. The GitHub App id,
# installation id and key stay on the developer's host (see the Taskfile).
schemaVersion: "3"
displayName: dev-agent-sandbox
description: >-
  Claude Code in a microVM for developers of this repository. GitHub is
  reached only through the hosted GitHub MCP server, with a host-minted
  GitHub App token that the sbx proxy injects.
kind: set
version: "0.1.0"

kits:
  - ref: docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ref: docker.io/docker/sbx-kit-shell:1.0.0

capabilities:
  # Egress rules for the sandboxed environment. @2 adds method and path rules; deny wins over any allow,
  # including the host's own sbx policy. The deny below stops gh or curl from using the injected token to
  # delete repositories through the REST API. It does not block other writes: add methods to widen it.
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - api.githubcopilot.com
          - mcp.draw.io
          - schemas.fluxoperator.dev
          - mise.run
          - mise.jdx.dev
          - mise-versions.jdx.dev
          - github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - dl.k8s.io # kubectl
          - cdn.dl.k8s.io
          - get.helm.sh # helm
          - update.code.visualstudio.com
          - vscode.download.prss.microsoft.com
          - marketplace.visualstudio.com
          - "**.vsassets.io"
        deny:
          - hosts: [api.github.com]
            methods: [DELETE]
            paths: [/repos/**]

  # The GitHub credential. Inject-only: no apiKey.name, so no environment variable and nothing at all
  # inside the VM. The value lives on the host (sbxenv.yaml stores it from the minter command, a
  # short-lived GitHub App token). The service is named github-mcp, not github: `github` is an sbx built-in
  # whose default domains include api.github.com, so gh and git would also get the token. A custom name is
  # injected only on the domains listed below. Required, not optional: this kit exists to give the agent
  # GitHub without giving it the credential.
  - type: com.docker.sandbox/credential@1
    config:
      service: github-mcp
      phase: runtime
      apiKey:
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  # The VM's dev environment comes from the repo: mise.toml gives the tools and the `sandbox:setup` task (system, shell,
  # completions, VS Code extensions). The one hook installs mise and runs that task at every boot. It cannot fail the
  # sandbox: it only warns (see /var/log/sbx-kit-startup.log).
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup: # every boot, so a committed change to mise.toml or the files it reads applies after a restart
        - command:
            - sh
            - -c
            - |
              export HOME=/home/agent PATH="/home/agent/.local/bin:$PATH"
              cd "$WORKSPACE_DIR" || exit 0
              command -v mise >/dev/null || curl -fsSL https://mise.run | sh
              mise trust -q && mise run sandbox:setup || echo "warning: sandbox setup failed" >&2
          user: "1000"
          env: [WORKSPACE_DIR, HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy, NO_PROXY, no_proxy, SSL_CERT_FILE, REQUESTS_CA_BUNDLE, NODE_USE_ENV_PROXY, NODE_EXTRA_CA_CERTS]

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        You are running inside a jailed sandbox (a microVM) for developers of this repository.
        GitHub access is provided by the hosted GitHub MCP server in the repository's .mcp.json.
        You hold no GitHub credential: the host injects a short-lived token, only on requests to
        the MCP server. Use the MCP tools for anything on GitHub; git push, gh and direct API
        calls from here have no credential and will fail. Your repository is a private clone:
        commit your work on a branch, and the developer fetches it from the sandbox remote.
