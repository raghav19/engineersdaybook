version: '3'

# sandbox:build  maintainer: build the kit, push it to ghcr.io and pin its digest in sbxenv.yaml (sandbox:pin)
# sandbox:run    developer: `sbx env run . --detached`, then open VS Code on the sandbox (sandbox:ide)
# sandbox:ide    developer: reopen VS Code on the running sandbox
# sandbox:claude developer: attach Claude Code to the running sandbox in this terminal
#
# sbxenv.yaml declares the sandbox (kit digest, GitHub secret, clone workspace). `sbx env run` prints that plan and
# asks for approval. Registry logins are done once per machine, see the README.

silent: true

vars:
  REGISTRY_REPO: ghcr.io/raghav19/dev-agent-sandbox
  KIT_VERSION: 0.1.0
  NAME:
    sh: yq .name sbxenv.yaml

tasks:
  sandbox:build:
    desc: Maintainer. Build the kit, push it to ghcr.io and pin its digest in sbxenv.yaml
    cmds:
      - docker buildx build . -f agent-sandbox.yaml --push -t {{.REGISTRY_REPO}}:{{.KIT_VERSION}}
      - task: sandbox:pin

  sandbox:pin:
    desc: Maintainer. Write the digest the registry holds for the kit tag into sbxenv.yaml
    vars:
      # Evaluated when this task starts, so after the push. A failed lookup stops the task before the write.
      DIGEST:
        sh: docker buildx imagetools inspect {{.REGISTRY_REPO}}:{{.KIT_VERSION}} --format '{{`{{.Manifest.Digest}}`}}'
    cmds:
      - yq -i '.kits[0] = "{{.REGISTRY_REPO}}@{{.DIGEST}}" | .kits[0] line_comment = "written by task sandbox:pin"' sbxenv.yaml
      - echo "pinned {{.DIGEST}}"

  sandbox:run:
    desc: Developer. Create or start the sandbox and open VS Code on it, then return (detached)
    cmds:
      - sbx env run . --detached {{.CLI_ARGS}}
      - task: sandbox:ide

  sandbox:ide:
    desc: Developer. Reopen VS Code on the running sandbox
    cmds:
      - code --folder-uri "vscode-remote://ssh-remote+{{.NAME}}.sbx$(git rev-parse --show-toplevel)"

  sandbox:claude:
    desc: Developer. Attach Claude Code to the running sandbox in this terminal
    cmds:
      - sbx run --name {{.NAME}}
