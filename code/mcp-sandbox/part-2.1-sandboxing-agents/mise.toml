# Host environment for the sandbox tasks: `task sandbox:run` passes these to sbx as the args that sbxenv.yaml declares
# (sbx has no native way to read them from the environment). The values are not secrets.
# Put personal overrides in a gitignored mise.local.toml.
[env]
# The encrypted secrets, decrypted by mise's native sops support with the age key at ~/.config/mise/age.txt. This puts GITHUB_TOKEN in the
# environment of every process mise starts in this folder, so do not start an agent session here with mise active. redact only hides it in task output.
_.file = { path = ".env.secrets.json", redact = true }
GH_APP_ID = "4999686"
GH_APP_INSTALLATION_ID = "162969352"
GH_APP_KEY_PATH = "{{env.HOME}}/.config/mcp-gh/mcp-gh-local.2026-09-19.private-key.pem"
