apiVersion: apps/v1
kind: Deployment
metadata:
  name: ext-mcp
  labels: {app.kubernetes.io/name: ext-mcp}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ext-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ext-mcp}
      annotations:
        # The sidecar template plus the "spire" template of istiod (platform/addons/istio/istiod.yaml): the SVID of the proxy comes from SPIRE.
        inject.istio.io/templates: sidecar,spire
    spec:
      # Its own service account: the SPIFFE ID is spiffe://<trust domain>/ns/mcp-guardrails/sa/ext-mcp.
      serviceAccountName: ext-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ext-mcp
          image: ext-mcp
          ports:
            - containerPort: 4445
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
