apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The fleet layer of the values: the defaults every cluster starts from, as one flat KEY=value file.
# `task render` merges clusters/<name>/values.env over it, with a generator with `behavior: merge`. A cluster lists only the keys it changes.
# The ConfigMap is a render input. `task render` removes it from the output and fails on a key that no wiring rule reads (wiring/).
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mcp-values
    namespace: agentgateway-system
    envs:
      - values.env
