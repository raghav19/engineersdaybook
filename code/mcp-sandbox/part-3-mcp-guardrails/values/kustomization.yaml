apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The fleet layer of the values: the defaults every cluster starts from, as one flat KEY=value file.
# A cluster layer, clusters/<name>/values.env, merges over it with a generator with `behavior: merge`; wiring/ writes the result into the manifests.
# Not read by `just build` yet: how per-cluster values reach the manifests is being redesigned. Until then the component folders hold the
# concrete fleet values, and for the kind cluster (no overrides) that equals what this layer produced.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mcp-values
    namespace: agentgateway-system
    envs:
      - values.env
