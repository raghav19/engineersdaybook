# The build functions of lib/tools that every build runs, each its own artifact ghcr.io/raghav19/mcp-guardrails/tools/<name>.
# `just lib/tools/<name>/push` prints the block to put here.
#
#   digest   the artifact in the registry. This is what is pulled, so it cannot change under the pin.
#   binary   the sha256 of the executable inside it. The build checks it after every pull and refuses a mismatch.
#
# The same on every cloud, so global config. It is not in config/*.yaml on purpose: config-builder converges those files, so it
# cannot read its own pin from them, and it rejects names no setters.yaml lists. This folder is not on a placement path.
# Roll one back with `git revert` of its block.
config-builder:
  digest: 'sha256:300b2160f338e10db7ca87dee7431fe4a294f095f22048c93782e1f6f8d7f746'
  binary: 'sha256:2b86a15d130efb878306c56fa6dbdedaaf4a21e80b66cbd03bf6c46f9b18cd2d'
value-injector:
  digest: 'sha256:59393795c0deb9dc2ee86c4a103ccaf82a554e4c35e90c222a6607b7824b3b1e'
  binary: 'sha256:fcc57a4b6b3263c98844074f3a539d2bbbf1b92eaf4c9674034ba45be6c8902d'
