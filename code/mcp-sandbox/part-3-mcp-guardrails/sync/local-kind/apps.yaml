# The apps of the cluster: each one is a group of units. An app applies the stack file in its folder (infra/<app>/stack.yaml).
# The source is the GitRepository that the FluxInstance creates. The path is relative to the root of the Git repository.
# A later app (the first real workload) is a third entry here and a folder next to infra/.
# No app has dependsOn on another app. The units name what they need in their own dependsOn (authn-jwt waits for routes). Apps share one GitRepository, and a
# dependsOn between them makes the dependent app wait for the other app to apply every new revision, about 30s for each retry.
# deletionPolicy Orphan: deleting an app (removing its entry here) leaves its units running. Flux does not delete in dependsOn order, so a delete of an app
# would delete all its units at once. A unit that leaves its stack is still pruned: that deletes the unit and its workloads, as before.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addons
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 25m # the longest dependsOn chain of the units: cert-manager, external-secrets, secret-store, mcp-servers, routes (20m)
  prune: true
  deletionPolicy: Orphan
  wait: true
  path: ./code/mcp-sandbox/part-3-mcp-guardrails/sync/local-kind/infra/addons
  sourceRef: {kind: GitRepository, name: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m # the units wait for each other in parallel, the longest is 3m
  prune: true
  deletionPolicy: Orphan
  wait: true
  path: ./code/mcp-sandbox/part-3-mcp-guardrails/sync/local-kind/infra/policies
  sourceRef: {kind: GitRepository, name: flux-system}
