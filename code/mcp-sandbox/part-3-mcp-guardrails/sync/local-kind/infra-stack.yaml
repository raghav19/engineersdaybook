# The infrastructure of cluster `local-kind`: the components of platform/addons (CRDs, controllers, gateways).
# Per artifact, one pair:
#   OCIRepository  the pin: which pushed artifact of this cluster runs. Rollout and rollback are an edit of ref, in Git.
#   Kustomization  how Flux applies that artifact (order, health).
# Both are named after the component folder; `just <folder>/push` pushes it and `just <folder>/pin` writes the pin.
#
# ref.tag `unpinned` means no artifact is pushed yet: its Kustomization stays not Ready. `just <folder>/pin` writes the tag (the commit) and the digest.
# Flux never reverts a failed artifact by itself: put the older pin back (git revert).
#
#   gateway-api ──► agentgateway          (the Kustomizations of app-stack.yaml wait for agentgateway)
#
#   spire ──► istio ──► istio-ingress (the L4 gateway: its pod is injected only once istiod's webhook serves; also waits for spire)
#
#   spire is the CA of trust domain mcp.local; istio takes its CA from it (sidecar mode only, no ambient).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/gateway-api
  secretRef:
    name: ghcr-pull
  ref:
    tag: 5f7e9eee881c
    digest: sha256:c1bd1df5838e4c33c9126c892a5ce43ef3f1a57db7fe99ecfc04235246d5de0a
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: false
  wait: true # CRDs report Established. A removed CRD must not delete every custom resource of its kind.
  path: ./
  sourceRef: {kind: OCIRepository, name: gateway-api}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/agentgateway
  secretRef:
    name: ghcr-pull
  ref:
    tag: 5f7e9eee881c
    digest: sha256:cd4e5e01c29dcd59ef23b188ec0852ff675e63c24f6714753cab68d328d77328
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the artifact holds the rendered chart: the controller Deployment must roll out and the CRDs report Established.
  path: ./
  sourceRef: {kind: OCIRepository, name: agentgateway}
  dependsOn:
    - name: gateway-api
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spire
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/spire
  secretRef:
    name: ghcr-pull
  ref:
    tag: 0e08da687020
    digest: sha256:9ded63ee01b3e10fede99a4332f86c18039d753680eaa38475e52636889ac6fb
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spire
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m # the controller-manager webhook can reject a custom resource of the first apply: the retry settles it
  timeout: 5m
  prune: true
  wait: true # the server StatefulSet and the agent and CSI DaemonSets roll out. The CRDs and namespaces travel in this artifact.
  path: ./
  sourceRef: {kind: OCIRepository, name: spire}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/istio
  secretRef:
    name: ghcr-pull
  ref:
    tag: 60b6d97d2498
    digest: sha256:9f68ea87b363e620c0963556e199f9877848fb9dbba418ce5538e139cbdcb4be
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # istiod rolls out. The CRDs and the namespace travel in this artifact.
  path: ./
  sourceRef: {kind: OCIRepository, name: istio}
  dependsOn:
    - name: spire # the CA and the CSI driver
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istio-ingress
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/istio-ingress
  secretRef:
    name: ghcr-pull
  ref:
    tag: 60b6d97d2498
    digest: sha256:9e75f218cc724b7208e92943444461d48e033a4a32e747bf5f3dc65a985fcb2b
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-ingress
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m # the SPIFFE CSI driver of spire can be late: the gateway pod waits for it, the retry settles it
  timeout: 5m
  prune: true
  wait: true # the gateway Deployment rolls out. Its pod is created only once the injection webhook of istiod serves: that is why this is not in `istio`.
  path: ./
  sourceRef: {kind: OCIRepository, name: istio-ingress}
  dependsOn:
    - name: istio # istiod and its injection webhook
    - name: spire # the ClusterSPIFFEID kind and the CSI driver
