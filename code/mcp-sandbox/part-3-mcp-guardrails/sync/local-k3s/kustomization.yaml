apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# What Flux reads from Git for the cluster `local-k3s` (sync/<full name>/, named in clusters/k3s/cluster.yaml).:
#   apps.yaml      the groups: secrets, mesh and gateway. Each group is a `Kustomization` that applies the stack of its folder.
#   infra/<group>/ the stack of the group: the units of its components (infra/secrets/stack.yaml, infra/mesh/stack.yaml, infra/gateway/stack.yaml). This build does not enter these folders.
# Flux itself (the FluxInstance, clusters/k3s/flux-instance.yaml) is not here on purpose: this folder cannot remove it.
resources:
  - apps.yaml
