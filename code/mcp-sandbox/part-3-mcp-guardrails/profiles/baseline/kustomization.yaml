apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Gateway in path, upstream credential held by the gateway, no guardrails. The "before" in every test.
resources:
  - ../../platform/base/namespaces
  - ../../platform/base/controller
  - ../../platform/base/gateway
  - ../../platform/base/backend
  - ../../platform/base/defaults
components:
  - ../../platform/components/secrets-sops
