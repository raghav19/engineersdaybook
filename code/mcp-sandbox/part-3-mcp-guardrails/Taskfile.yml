version: '3'

# Orchestration only. Everything declarative lives in platform/, policies/, values/, services/ and clusters/, and the tasks live in tasks/:
#   tasks/checks.yml      prechecks the others depend on: tools, kubectl context
#   tasks/cluster.yml     cluster:up (kind, Flux Operator, the hand-over to Flux), cluster:down
#   tasks/artifacts.yml   chains, render, diff, push, review: one task set for every artifact (logic in render.sh and artifacts.sh)
#   tasks/tests.yml       tests:run
#
# One folder per cluster in clusters/<name>. CLUSTER selects it (default kind).
#
#   task chains                      the artifacts of the cluster, what each waits for, the pin
#   task render [CHAIN=<chain>]      render the cluster (or one artifact) to out/<cluster>/<chain>/ and run the checks
#   task diff   [CHAIN=<chain>]      compare the render with the artifacts at the pinned digests
#   task push   [CHAIN=<chain>]      host: push what changed to the registry, print the digest lines for the stack
#   task review [CHAIN=<chain>]      pull the pinned artifact to review/ for reading
#   task cluster:up                  host: kind, Flux Operator, FluxInstance. No credential needed. Flux applies everything else
#   task cluster:credentials         host: the Secrets sops-age and ghcr-pull that Flux waits for (needs the age key and GHCR_*)
#   task tests:run                   run tests/attacks against the gateway (http://127.0.0.1:8080/mcp)
#   task cluster:down

silent: true

includes:
  checks:
    taskfile: tasks/checks.yml
    flatten: true
  cluster:
    taskfile: tasks/cluster.yml
    flatten: true
  artifacts:
    taskfile: tasks/artifacts.yml
    flatten: true
  tests:
    taskfile: tasks/tests.yml
    flatten: true

vars:
  CLUSTER: '{{.CLUSTER | default "kind"}}'
  # CLUSTER=all: every folder in clusters/ with a sync/stack.yaml
  CLUSTERS:
    sh: |
      if [ "{{.CLUSTER}}" = all ]; then
        for f in {{.ROOT_DIR}}/clusters/*/sync/stack.yaml; do basename "$(dirname "$(dirname "$f")")"; done
      else
        echo "{{.CLUSTER}}"
      fi
  KIND_CLUSTER:
    sh: yq .name {{.ROOT_DIR}}/clusters/{{.CLUSTER}}/kind-config.yaml
  KUBE_CONTEXT: kind-{{.KIND_CLUSTER}}
  # baseline when the cluster stack has no policy artifact, phase-1 when it has authn-jwt. tests:run expects the results of that profile.
  PROFILE:
    sh: if yq -N '.metadata.name' {{.ROOT_DIR}}/clusters/{{.CLUSTER}}/sync/stack.yaml | grep -qx authn-jwt; then echo phase-1; else echo baseline; fi
  # Host side of the extraPortMappings in clusters/<name>/kind-config.yaml.
  GATEWAY_URL: http://127.0.0.1:8080/mcp

tasks:
  default:
    cmds:
      - task --list
