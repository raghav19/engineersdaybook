version: '3'

# Orchestration only. Everything declarative lives in crds/, platform/, profiles/, services/, and the tasks live in tasks/, one file per concern:
#   tasks/checks.yml      prechecks the others depend on: tools, kubectl context
#   tasks/cluster.yml     cluster:up, cluster:down (kind, from kind-config.yaml)
#   tasks/platform.yml    crds:apply, gateway:diff, gateway:apply
#   tasks/tests.yml       tests:run
#
# The guardrail profile is PROFILE (default baseline): `task gateway:apply PROFILE=phase-1`.
#
#   task bootstrap                  cluster:up, crds:apply, gateway:apply in order
#   task tests:run                  run tests/attacks against the gateway (http://127.0.0.1:8080/mcp)
#   task cluster:down

silent: true

includes:
  checks:
    taskfile: tasks/checks.yml
    flatten: true
  cluster:
    taskfile: tasks/cluster.yml
    flatten: true
  platform:
    taskfile: tasks/platform.yml
    flatten: true
  tests:
    taskfile: tasks/tests.yml
    flatten: true

vars:
  PROFILE: '{{.PROFILE | default "baseline"}}'
  KIND_CLUSTER:
    sh: yq .name {{.ROOT_DIR}}/kind-config.yaml
  KUBE_CONTEXT: kind-{{.KIND_CLUSTER}}
  # Host side of the extraPortMappings in kind-config.yaml.
  GATEWAY_URL: http://127.0.0.1:8080/mcp

tasks:
  default:
    cmds:
      - task --list

  bootstrap:
    desc: Create the cluster, install the CRDs and apply the gateway, in order
    cmds:
      - task: cluster:up
      - task: crds:apply
      - task: gateway:apply
