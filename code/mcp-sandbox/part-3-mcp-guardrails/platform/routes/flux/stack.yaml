apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: routes
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/routes
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the HTTPRoute refers to the Backend registered by mcp-servers.
  path: ./
  sourceRef: {kind: OCIRepository, name: routes}
  dependsOn:
    - name: agentgateway
    - name: mcp-servers
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: status.conditions.exists(c, c.type == 'Programmed' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Programmed' && c.status == 'False')
