# The fields of this folder a config value can override: name, then the object and the path it goes into. A number in a path is a position
# in a list. Without a value in config/ the field keeps what the manifest holds.
gateway_port:
  - object: Gateway/agentgateway-proxy
    path: spec.listeners.0.port
  - object: AgentgatewayParameters/agentgateway-proxy
    path: spec.service.spec.ports.0.port
