apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  service:
    spec:
      # The gateway is a NodePort. On k3s the node is the host, so the nodePort is a host port.
      type: NodePort
      ports:
        # Strategic merge on `port`: the generated listener port gets a fixed nodePort. The port is the default of `gateway_port` in config/ (setters.yaml).
        # tests/justfile (gateway_url) uses this nodePort, so keep the two equal.
        - port: 8080
          nodePort: 30080
