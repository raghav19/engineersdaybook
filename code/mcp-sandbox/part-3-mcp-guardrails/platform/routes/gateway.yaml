apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      # Rootless Docker cannot publish a port below 1024. The fleet value is GATEWAY_PORT in values/values.env
      # (values/wiring does not stamp it yet).
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
