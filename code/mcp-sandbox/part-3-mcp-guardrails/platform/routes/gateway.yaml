apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      # This is the default; `gateway_port` in config/ overrides it (setters.yaml).
      # tests/justfile is not a component: keep it equal by hand.
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
