apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: agentgateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      # Rootless Docker cannot publish a port below 1024. This is the default; `gateway_port` in config/ overrides it (setters.yaml).
      # clusters/kind/kind-config.yaml (host port) and tests/justfile are not components: keep them equal by hand.
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
