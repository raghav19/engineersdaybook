apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/gateway-api
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: false
  wait: true # CRDs report Established. A removed CRD must not delete every custom resource of its kind.
  path: ./
  sourceRef: {kind: OCIRepository, name: gateway-api}
