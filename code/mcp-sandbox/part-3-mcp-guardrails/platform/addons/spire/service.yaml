# NodePort Service for the SPIRE server API. The sandbox VM reaches it at host 127.0.0.1:18081 (clusters/kind/kind-config.yaml).
# The chart Service (spire-server) stays ClusterIP. The selector is the label set of the chart StatefulSet (spire chart 0.30.3).
apiVersion: v1
kind: Service
metadata:
  name: spire-server-nodeport
  namespace: spire-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: spire
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      nodePort: 30081
      protocol: TCP
