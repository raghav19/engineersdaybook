# NodePort Service for the SPIRE server API. The sandbox VM reaches it at the host, port 30081 (the k8s cluster is k3s on the host, so the NodePort is the host port).
# The chart Service (spire-server) stays ClusterIP. The selector is the label set of the chart StatefulSet (spire chart 0.30.3).
apiVersion: v1
kind: Service
metadata:
  name: spire-server-nodeport
  namespace: spire-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: spire
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      nodePort: 30081
      protocol: TCP
