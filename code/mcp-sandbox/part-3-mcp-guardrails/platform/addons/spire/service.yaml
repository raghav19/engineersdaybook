# The SPIRE server API on a NodePort, for the SPIRE agent in the sandbox VM. The VM is a node of its own: the agent attests it with a join token
# (just sandbox agent spire-enroll) and reaches the server through the host, 127.0.0.1:18081 (clusters/kind/kind-config.yaml). The chart Service
# (spire-server, ClusterIP, port 443) has no nodePort setting, so this is a second Service for the same pod. The selector is the label set of the
# server StatefulSet that the chart renders (spire chart 0.30.3).
apiVersion: v1
kind: Service
metadata:
  name: spire-server-nodeport
  namespace: spire-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: spire
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      nodePort: 30081
      protocol: TCP
