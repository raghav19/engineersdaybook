apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The SPIRE addon: its namespace, the CRD chart (crds.yaml) and the spire chart (spire.yaml), both installed by Flux as a HelmRelease.
# It also holds the CA of the node attestor (node-ca.yaml), made by cert-manager. One folder, one artifact.
resources:
  - namespace.yaml
  - crds.yaml
  - spire.yaml
  - service.yaml
  - node-ca.yaml
