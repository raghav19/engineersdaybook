# The SPIRE CRD chart (ClusterSPIFFEID, ClusterFederatedTrustDomain, ClusterStaticEntry), installed by Flux (helm-controller).
# The chart source below is shared with spire.yaml. The CRD chart and the spire chart have their own version lines.
# Helm never upgrades files in a chart's crds/ folder, so the CRD policy is CreateReplace. Helm never deletes them either.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: spiffe
  namespace: spire-system
spec:
  interval: 10m
  url: https://spiffe.github.io/helm-charts-hardened/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spire-system
spec:
  interval: 10m
  releaseName: spire-crds
  chart:
    spec:
      chart: spire-crds
      version: 0.6.1
      sourceRef:
        kind: HelmRepository
        name: spiffe
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  # The artifact holds the rendered CRDs. Flux must never prune one: deleting a CRD deletes every custom resource of its kind.
  # Delete them explicitly: `just clusters/kind/delete-crds`.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: CustomResourceDefinition}
            patch: |
              - op: add
                path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
                value: disabled
