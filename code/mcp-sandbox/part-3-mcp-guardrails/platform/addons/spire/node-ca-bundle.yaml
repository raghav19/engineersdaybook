# The certificate of the node CA, as a ConfigMap for the SPIRE server. The key stays in the Secret node-ca.
# trust-manager copies tls.crt of the Secret node-ca (spire-system) into the ConfigMap node-ca-bundle, key ca-bundle.pem. The ConfigMap gets the name of the Bundle.
# The target is spire-system only. The default is every namespace.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: node-ca-bundle
spec:
  sources:
    - secret:
        name: node-ca
        key: tls.crt
  target:
    configMap:
      key: ca-bundle.pem
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: spire-system
