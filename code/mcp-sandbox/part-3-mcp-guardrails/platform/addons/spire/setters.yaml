# Which config value (config/) goes into which field of this folder. Path: dotted, a number is a position in a list.
# A chart value is a field of the HelmRelease, so its path starts at spec.values.
trust_domain:
  - {object: HelmRelease/spire, path: spec.values.global.spire.trustDomain}
cluster_name:
  - {object: HelmRelease/spire, path: spec.values.global.spire.clusterName}
