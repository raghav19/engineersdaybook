# The VM entry. It gives the microVM sandbox-dev its SPIFFE ID. The key of this ID stays on the host, with the delegate.
# The host SPIRE agent matches it when the delegate sends the pid of the VMM (the host process that runs the VM). The node entry (node-entry.yaml) is the parent.
# msbvm:name is the name of the VM. The selector type msbvm comes from the plugin msbvm of the project code/agent-workload-identity. The plugin reads the name from the VMM and checks it in msb.db.
# unix:uid is the uid of the host user that runs the VMM. It comes from the unix workload attestor of SPIRE.
# This entry matches nothing until the plugin msbvm exists and the agent loads it.
# shortcut: this file has the trust domain mcp.local, the user raghav19, the VM name sandbox-dev and the uid 1000 as literal text. A setter replaces a whole value, and these values are parts of a URI or of a selector string. Change the trust domain here and in config/ together. Change the other values here.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: sandbox-vm
spec:
  parentID: spiffe://mcp.local/node/sandbox-dev
  spiffeID: spiffe://mcp.local/node/sandbox-dev/user/raghav19/vm/sandbox-dev
  selectors:
    - msbvm:name:sandbox-dev
    - unix:uid:1000
