# The trust-manager chart, installed by Flux (helm-controller) in spire-system. The version is the tag below, here only.
# It copies the certificate of the node CA (node-ca.yaml) into the ConfigMap that the SPIRE server mounts (node-ca-bundle.yaml).
# It lives in this addon, and not in a unit of its own, for the namespace: trust-manager reads source Secrets only from its trust namespace,
# and the Secret node-ca is in spire-system. This artifact creates that namespace, so no unit waits for another unit. The CRD travels in this artifact.
# Chart values: put them under spec.values. `just diff` shows what a value changes in the objects the chart renders.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trust-manager
  namespace: spire-system
spec:
  interval: 10m
  url: oci://quay.io/jetstack/charts/trust-manager
  ref:
    tag: v0.26.0
  # A HelmRelease reads a chart from an OCIRepository when this layer selector names the chart layer.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: spire-system
spec:
  interval: 10m
  releaseName: trust-manager
  chartRef:
    kind: OCIRepository
    name: trust-manager
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    app:
      trust:
        # The namespace of the source Secret node-ca. The chart gives trust-manager a Role that reads Secrets here.
        namespace: spire-system
      # trust-manager may write ConfigMaps only here. The default is every namespace.
      targetNamespaces:
        - spire-system
    # The Bundle has one source, the Secret node-ca. It does not use the default CA package.
    defaultPackage:
      enabled: false
  # The artifact holds the rendered CRD. Flux must never prune it: deleting a CRD deletes every custom resource of its kind.
  # Delete it explicitly: `just clusters/kind/delete-crds`.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: CustomResourceDefinition}
            patch: |
              - op: add
                path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
                value: disabled
