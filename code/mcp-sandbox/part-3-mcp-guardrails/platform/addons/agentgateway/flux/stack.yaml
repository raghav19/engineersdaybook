apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/agentgateway
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the artifact holds the rendered chart: the controller Deployment must roll out and the CRDs report Established.
  path: ./
  sourceRef: {kind: OCIRepository, name: agentgateway}
  dependsOn:
    - name: gateway-api
