# The agentgateway controller chart, installed by Flux (helm-controller). The version is the tag below, here only.
# It must equal the CRD chart in crds.yaml: `task render` fails if they differ. Both belong to one chain.
# Chart values: put fleet values under spec.values. A cluster changes one at render time, in its overlay (a wiring rule fed by a key of
# values.env, or a patch on this object). The rendered HelmRelease then shows the value. Flux applies it as it is.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  interval: 10m
  url: oci://cr.agentgateway.dev/charts/agentgateway
  ref:
    tag: v1.6.0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  interval: 10m
  releaseName: agentgateway
  chartRef:
    kind: OCIRepository
    name: agentgateway
  dependsOn:
    - name: agentgateway-crds     # the CRDs first, in the same chain
  driftDetection:
    mode: enabled
  values: {}
