apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/external-secrets
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m # the Certificate and its Issuer need the webhook of cert-manager: the retry settles a first apply that it rejects
  timeout: 5m
  prune: true
  wait: true # the controller, the webhook, the cert-controller and bitwarden-sdk-server roll out, and the CRDs report Established. The CRDs and the namespace travel in this artifact.
  path: ./
  sourceRef: {kind: OCIRepository, name: external-secrets}
  dependsOn:
    - name: cert-manager # the Issuer and Certificate kinds, and the webhook that admits them
