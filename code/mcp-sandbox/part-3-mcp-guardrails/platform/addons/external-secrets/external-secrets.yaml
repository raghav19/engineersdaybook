# The External Secrets Operator chart, installed by Flux (helm-controller). The version is the tag below, here only.
# ESO copies a secret of Bitwarden Secrets Manager into a Kubernetes Secret (the store is platform/secret-store). The provider calls the
# bitwarden-sdk-server subchart, which calls api.bitwarden.com. ESO supports only the newest minor release: read the release notes at each bump.
# The CRDs are part of this chart. Chart values: put them under spec.values. `just diff` shows what a value changes in the objects the chart renders.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  url: oci://ghcr.io/external-secrets/charts/external-secrets
  ref:
    tag: 2.13.0
  # A HelmRelease reads a chart from an OCIRepository when this layer selector names the chart layer.
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  releaseName: external-secrets
  chartRef:
    kind: OCIRepository
    name: external-secrets
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    installCRDs: true
    # Example change: resource requests for the controller container.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    bitwarden-sdk-server:
      enabled: true
      image:
        # The subchart (v0.6.0) runs the image v0.6.0 by default. That version may not keep its Bitwarden session, and Bitwarden may answer
        # HTTP 429. v0.8.1 is the newest release. Its session management is configurable.
        tag: v0.8.1
        # tls.enabled stays true: ESO calls the server over HTTPS because the access token travels in a header.
        # The Secret bitwarden-tls-certs (the default secretName) comes from sdk-server-tls.yaml.
  # The artifact holds the rendered CRDs. Flux must never prune one: deleting a CRD deletes every custom resource of its kind.
  # Delete them explicitly: `just clusters/kind/delete-crds`.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: CustomResourceDefinition}
            patch: |
              - op: add
                path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
                value: disabled
