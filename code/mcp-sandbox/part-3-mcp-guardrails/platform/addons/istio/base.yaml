# The Istio base chart: the CRDs and the cluster roles of the control plane. Installed by Flux (helm-controller).
# The chart source below is shared with istiod.yaml; the gateway chart (istio-ingress component) has its own copy. All three charts are one
# Istio release: `istio_version` in config/ sets the three versions (setters.yaml of both folders). The version has no default here, so the
# build fails without it.
# The CRD policy is CreateReplace: Helm never upgrades files in a chart's crds/ folder. Helm never deletes them either.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: istio-system
spec:
  interval: 10m
  url: https://blob.istio.io/istio-release/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 10m
  releaseName: istio-base
  chart:
    spec:
      chart: base
      sourceRef:
        kind: HelmRepository
        name: istio
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  # The artifact holds the rendered CRDs. Flux must never prune one: deleting a CRD deletes every custom resource of its kind.
  # Delete them explicitly: `just clusters/kind/delete-crds`.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: CustomResourceDefinition}
            patch: |
              - op: add
                path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
                value: disabled
