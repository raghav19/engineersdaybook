apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Istio addon: its namespace, the base chart (CRDs) and istiod, each installed by Flux as a HelmRelease. One folder, one artifact.
# The ingress gateway is the next component, istio-ingress. The three charts are one release: `istio_version` in config/ sets them.
resources:
  - namespace.yaml
  - base.yaml
  - istiod.yaml
