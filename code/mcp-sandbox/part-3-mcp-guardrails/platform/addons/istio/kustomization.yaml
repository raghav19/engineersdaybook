apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Istio addon: its namespaces, the base chart (CRDs), istiod and the ingress gateway, each installed by Flux as a HelmRelease, and the
# SPIRE identity of the gateway. One folder, one artifact. The three charts are one release: `istio_version` in config/ sets them.
resources:
  - namespace.yaml
  - base.yaml
  - istiod.yaml
  - gateway.yaml
  - clusterspiffeid.yaml
