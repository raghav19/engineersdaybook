# The Istio ingress gateway (an Envoy Deployment in namespace istio-ingress). Installed by Flux (helm-controller).
# The chart source is the HelmRepository in repository.yaml, in this namespace. This component waits for `istio` in infra/mesh/stack.yaml: the
# injection webhook of istiod must be serving when the gateway pod is created, or the pod keeps the placeholder image `auto`.
#
# It is the L4 front door of the stack. The Service is a LoadBalancer: k3s ServiceLB opens the host port 443 for it. It carries one route today,
# the SPIRE server with TLS passthrough (spire-route.yaml). A later change (the routes) sends the MCP traffic through it too,
# and the gateway hands the connection to agentgateway as mTLS.
#
# Its identity comes from SPIRE, like every proxy of this mesh: the CSI driver mounts the Workload API socket into istio-proxy, and the
# ClusterSPIFFEID in clusterspiffeid.yaml selects the pod. The gateway needs no `spire` template: the chart is the pod spec.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress
spec:
  interval: 10m
  releaseName: istio-ingressgateway
  chart:
    spec:
      chart: gateway
      sourceRef:
        kind: HelmRepository
        name: istio
  driftDetection:
    mode: enabled
  values:
    service:
      type: LoadBalancer
      # Only the port of the SPIRE route. ServiceLB opens a host port for each port of the Service, so the ports 15021 and 80 of the chart stay closed.
      ports:
        - name: https
          port: 443
          protocol: TCP
          targetPort: 443
    # One replica, no HPA: the cluster has one node.
    autoscaling:
      enabled: false
    replicaCount: 1
    volumes:
      - name: workload-socket
        csi:
          driver: csi.spiffe.io
          readOnly: true
    volumeMounts:
      - name: workload-socket
        mountPath: /run/secrets/workload-spiffe-uds
        readOnly: true
