# The store of every ExternalSecret in the cluster: one Bitwarden Secrets Manager project, read with one machine account (read-only access token).
# ESO does not call Bitwarden itself. It calls bitwarden-sdk-server (platform/addons/external-secrets), which calls the Bitwarden API.
# organizationID and projectID have no default here: they differ per Bitwarden account, so config/ must set `bitwarden_organization_id` and
# `bitwarden_project_id` (setters.yaml says where they go) and the build fails without them. They are IDs, not secrets.
# The access token is the only secret. It lives in the Secret bitwarden-access-token, which `just clusters/kind/up` creates on the host (never in Git).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      # The US cloud. The EU cloud is https://api.bitwarden.eu and https://identity.bitwarden.eu (`bitwarden_api_url`, `bitwarden_identity_url`).
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      # The self-signed certificate of sdk-server is its own CA (platform/addons/external-secrets/sdk-server-tls.yaml).
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: external-secrets
