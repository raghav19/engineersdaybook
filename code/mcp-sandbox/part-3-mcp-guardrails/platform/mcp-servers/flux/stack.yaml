apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/mcp-servers
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true # the Backend refers to the Secret github-upstream by name. `just clusters/kind/credentials` creates it on the host.
  path: ./
  sourceRef: {kind: OCIRepository, name: mcp-servers}
  dependsOn:
    - name: agentgateway # the namespace of the Secret
