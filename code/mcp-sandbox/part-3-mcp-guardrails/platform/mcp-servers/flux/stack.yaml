apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/mcp-servers
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-servers
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: gateway # the group of the stack: sync/<cluster>/infra/gateway/stack.yaml
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true # the Backend refers to the Secret github-upstream by name. The ExternalSecret reports Ready when ESO wrote it.
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Ready' && c.status == 'False')
  path: ./
  sourceRef: {kind: OCIRepository, name: mcp-servers}
  dependsOn:
    - name: agentgateway # the namespace of the Secret
    - name: secret-store # the ClusterSecretStore that the ExternalSecret reads
