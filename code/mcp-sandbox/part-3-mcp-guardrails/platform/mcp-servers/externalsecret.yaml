# The upstream credential of the gateway (backend.yaml, target github, auth.secretRef). ESO reads the Bitwarden secret GITHUB_APP_CLIENT_SECRET of the
# project in the store `bitwarden` (platform/secret-store) and writes it to the Secret github-upstream, key `Authorization`.
# The value never goes to Git. The agent never holds it (MCP01).
# The key is a name: ESO looks the secret up by name in the project of the store. One refresh per hour keeps the calls to Bitwarden few.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-upstream
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: github-upstream
    creationPolicy: Owner
  data:
    - secretKey: Authorization
      remoteRef:
        key: GITHUB_APP_CLIENT_SECRET
