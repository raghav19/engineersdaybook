apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Default values. A cluster overrides any key by generating the same ConfigMap with `behavior: merge`.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mcp-values
    namespace: agentgateway-system
    envs:
      - values.env
