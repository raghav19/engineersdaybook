apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ext-mcp-from-gateway-only
  namespace: mcp-guardrails
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ext-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
      ports:
        - port: 4445
          protocol: TCP
