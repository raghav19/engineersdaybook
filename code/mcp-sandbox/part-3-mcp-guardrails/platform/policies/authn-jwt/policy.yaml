apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-authn
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: mcp-guardrails.local
          audiences:
            - mcp-gateway
          jwks:
            # Public JWKS only. An empty key set is a placeholder: nothing validates until Keycloak (stage B) or a minted key fills it.
            # This is the default; `jwt_jwks` in config/ overrides it (setters.yaml).
            inline: '{"keys":[]}'
