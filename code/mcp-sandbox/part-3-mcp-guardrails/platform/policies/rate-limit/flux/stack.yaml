apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rate-limit
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/rate-limit
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rate-limit
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true # MCP02, MCP10. Targets the HTTPRoute.
  path: ./
  sourceRef: {kind: OCIRepository, name: rate-limit}
  dependsOn:
    - name: routes
