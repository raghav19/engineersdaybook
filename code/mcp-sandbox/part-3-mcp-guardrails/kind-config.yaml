kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mcp-guardrails
networking:
  # rootless docker daemon
  # ref: https://kind.sigs.k8s.io/docs/user/configuration/#api-server
  apiServerPort: 6444
nodes:
  - role: control-plane
    # kind v0.33.0 default for Kubernetes 1.37.0.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # The gateway: host 127.0.0.1:8080 -> NodePort 30080 (platform/base/gateway/parameters.yaml). A fixed host port above 1024 and below 32768, because rootless
      # Docker (pasta) drops ports in 32768-60999 and cannot bind below 1024. cloud-provider-kind is not used: its proxy container gets an ephemeral host port.
      # ref: https://kind.sigs.k8s.io/docs/user/rootless/
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
