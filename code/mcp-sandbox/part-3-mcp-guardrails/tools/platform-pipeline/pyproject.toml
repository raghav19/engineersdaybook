# The dependencies of platform-pipeline. It has its own project, so a new dependency here does not change uv.lock and the build key of the
# other functions of tools/. `uv lock` writes uv.lock from it; the build (tools.just) installs exactly what uv.lock says, with hashes.
# Not a package: nothing here is installed or published.
[project]
name = "platform-pipeline"
version = "0"
requires-python = "==3.13.*"
dependencies = ["jinja2==3.1.6", "typer==0.27.3"]

[dependency-groups]
build = ["pyinstaller==6.22.3", "ruff==0.17.0", "ty==0.0.91"]

[tool.uv]
package = false

# the same as tools/pyproject.toml: `just tools/platform-pipeline/build` runs `ruff check` and `ruff format --check` on the script
[tool.ruff]
line-length = 140

[tool.ruff.lint]
# ANN: every parameter and return value needs a type hint. ty (the build) checks that the hints are correct.
extend-select = ["ANN"]

[tool.ty.terminal]
# a warning fails the build, like an error
error-on-warning = true
