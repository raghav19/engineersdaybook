<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1160" viewBox="0 0 1100 1160" font-family="DejaVu Sans">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="1100" height="1160" fill="#ffffff"/>
<text x="20" y="27" font-size="20" font-weight="bold">Node attestation of the microVM with x509pop</text>
<rect x="20" y="50" width="1060" height="332" rx="12" fill="#f5f5f5" stroke="#666666"/>
<line x1="20" y1="76" x2="1080" y2="76" stroke="#666666"/>
<text x="60" y="68" font-size="14">k3s cluster</text>
<rect x="20" y="462" width="640" height="150" rx="12" fill="#f5f5f5" stroke="#666666"/>
<line x1="20" y1="488" x2="660" y2="488" stroke="#666666"/>
<text x="30" y="480" font-size="14">Host</text>
<rect x="700" y="462" width="380" height="310" rx="12" fill="#f5f5f5" stroke="#666666"/>
<line x1="700" y1="488" x2="1080" y2="488" stroke="#666666"/>
<text x="710" y="480" font-size="14">microVM</text>
<rect x="40" y="96" width="240" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
<text x="160.0" y="123" font-size="14" font-weight="bold" text-anchor="middle">Node CA</text>
<text x="160.0" y="144" font-size="12" text-anchor="middle">Issuer node-ca</text>
<text x="160.0" y="162" font-size="12" text-anchor="middle">made by cert-manager</text>
<rect x="400" y="96" width="240" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
<text x="520.0" y="123" font-size="14" font-weight="bold" text-anchor="middle">ConfigMap node-ca-bundle</text>
<text x="520.0" y="144" font-size="12" text-anchor="middle">written by trust-manager</text>
<text x="520.0" y="162" font-size="12" text-anchor="middle">holds the node CA certificate</text>
<rect x="780" y="96" width="240" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="900.0" y="123" font-size="14" font-weight="bold" text-anchor="middle">SPIRE server</text>
<text x="900.0" y="144" font-size="12" text-anchor="middle">trust domain mcp.local</text>
<text x="900.0" y="162" font-size="12" text-anchor="middle">NodeAttestor x509pop</text>
<rect x="40" y="256" width="240" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
<text x="160.0" y="283" font-size="14" font-weight="bold" text-anchor="middle">Certificate sandbox-node</text>
<text x="160.0" y="304" font-size="12" text-anchor="middle">key pair and 90-day certificate</text>
<text x="160.0" y="322" font-size="12" text-anchor="middle">in Secret sandbox-node-tls</text>
<rect x="350" y="256" width="300" height="96" rx="12" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="500.0" y="283" font-size="14" font-weight="bold" text-anchor="middle">ClusterStaticEntry sandbox-node</text>
<text x="500.0" y="304" font-size="12" text-anchor="middle">ID spiffe://mcp.local/node/sandbox-dev</text>
<text x="500.0" y="322" font-size="12" text-anchor="middle">selector: CN sandbox-dev</text>
<text x="500.0" y="340" font-size="12" text-anchor="middle">selector: URI SAN github-id raghav19</text>
<rect x="780" y="256" width="240" height="80" rx="12" fill="#fff2cc" stroke="#d6b656"/>
<text x="900.0" y="283" font-size="14" font-weight="bold" text-anchor="middle">Istio ingress gateway</text>
<text x="900.0" y="304" font-size="12" text-anchor="middle">TLSRoute spire, port 443</text>
<text x="900.0" y="322" font-size="12" text-anchor="middle">passes the TLS through</text>
<rect x="40" y="508" width="240" height="80" rx="12" fill="#f5f5f5" stroke="#666666"/>
<text x="160.0" y="535" font-size="14" font-weight="bold" text-anchor="middle">just msb node-cert</text>
<text x="160.0" y="556" font-size="12" text-anchor="middle">runs before the VM starts</text>
<text x="160.0" y="574" font-size="12" text-anchor="middle">copies key, certificate, bundle</text>
<rect x="400" y="508" width="240" height="80" rx="12" fill="#f5f5f5" stroke="#666666"/>
<text x="520.0" y="535" font-size="14" font-weight="bold" text-anchor="middle">~/.config/msb/node</text>
<text x="520.0" y="556" font-size="12" text-anchor="middle">node.key, node.crt, bundle.json</text>
<text x="520.0" y="574" font-size="12" text-anchor="middle">the key is mode 600</text>
<rect x="740" y="508" width="300" height="80" rx="12" fill="#d5e8d4" stroke="#82b366"/>
<text x="890.0" y="535" font-size="14" font-weight="bold" text-anchor="middle">SPIRE agent</text>
<text x="890.0" y="556" font-size="12" text-anchor="middle">runs as root, NodeAttestor x509pop</text>
<text x="890.0" y="574" font-size="12" text-anchor="middle">reads /run/sandbox/node (read-only)</text>
<rect x="740" y="668" width="300" height="80" rx="12" fill="#d5e8d4" stroke="#82b366"/>
<text x="890.0" y="695" font-size="14" font-weight="bold" text-anchor="middle">sandbox-boot</text>
<text x="890.0" y="716" font-size="12" text-anchor="middle">maps spire.localhost to the host</text>
<text x="890.0" y="734" font-size="12" text-anchor="middle">starts the agent, waits until healthy</text>
<path d="M160.0,176 L160.0,256" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="160.0" cy="216.0" r="11" fill="#ffffff"/>
<text x="160.0" y="221.0" font-size="14" text-anchor="middle">a</text>
<path d="M280,136.0 L400,136.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="340.0" cy="136.0" r="11" fill="#ffffff"/>
<text x="340.0" y="141.0" font-size="14" text-anchor="middle">b</text>
<path d="M640,136.0 L780,136.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="710.0" cy="136.0" r="11" fill="#ffffff"/>
<text x="710.0" y="141.0" font-size="14" text-anchor="middle">c</text>
<path d="M650,304.0 L698.0,304.0 Q710,304 710.0,292.0 L710.0,168.0 Q710,156 722.0,156.0 L780,156.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="710.0" cy="230.0" r="11" fill="#ffffff"/>
<text x="710.0" y="235.0" font-size="14" text-anchor="middle">d</text>
<path d="M160.0,508 L160.0,336" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="160.0" cy="422.0" r="11" fill="#ffffff"/>
<text x="160.0" y="427.0" font-size="14" text-anchor="middle">1</text>
<path d="M280,548.0 L400,548.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="340.0" cy="548.0" r="11" fill="#ffffff"/>
<text x="340.0" y="553.0" font-size="14" text-anchor="middle">2</text>
<path d="M640,548.0 L740,548.0" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="690.0" cy="548.0" r="11" fill="#ffffff"/>
<text x="690.0" y="553.0" font-size="14" text-anchor="middle">3</text>
<path d="M890.0,668 L890.0,588" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="890.0" cy="628.0" r="11" fill="#ffffff"/>
<text x="890.0" y="633.0" font-size="14" text-anchor="middle">4</text>
<path d="M899.99,508 L900.0,336" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<circle cx="899.995" cy="422.0" r="11" fill="#ffffff"/>
<text x="899.995" y="427.0" font-size="14" text-anchor="middle">5</text>
<path d="M900.0,256 L900.0,176" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
<circle cx="900.0" cy="216.0" r="11" fill="#ffffff"/>
<text x="900.0" y="221.0" font-size="14" text-anchor="middle">6</text>
<rect x="20" y="800" width="1060" height="340" rx="12" fill="#ffffff" stroke="#666666"/>
<text x="32" y="824" font-size="14" font-weight="bold">Flow</text>
<text x="40" y="852" font-size="13" font-weight="bold">Prerequisites, once (Flux, from git)</text>
<text x="40" y="884" font-size="12" font-weight="bold">a</text>
<text x="58" y="884" font-size="12">The node CA signs the Certificate</text>
<text x="58" y="900" font-size="12">sandbox-node. cert-manager makes its</text>
<text x="58" y="916" font-size="12">key pair and its 90-day certificate.</text>
<text x="40" y="940" font-size="12" font-weight="bold">b</text>
<text x="58" y="940" font-size="12">trust-manager copies the CA certificate</text>
<text x="58" y="956" font-size="12">into the ConfigMap node-ca-bundle.</text>
<text x="40" y="980" font-size="12" font-weight="bold">c</text>
<text x="58" y="980" font-size="12">The SPIRE server reads the bundle. It</text>
<text x="58" y="996" font-size="12">trusts only certificates that the node</text>
<text x="58" y="1012" font-size="12">CA signed.</text>
<text x="40" y="1036" font-size="12" font-weight="bold">d</text>
<text x="58" y="1036" font-size="12">The controller manager registers the</text>
<text x="58" y="1052" font-size="12">node entry in the server. A node with</text>
<text x="58" y="1068" font-size="12">both selectors gets this ID.</text>
<text x="385" y="852" font-size="13" font-weight="bold">Each run (just msb run)</text>
<text x="385" y="884" font-size="12" font-weight="bold">1</text>
<text x="403" y="884" font-size="12">node-cert waits until the Certificate</text>
<text x="403" y="900" font-size="12">is ready. It reads the Secret and the</text>
<text x="403" y="916" font-size="12">trust bundle.</text>
<text x="385" y="940" font-size="12" font-weight="bold">2</text>
<text x="403" y="940" font-size="12">It writes key, certificate and bundle</text>
<text x="403" y="956" font-size="12">to the host folder (key mode 600).</text>
<text x="385" y="980" font-size="12" font-weight="bold">3</text>
<text x="403" y="980" font-size="12">The VM mounts the folder read-only.</text>
<text x="385" y="1004" font-size="12" font-weight="bold">4</text>
<text x="403" y="1004" font-size="12">sandbox-boot maps spire.localhost to</text>
<text x="403" y="1020" font-size="12">the host and starts the agent.</text>
<text x="385" y="1044" font-size="12" font-weight="bold">5</text>
<text x="403" y="1044" font-size="12">The agent calls spire.localhost on port</text>
<text x="403" y="1060" font-size="12">443. The gateway reads only the name.</text>
<text x="385" y="1084" font-size="12" font-weight="bold">6</text>
<text x="403" y="1084" font-size="12">The gateway passes the TLS through. The</text>
<text x="403" y="1100" font-size="12">server sends a nonce, checks the</text>
<text x="403" y="1116" font-size="12">signed answer and issues the SVID.</text>
<text x="730" y="852" font-size="13" font-weight="bold">About every 2 hours, and the names</text>
<text x="730" y="884" font-size="12">The agent SVID lives 4 hours. About</text>
<text x="730" y="900" font-size="12">half-way, the agent rotates it. It</text>
<text x="730" y="916" font-size="12">attests again (steps 5 and 6) and reads</text>
<text x="730" y="932" font-size="12">the key and the certificate again.</text>
<text x="730" y="956" font-size="12">mcp.local is the trust domain. Every ID</text>
<text x="730" y="972" font-size="12">starts with spiffe://mcp.local.</text>
<text x="730" y="996" font-size="12">SVID: the short-lived certificate that</text>
<text x="730" y="1012" font-size="12">SPIRE issues to the agent.</text>
<text x="730" y="1036" font-size="12">Selector: a fact that the server learns</text>
<text x="730" y="1052" font-size="12">about the node (the CN, the login).</text>
</svg>
