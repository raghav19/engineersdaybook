apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One cluster = one profile + this cluster's values. Switch guardrails by changing the profile line.
resources:
  - ../../profiles/baseline
components:
  - ../../platform/components/values-wiring
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mcp-values
    namespace: agentgateway-system
    behavior: merge
    envs:
      - values.env
