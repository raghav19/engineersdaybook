# The identity of the agent in the msb sandbox VM, and its rights. The host applies this file: `just clusters/k3s/sandbox-agent`.
# Do not move it into sync/. The agent opens pull requests that change that folder, so Flux must not apply its own rights.
# Why each rule is here and what it leaves out: docs/research/sandbox-least-privilege-kubeconfig.md
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-agent
  namespace: sandbox-agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-agent-reader
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - endpoints
      - configmaps
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - serviceaccounts
      - resourcequotas
      - limitranges
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories, gitrepositories, helmrepositories]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [fluxcd.controlplane.io]
    resources: [fluxinstances, fluxreports]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clustersecretstores]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers, clusterissuers]
    verbs: [get, list, watch]
  - apiGroups: [spire.spiffe.io]
    resources: [clusterspiffeids]
    verbs: [get, list, watch]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaybackends, agentgatewaypolicies, agentgatewayparameters]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-agent-reader
subjects:
  - kind: ServiceAccount
    name: sandbox-agent
    namespace: sandbox-agent
---
# The scratch namespace for quick tests. Keep no Secret and no other ServiceAccount in it: a Pod there can run as any ServiceAccount of the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-dev
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-agent-deployer
  namespace: sandbox-dev
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-agent-deployer
  namespace: sandbox-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-agent-deployer
subjects:
  - kind: ServiceAccount
    name: sandbox-agent
    namespace: sandbox-agent
