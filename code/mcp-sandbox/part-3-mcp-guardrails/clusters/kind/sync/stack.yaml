# The stack of cluster `kind`: every artifact that runs here, in one place.
# Per artifact, one pair:
#   OCIRepository  the pin: which pushed artifact of this cluster runs. Rollout and rollback are an edit of ref, in Git.
#   Kustomization  how Flux applies that artifact (order, health).
# Both are named after the component folder; `just <folder>/push` pushes it and `just <folder>/pin` writes the pin. `secrets` reads Git,
# not an artifact, so it has no pin and no folder.
#
# ref.tag `unpinned` means no artifact is pushed yet: its Kustomization stays not Ready. `just <folder>/pin` writes the tag (the commit) and the digest.
# A baseline run is this file without the ext-mcp-isolation and policy entries (authn-jwt, rate-limit, tool-rbac, ext-mcp-checks, mcp-mtls).
# Flux never reverts a failed artifact by itself: put the older pin back (git revert).
#
#   gateway-api ──► agentgateway ──┬──► secrets ──┐
#                                  │              ▼
#                                  └────────► mcp-servers ──┬──► routes ──┬──► authn-jwt
#                                                           │             └──► rate-limit
#                                                           ├──► tool-rbac
#   ext-mcp ──┬───────────────────────────────────────────►└──► ext-mcp-checks
#             └──► ext-mcp-isolation
#
#   spire ──► istio ──┬──► ext-mcp       (ext-mcp also waits for spire: its sidecar and its SPIRE identity)
#                     ├──► istio-ingress (the L4 gateway: its pod is injected only once istiod's webhook serves; also waits for spire)
#                     └──► mcp-mtls      (STRICT mTLS of namespace mcp-guardrails; also waits for ext-mcp)
#
#   spire is the CA of trust domain mcp.local; istio takes its CA from it (sidecar mode only, no ambient).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/gateway-api
  secretRef:
    name: ghcr-pull
  ref:
    tag: 5f7e9eee881c
    digest: sha256:c1bd1df5838e4c33c9126c892a5ce43ef3f1a57db7fe99ecfc04235246d5de0a
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: false
  wait: true # CRDs report Established. A removed CRD must not delete every custom resource of its kind.
  path: ./
  sourceRef: {kind: OCIRepository, name: gateway-api}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/agentgateway
  secretRef:
    name: ghcr-pull
  ref:
    tag: 5f7e9eee881c
    digest: sha256:cd4e5e01c29dcd59ef23b188ec0852ff675e63c24f6714753cab68d328d77328
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the artifact holds the rendered chart: the controller Deployment must roll out and the CRDs report Established.
  path: ./
  sourceRef: {kind: OCIRepository, name: agentgateway}
  dependsOn:
    - name: gateway-api
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true
  # The upstream credential, from Git (age ciphertext). The folder has no manifest until you encrypt one: see secrets/README.md.
  # Until then this Kustomization stays not Ready, and mcp-servers waits.
  path: ./code/mcp-sandbox/part-3-mcp-guardrails/clusters/kind/sync/secrets
  sourceRef: {kind: GitRepository, name: flux-system}
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  dependsOn:
    - name: agentgateway # the namespace of the Secret
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/mcp-servers
  secretRef:
    name: ghcr-pull
  ref:
    tag: 5f7e9eee881c
    digest: sha256:4bea923fe4daa63421bc699a7dee8f5b71b4de4992fb91ba94f6bd5fc97d091b
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true # the Backend refers to the Secret github-upstream by name, so the secret first.
  path: ./
  sourceRef: {kind: OCIRepository, name: mcp-servers}
  dependsOn:
    - name: agentgateway
    - name: secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: routes
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/routes
  secretRef:
    name: ghcr-pull
  ref:
    tag: 5f7e9eee881c
    digest: sha256:4c5465a706faaa0e4d79004373a6b60f1c1a4db2b686c1552e70d1e4b5097028
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the HTTPRoute refers to the Backend registered by mcp-servers.
  path: ./
  sourceRef: {kind: OCIRepository, name: routes}
  dependsOn:
    - name: agentgateway
    - name: mcp-servers
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: status.conditions.exists(c, c.type == 'Programmed' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Programmed' && c.status == 'False')
---
