# The stack of cluster `kind`: every artifact that runs here, in one place.
# Per artifact, one pair:
#   OCIRepository  the pin: which pushed artifact of this cluster runs. Rollout and rollback are an edit of ref, in Git.
#   Kustomization  how Flux applies that artifact (order, health).
# Both are named after the component folder; `just <folder>/push` pushes it and `just <folder>/pin` writes the pin. `secrets` reads Git,
# not an artifact, so it has no pin and no folder.
#
# ref.tag `unpinned` means no artifact is pushed yet: its Kustomization stays not Ready. `just <folder>/pin` writes the tag (the commit) and the digest.
# A baseline run is this file without the ext-mcp-isolation and policy entries (authn-jwt, rate-limit, tool-rbac, ext-mcp-checks).
# Flux never reverts a failed artifact by itself: put the older pin back (git revert).
#
#   gateway-api ──► agentgateway ──┬──► secrets ──┐
#                                  │              ▼
#                                  └────────► mcp-servers ──┬──► routes ──┬──► authn-jwt
#                                                           │             └──► rate-limit
#                                                           ├──► tool-rbac
#   ext-mcp ──┬───────────────────────────────────────────►└──► ext-mcp-checks
#             └──► ext-mcp-isolation
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/gateway-api
  secretRef:
    name: ghcr-pull
  ref:
    tag: 9b72349be3c4
    digest: sha256:5bc59c1d9b349919ef88f3af28859be29b2d75d1147cd50844809c1c96a7e5ca
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: false
  wait: true # CRDs report Established. A removed CRD must not delete every custom resource of its kind.
  path: ./
  sourceRef: {kind: OCIRepository, name: gateway-api}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/agentgateway
  secretRef:
    name: ghcr-pull
  ref:
    tag: 2867ffb40bc1
    digest: sha256:2da42f99e574c0cdf1c13e741bb5c89f4948e8fa9bc4b717cf0f62229ad35d39
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the artifact holds the rendered chart: the controller Deployment must roll out and the CRDs report Established.
  path: ./
  sourceRef: {kind: OCIRepository, name: agentgateway}
  dependsOn:
    - name: gateway-api
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true
  # The upstream credential, from Git (age ciphertext). The folder has no manifest until you encrypt one: see secrets/README.md.
  # Until then this Kustomization stays not Ready, and mcp-servers waits.
  path: ./code/mcp-sandbox/part-3-mcp-guardrails/clusters/kind/sync/secrets
  sourceRef: {kind: GitRepository, name: flux-system}
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  dependsOn:
    - name: agentgateway # the namespace of the Secret
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/mcp-servers
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mcp-servers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true # the Backend refers to the Secret github-upstream by name, so the secret first.
  path: ./
  sourceRef: {kind: OCIRepository, name: mcp-servers}
  dependsOn:
    - name: agentgateway
    - name: secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: routes
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/routes
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the HTTPRoute refers to the Backend registered by mcp-servers.
  path: ./
  sourceRef: {kind: OCIRepository, name: routes}
  dependsOn:
    - name: agentgateway
    - name: mcp-servers
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: status.conditions.exists(c, c.type == 'Programmed' && c.status == 'True')
      failed: status.conditions.exists(c, c.type == 'Programmed' && c.status == 'False')
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ext-mcp
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/ext-mcp
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ext-mcp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true # the ext-mcp Deployment rolls out. Its namespace travels in this artifact, so it waits for nothing.
  path: ./
  sourceRef: {kind: OCIRepository, name: ext-mcp}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ext-mcp-isolation
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/ext-mcp-isolation
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ext-mcp-isolation
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  wait: true # MCP04, MCP09: only the gateway may call ext-mcp. The namespace comes from ext-mcp.
  path: ./
  sourceRef: {kind: OCIRepository, name: ext-mcp-isolation}
  dependsOn:
    - name: ext-mcp
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: authn-jwt
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/authn-jwt
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authn-jwt
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true # MCP01, MCP07. Targets the HTTPRoute.
  path: ./
  sourceRef: {kind: OCIRepository, name: authn-jwt}
  dependsOn:
    - name: routes
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rate-limit
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/rate-limit
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rate-limit
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true # MCP02, MCP10. Targets the HTTPRoute.
  path: ./
  sourceRef: {kind: OCIRepository, name: rate-limit}
  dependsOn:
    - name: routes
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tool-rbac
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/tool-rbac
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tool-rbac
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true # MCP02. Targets the Backend.
  path: ./
  sourceRef: {kind: OCIRepository, name: tool-rbac}
  dependsOn:
    - name: mcp-servers
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ext-mcp-checks
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/raghav19/mcp-guardrails/ext-mcp-checks
  secretRef:
    name: ghcr-pull
  ref:
    tag: unpinned
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ext-mcp-checks
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true # MCP03, 05, 06, 10. failureMode is FailClosed: without a running ext-mcp every tool call fails, so ext-mcp first.
  path: ./
  sourceRef: {kind: OCIRepository, name: ext-mcp-checks}
  dependsOn:
    - name: mcp-servers
    - name: ext-mcp
