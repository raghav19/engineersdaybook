# Which folders of config/ apply to this cluster: cloud/<cloud>[/<env>[/<region>]]. Every *.yaml of config/ and of each folder on this
# path is read, and the one further down wins. Later: cloud/aws/dev/us-east-1
placement: cloud/local
# The folder that Flux reconciles for this cluster: sync/<sync>/. Its full name is the placement and the cluster: local-kind now, and later for example
# aws-dev-us-east-1. It holds infra-stack.yaml and app-stack.yaml.
sync: local-kind
