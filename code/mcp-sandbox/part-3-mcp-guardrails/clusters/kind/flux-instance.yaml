# Flux itself: the version, and the sync of the folder sync/local-kind from Git. This file is NOT in the folder that Flux syncs: Git cannot
# remove it, and deleting this object uninstalls Flux (the workloads stay). Only `just clusters/kind/up` applies it (host), once and after each change.
# A Flux upgrade is an edit of distribution.version, then `just clusters/kind/up`.
# The prune annotation keeps a sync that once held this object from removing it. Flux never prunes an object that has it.
# The Flux Operator reads this object and installs the controllers. The operator chart version is a variable in clusters/kind/justfile.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: "2.9.6"
    registry: ghcr.io/fluxcd
  # source-controller reads Git and the artifacts, kustomize-controller applies the chains, helm-controller installs the two agentgateway charts.
  # No image automation. Add notification-controller when you want alerts on a failed chain.
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  sync:
    kind: GitRepository
    url: https://github.com/raghav19/engineersdaybook.git
    ref: refs/heads/main
    path: code/mcp-sandbox/part-3-mcp-guardrails/sync/local-kind
