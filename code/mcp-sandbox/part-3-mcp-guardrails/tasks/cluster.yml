version: '3'

# The kind cluster, and the one hand-over to Flux. Included by ../Taskfile.yml with flatten; vars CLUSTER, KIND_CLUSTER, KUBE_CONTEXT come from there.
#
# cluster:up and cluster:credentials are the only tasks that change a cluster. Both run on the host and are safe to run again.
#   cluster:up           kind, the Flux Operator, the FluxInstance. No credential, so it always comes up. Once the FluxInstance is applied,
#                        Flux reads clusters/<CLUSTER>/sync from Git and the chain artifacts from the registry. Nothing else applies to the cluster.
#   cluster:credentials  the two Secrets Flux cannot get from Git: sops-age and ghcr-pull. Until they exist the chains wait, and Flux retries.
#
# cluster:credentials needs no environment variable. It decrypts the ghcr.io token of .sbx/secrets.json (the one sandbox:login uses) inside the
# one command that creates ghcr-pull, with your personal sops key (~/.config/sops/age/keys.txt, or SOPS_AGE_KEY_FILE), and reads one file,
# the private age key of this cluster (created once, never in Git): AGE_KEY_FILE
# The token reads the private chain artifacts. A classic PAT cannot be limited to one package: if it also has write:packages, the cluster
# holds that right. Use a read:packages token of its own when that matters: change GHCR_TOKEN_FILE and the key in the task.

vars:
  GHCR_USER: '{{.GHCR_USER | default "raghav19"}}'
  GHCR_TOKEN_FILE: '{{.ROOT_DIR}}/../../../.sbx/secrets.json'
  # The chart version equals the Flux Operator release. Check it with `helm show chart <chart> --version <v>` when you change it.
  FLUX_OPERATOR_CHART: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  FLUX_OPERATOR_VERSION: 0.61.0
  # helm waits 5 minutes by default. The node pulls the operator image from ghcr.io on first start, which can take longer than that.
  FLUX_OPERATOR_TIMEOUT: '{{.FLUX_OPERATOR_TIMEOUT | default "10m"}}'
  AGE_KEY_FILE: '{{.AGE_KEY_FILE | default (printf "%s/.config/sops/age/mcp-guardrails-%s.agekey" (env "HOME") .CLUSTER)}}'

tasks:
  cluster:up:
    desc: Create the kind cluster, install the Flux Operator, and apply the FluxInstance. Needs no credential. Flux does the rest
    deps:
      - task: tools:check
        vars: {TOOLS: "kind kubectl helm"}
    cmds:
      - kind get clusters | grep -qx {{.KIND_CLUSTER}} || kind create cluster --config {{.ROOT_DIR}}/clusters/{{.CLUSTER}}/kind-config.yaml
      - task: cluster:devices
      # kind returns when the control plane is up. The operator needs Ready nodes and kube-proxy (ClusterIP of the API) on its node.
      - kubectl --context {{.KUBE_CONTEXT}} wait --for=condition=Ready node --all --timeout=5m
      - kubectl --context {{.KUBE_CONTEXT}} -n kube-system rollout status daemonset/kube-proxy --timeout=5m
      - kubectl --context {{.KUBE_CONTEXT}} create namespace flux-system --dry-run=client -o yaml | kubectl --context {{.KUBE_CONTEXT}} apply -f -
      - >-
        helm upgrade --install flux-operator {{.FLUX_OPERATOR_CHART}} --version {{.FLUX_OPERATOR_VERSION}}
        --kube-context {{.KUBE_CONTEXT}} --namespace flux-system --wait --timeout {{.FLUX_OPERATOR_TIMEOUT}}
      - kubectl --context {{.KUBE_CONTEXT}} apply -f {{.ROOT_DIR}}/clusters/{{.CLUSTER}}/sync/flux-instance.yaml
      - 'echo "Flux is installed. It waits for the credentials: task cluster:credentials. Watch it: kubectl --context {{.KUBE_CONTEXT}} -n flux-system get kustomizations"'

  cluster:devices:
    desc: Remove the device nodes a kind node still lists but the host no longer has (an unplugged USB device). Run by cluster:up, safe to run again
    deps:
      - task: tools:check
        vars: {TOOLS: "kind docker kubectl"}
    cmds:
      - |
        # kube-proxy is privileged, so it gets every device of its node's /dev, a snapshot from when the node started. A USB device unplugged
        # since then leaves an entry runc cannot mount ("mount src=/dev/bus/usb/...: no such file or directory"). Remove those entries.
        # The paths are what a USB device creates: raw USB, input/hidraw, serial, audio, video, printers, storage.
        fixed=
        for n in $(kind get nodes --name {{.KIND_CLUSTER}}); do
          for d in $(docker exec "$n" sh -c 'find /dev/bus /dev/input /dev/hidraw* /dev/ttyUSB* /dev/ttyACM* /dev/snd /dev/video* /dev/usb* /dev/sd* \( -type c -o -type b \) 2>/dev/null'); do
            [ -e "$d" ] && continue
            echo "removing $d from $n"
            docker exec "$n" sh -c "umount '$d' 2>/dev/null; rm '$d'" || { echo "cannot remove it: task cluster:down && task cluster:up" >&2; exit 1; }
            fixed=1
          done
        done
        # the kubelet retries a failed container only after a back-off of up to 5 minutes
        [ -z "$fixed" ] || kubectl --context {{.KUBE_CONTEXT}} -n kube-system delete pod -l k8s-app=kube-proxy

  cluster:credentials:
    desc: Create the two Secrets Flux needs, sops-age (decrypt Git) and ghcr-pull (private artifacts). Run after cluster:up, safe to run again
    deps:
      - task: tools:check
        vars: {TOOLS: "kubectl sops"}
    preconditions:
      - sh: '[ -f "{{.AGE_KEY_FILE}}" ]'
        msg: "No age key at {{.AGE_KEY_FILE}}. Create one: age-keygen -o {{.AGE_KEY_FILE}} (see README, Secrets)"
      - sh: "sops -d --extract '[\"ghcr.io\"]' {{.GHCR_TOKEN_FILE}} >/dev/null 2>&1"
        msg: "Cannot decrypt the ghcr.io token in {{.GHCR_TOKEN_FILE}}. sops needs your personal age key: ~/.config/sops/age/keys.txt, or SOPS_AGE_KEY_FILE"
    cmds:
      - >-
        kubectl --context {{.KUBE_CONTEXT}} -n flux-system create secret generic sops-age
        --from-file=age.agekey={{.AGE_KEY_FILE}} --dry-run=client -o yaml | kubectl --context {{.KUBE_CONTEXT}} apply -f -
      - >-
        kubectl --context {{.KUBE_CONTEXT}} -n flux-system create secret docker-registry ghcr-pull
        --docker-server=ghcr.io --docker-username={{.GHCR_USER}}
        --docker-password="$(sops -d --extract '["ghcr.io"]' {{.GHCR_TOKEN_FILE}})"
        --dry-run=client -o yaml | kubectl --context {{.KUBE_CONTEXT}} apply -f -

  cluster:down:
    desc: Delete the kind cluster
    deps:
      - task: tools:check
        vars: {TOOLS: "kind"}
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}
