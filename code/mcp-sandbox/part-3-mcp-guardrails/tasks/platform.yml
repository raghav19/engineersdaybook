version: '3'

# The CRDs and the gateway, applied to the cluster. Included by ../Taskfile.yml with flatten; var PROFILE comes from there.

tasks:
  crds:apply:
    desc: Install the CRDs on their own (Gateway API experimental + agentgateway), server-side
    deps: [context:check]
    cmds:
      - kustomize build --enable-helm {{.ROOT_DIR}}/crds | kubectl apply --server-side --force-conflicts -f -
      - kubectl wait --for=condition=Established crd --all --timeout=60s

  gateway:diff:
    desc: Server-side dry run of the platform manifests (profile {{.PROFILE}})
    deps: [context:check]
    cmds:
      - kustomize build --enable-helm --enable-alpha-plugins --enable-exec {{.ROOT_DIR}}/profiles/{{.PROFILE}} | kubectl apply --server-side --dry-run=server -f -

  gateway:apply:
    desc: Build the platform manifests (profile {{.PROFILE}}) and apply them
    deps: [context:check]
    cmds:
      # rendered output contains the upstream credential in plaintext: pipe only, never redirect to a file
      - kustomize build --enable-helm --enable-alpha-plugins --enable-exec {{.ROOT_DIR}}/profiles/{{.PROFILE}} | kubectl apply --server-side -f -
      - kubectl -n agentgateway-system rollout status deploy --timeout=120s
