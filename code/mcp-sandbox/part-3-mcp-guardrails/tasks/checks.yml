version: '3'

# Prechecks. Internal: the tasks that need them list them under deps, so they stop with a message that says what to run instead of a raw kubectl or
# kind error. Included by ../Taskfile.yml with flatten; vars (KUBE_CONTEXT, ...) come from there.

tasks:
  tools:check:
    internal: true
    desc: Stop with a message when a tool in TOOLS (space separated) is not installed
    cmds:
      - |
        missing=""
        for t in {{.TOOLS}}; do command -v "$t" >/dev/null || missing="$missing $t"; done
        if [ -n "$missing" ]; then echo "Missing tools:$missing. Run: mise install" >&2; exit 1; fi

  context:check:
    internal: true
    desc: Refuse to touch any cluster but the one this folder names
    preconditions:
      - sh: '[ "$(kubectl config current-context)" = "{{.KUBE_CONTEXT}}" ]'
        msg: "kubectl context is not {{.KUBE_CONTEXT}}; refusing to touch the wrong cluster"
