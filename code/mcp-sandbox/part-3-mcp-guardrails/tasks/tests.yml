version: '3'

# The attack cases, run against the gateway. Included by ../Taskfile.yml with flatten; vars PROFILE (from the cluster stack), GATEWAY_URL come from there.

tasks:
  tests:run:
    desc: Run every tests/attacks case against the gateway and print one line per OWASP id (the profile of the cluster stack)
    deps: [context:check]
    preconditions:
      - sh: '[ "$(curl -s -o /dev/null -m 3 -w "%{http_code}" {{.GATEWAY_URL}})" != 000 ]'
        msg: "Nothing answers on {{.GATEWAY_URL}}. Run: task cluster:up and wait for Flux to apply the chains (the cluster needs the port mapping in clusters/<name>/kind-config.yaml)"
    cmds:
      - |
        for t in {{.ROOT_DIR}}/tests/attacks/MCP*/; do
          bash "$t/run.sh" "{{.GATEWAY_URL}}" "{{.PROFILE}}"
        done
