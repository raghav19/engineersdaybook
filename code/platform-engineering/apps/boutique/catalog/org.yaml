# The owner of Online Boutique and the first user.
# The user entity matches a GitHub login later. The annotation github.com/user-id holds the node ID of the GitHub user (not the number).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: boutique-team
  description: The team that owns Online Boutique.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: raghav19
  annotations:
    github.com/user-id: MDQ6VXNlcjIxMDc1MDU5
spec:
  profile:
    displayName: Raghavender Nagarajan
  memberOf: [boutique-team]
