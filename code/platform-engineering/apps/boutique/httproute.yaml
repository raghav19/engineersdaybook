# The app brings its own route. The platform team owns the Gateway (infrastructure/gateway), the app team owns this route.
# The Gateway listener `web` allows routes from all namespaces (namespacePolicy.from: All in traefik-config.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: boutique
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
