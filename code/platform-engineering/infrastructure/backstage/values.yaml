# Values for the official Backstage Helm chart (oci://ghcr.io/backstage/charts/backstage, version 2.10.2).
# The chart runs a demo image: what `npx @backstage/create-app` makes. It has no GitHub login and no custom plugins.
backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    # Version 1.55.2. The digest pins it, because `latest` moves.
    tag: "1.55.2"
    digest: sha256:68f2025a3f2774e04d58a65a948ccd04a93ddab7b7977be850e9df6d3beae6e3

  # One pod at a time, because the plugins run database migrations at start.
  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  extraEnvVars:
    - name: POSTGRES_HOST
      value: postgres.backstage.svc.cluster.local
    - name: POSTGRES_PORT
      value: "5432"
  # POSTGRES_USER and POSTGRES_PASSWORD come from the Secret `postgres`.
  extraEnvVarsSecrets:
    - postgres

  appConfig:
    # No HTTPRoute yet. Open Backstage with `kubectl port-forward` on port 7007.
    app:
      baseUrl: http://localhost:7007
    backend:
      baseUrl: http://localhost:7007
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
    auth:
      providers:
        # The demo image has only the guest login. Guest is off outside development unless this flag is set.
        guest:
          dangerouslyAllowOutsideDevelopment: true
    catalog:
      locations:
        - type: url
          target: https://github.com/raghav19/engineersdaybook/blob/main/code/platform-engineering/apps/boutique/catalog/catalog-info.yaml
        - type: url
          target: https://github.com/raghav19/engineersdaybook/blob/main/code/platform-engineering/apps/boutique/catalog/org.yaml
          rules:
            - allow: [User, Group]
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            # Backstage runs in this cluster. It uses the token of its own ServiceAccount.
            - name: k3s
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

serviceAccount:
  create: true
  name: backstage
