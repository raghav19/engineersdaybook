<line x1="40" y1="368" x2="1060" y2="368" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="52" y="358.0" font-size="14" fill="#000">Host SPIRE agent</text>
<rect x="60" y="384" width="300" height="64" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="210.0" y="421.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Delegated Identity API</text>
<rect x="390" y="384" width="300" height="64" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="540.0" y="421.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">msbvm plugin</text>
<rect x="720" y="384" width="300" height="64" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="870.0" y="421.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">unix attestor</text>
<rect x="60" y="548" width="300" height="64" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="210.0" y="585.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Delegate</text>
<rect x="400" y="548" width="330" height="116" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<line x1="400" y1="578" x2="730" y2="578" stroke="#d6b656" stroke-width="1.5"/>
<text x="412" y="568.0" font-size="14" fill="#000">VMM: msb machine</text>
<rect x="420" y="594" width="290" height="50" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="565.0" y="624.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">microVM</text>
<rect x="800" y="548" width="260" height="64" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="930.0" y="585.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">msb.db</text>
<path d="M510.0,144.0 L720.0,144.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M890.0,338.0 L890.0,192.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M135.0,548.0 L135.0,448.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M285.0,448.0 L285.0,548.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M480.0,448.0 L480.0,548.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M645.0,448.0 L645.0,488.0 Q645.0,498.0 655.0,498.0 L920.0,498.0 Q930.0,498.0 930.0,508.0 L930.0,548.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<circle cx="615.0" cy="144.0" r="13" fill="#ffffff"/>
<text x="615.0" y="149.0" font-size="15" text-anchor="middle" fill="#000">a</text>
<circle cx="890.0" cy="265.0" r="13" fill="#ffffff"/>
<text x="890.0" y="270.0" font-size="15" text-anchor="middle" fill="#000">b</text>
<circle cx="135.0" cy="498.0" r="13" fill="#ffffff"/>
<text x="135.0" y="503.0" font-size="15" text-anchor="middle" fill="#000">1</text>
<circle cx="285.0" cy="498.0" r="13" fill="#ffffff"/>
<text x="285.0" y="503.0" font-size="15" text-anchor="middle" fill="#000">4</text>
<circle cx="480.0" cy="498.0" r="13" fill="#ffffff"/>
<text x="480.0" y="503.0" font-size="15" text-anchor="middle" fill="#000">2</text>
<circle cx="787.5" cy="498.0" r="13" fill="#ffffff"/>
<text x="787.5" y="503.0" font-size="15" text-anchor="middle" fill="#000">3</text>
<rect x="20" y="728" width="1060" height="250" rx="14" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text x="40" y="758" font-size="15" font-weight="bold" fill="#000">Flow</text>
<text x="40" y="790" font-size="14" font-weight="bold" fill="#000">Prerequisites, once</text>
<text x="40" y="824" font-size="12" font-weight="bold" fill="#000">a</text>
<text x="64" y="824" font-size="12" fill="#000">Flux applies the entries from git.</text>
<text x="64" y="841" font-size="12" fill="#000">The controller manager copies them to</text>
<text x="64" y="858" font-size="12" fill="#000">the server.</text>
<text x="40" y="884" font-size="12" font-weight="bold" fill="#000">b</text>
<text x="64" y="884" font-size="12" fill="#000">The host agent attests to the server.</text>
<text x="64" y="901" font-size="12" fill="#000">The server sends the entries of the</text>
<text x="64" y="918" font-size="12" fill="#000">node.</text>
<text x="385" y="790" font-size="14" font-weight="bold" fill="#000">Each time a VM needs its SVID</text>
<text x="385" y="824" font-size="12" font-weight="bold" fill="#000">1</text>
<text x="409" y="824" font-size="12" fill="#000">The delegate sends the pid of the VMM</text>
<text x="409" y="841" font-size="12" fill="#000">to the agent.</text>
<text x="385" y="867" font-size="12" font-weight="bold" fill="#000">2</text>
<text x="409" y="867" font-size="12" fill="#000">The msbvm plugin reads the VMM.</text>
<text x="385" y="893" font-size="12" font-weight="bold" fill="#000">3</text>
<text x="409" y="893" font-size="12" fill="#000">The plugin checks the run row in</text>
<text x="409" y="910" font-size="12" fill="#000">msb.db.</text>
<text x="385" y="936" font-size="12" font-weight="bold" fill="#000">4</text>
<text x="409" y="936" font-size="12" fill="#000">The agent sends the SVID and the key</text>
<text x="409" y="953" font-size="12" fill="#000">to the delegate.</text>
<text x="730" y="790" font-size="14" font-weight="bold" fill="#000">The ID</text>
<text x="730" y="824" font-size="12" fill="#000">spiffe://mcp.local/node/sandbox-</text>
<text x="730" y="841" font-size="12" fill="#000">dev/user/&lt;user&gt;/vm/&lt;vm&gt;</text>
</svg>
