<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1130" viewBox="0 0 1100 1130" font-family="DejaVu Sans, Verdana, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
<rect width="1100" height="1130" fill="#ffffff"/>
<text x="20" y="28" font-size="22" font-weight="bold" fill="#000">Agent workload identity of the microVM</text>
<rect x="20" y="50" width="1060" height="162" rx="14" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<line x1="20" y1="76" x2="1080" y2="76" stroke="#666666" stroke-width="1.5"/>
<text x="32" y="68.0" font-size="14" fill="#000">k3s cluster</text>
<rect x="40" y="96" width="470" height="96" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="275.0" y="119.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Registration entries</text>
<text x="275.0" y="139.0" font-size="12" text-anchor="middle" fill="#000">node entry sandbox-dev</text>
<text x="275.0" y="159.0" font-size="12" text-anchor="middle" fill="#000">delegate entry</text>
<text x="275.0" y="179.0" font-size="12" text-anchor="middle" fill="#000">VM entry: msbvm:name, unix:uid</text>
<rect x="720" y="96" width="340" height="96" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="890.0" y="129.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">SPIRE server</text>
<text x="890.0" y="149.0" font-size="12" text-anchor="middle" fill="#000">trust domain mcp.local</text>
<text x="890.0" y="169.0" font-size="12" text-anchor="middle" fill="#000">NodeAttestor x509pop</text>
<rect x="20" y="292" width="1060" height="446" rx="14" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<line x1="20" y1="318" x2="1080" y2="318" stroke="#666666" stroke-width="1.5"/>
<text x="32" y="310.0" font-size="14" fill="#000">Host</text>
<rect x="40" y="338" width="1020" height="156" rx="14" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<line x1="40" y1="368" x2="1060" y2="368" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="52" y="358.0" font-size="14" fill="#000">Host SPIRE agent</text>
<rect x="60" y="384" width="300" height="90" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="210.0" y="414.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Delegated Identity API</text>
<text x="210.0" y="434.0" font-size="12" text-anchor="middle" fill="#000">on admin.sock</text>
<text x="210.0" y="454.0" font-size="12" text-anchor="middle" fill="#000">checks authorized_delegates</text>
<rect x="390" y="384" width="300" height="90" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="540.0" y="414.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">msbvm plugin</text>
<text x="540.0" y="434.0" font-size="12" text-anchor="middle" fill="#000">pid to VM name and sandbox ID</text>
<text x="540.0" y="454.0" font-size="12" text-anchor="middle" fill="#000">checks the command line and the run row</text>
<rect x="720" y="384" width="300" height="90" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="870.0" y="424.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">unix attestor</text>
<text x="870.0" y="444.0" font-size="12" text-anchor="middle" fill="#000">pid to uid</text>
<rect x="60" y="574" width="300" height="90" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="210.0" y="604.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Delegate</text>
<text x="210.0" y="624.0" font-size="12" text-anchor="middle" fill="#000">sends the pid of the VMM</text>
<text x="210.0" y="644.0" font-size="12" text-anchor="middle" fill="#000">holds the SVID and the key</text>
<rect x="400" y="574" width="330" height="140" rx="14" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<line x1="400" y1="604" x2="730" y2="604" stroke="#d6b656" stroke-width="1.5"/>
<text x="412" y="594.0" font-size="14" fill="#000">VMM: msb machine</text>
<rect x="420" y="620" width="290" height="70" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="565.0" y="650.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">microVM</text>
<text x="565.0" y="670.0" font-size="12" text-anchor="middle" fill="#000">holds no key and no socket</text>
<rect x="800" y="574" width="260" height="90" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
<text x="930.0" y="614.0" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">msb.db</text>
<text x="930.0" y="634.0" font-size="12" text-anchor="middle" fill="#000">run row: pid and start time</text>
<path d="M510.0,144.0 L720.0,144.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M890.0,338.0 L890.0,192.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M135.0,574.0 L135.0,474.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M285.0,474.0 L285.0,574.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M480.0,474.0 L480.0,574.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M645.0,474.0 L645.0,514.0 Q645.0,524.0 655.0,524.0 L920.0,524.0 Q930.0,524.0 930.0,534.0 L930.0,574.0" fill="none" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
<circle cx="615.0" cy="144.0" r="13" fill="#ffffff"/>
<text x="615.0" y="149.0" font-size="15" text-anchor="middle" fill="#000">a</text>
<circle cx="890.0" cy="265.0" r="13" fill="#ffffff"/>
<text x="890.0" y="270.0" font-size="15" text-anchor="middle" fill="#000">b</text>
<circle cx="135.0" cy="524.0" r="13" fill="#ffffff"/>
<text x="135.0" y="529.0" font-size="15" text-anchor="middle" fill="#000">1</text>
<circle cx="285.0" cy="524.0" r="13" fill="#ffffff"/>
<text x="285.0" y="529.0" font-size="15" text-anchor="middle" fill="#000">4</text>
<circle cx="480.0" cy="524.0" r="13" fill="#ffffff"/>
<text x="480.0" y="529.0" font-size="15" text-anchor="middle" fill="#000">2</text>
<circle cx="787.5" cy="524.0" r="13" fill="#ffffff"/>
<text x="787.5" y="529.0" font-size="15" text-anchor="middle" fill="#000">3</text>
<rect x="20" y="778" width="1060" height="330" rx="14" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
<text x="40" y="808" font-size="15" font-weight="bold" fill="#000">Flow</text>
<text x="40" y="840" font-size="14" font-weight="bold" fill="#000">Prerequisites, once</text>
<text x="40" y="874" font-size="12" font-weight="bold" fill="#000">a</text>
<text x="64" y="874" font-size="12" fill="#000">Flux applies the node entry, the</text>
<text x="64" y="891" font-size="12" fill="#000">delegate entry and the VM entry from</text>
<text x="64" y="908" font-size="12" fill="#000">git. The controller manager copies</text>
<text x="64" y="925" font-size="12" fill="#000">them to the server.</text>
<text x="40" y="951" font-size="12" font-weight="bold" fill="#000">b</text>
<text x="64" y="951" font-size="12" fill="#000">The host agent attests with x509pop.</text>
<text x="64" y="968" font-size="12" fill="#000">Its config loads the msbvm plugin</text>
<text x="64" y="985" font-size="12" fill="#000">(path and checksum) and sets</text>
<text x="64" y="1002" font-size="12" fill="#000">admin.sock. The server sends the</text>
<text x="64" y="1019" font-size="12" fill="#000">entries of the node. The agent mints</text>
<text x="64" y="1036" font-size="12" fill="#000">their SVIDs.</text>
<text x="385" y="840" font-size="14" font-weight="bold" fill="#000">Each time a VM needs its SVID</text>
<text x="385" y="874" font-size="12" font-weight="bold" fill="#000">1</text>
<text x="409" y="874" font-size="12" fill="#000">The delegate connects to admin.sock</text>
<text x="409" y="891" font-size="12" fill="#000">and sends the pid of the VMM. The</text>
<text x="409" y="908" font-size="12" fill="#000">agent checks the delegate.</text>
<text x="385" y="934" font-size="12" font-weight="bold" fill="#000">2</text>
<text x="409" y="934" font-size="12" fill="#000">The unix attestor gives the uid. The</text>
<text x="409" y="951" font-size="12" fill="#000">msbvm plugin reads the exe and the</text>
<text x="409" y="968" font-size="12" fill="#000">command line of the VMM.</text>
<text x="385" y="994" font-size="12" font-weight="bold" fill="#000">3</text>
<text x="409" y="994" font-size="12" fill="#000">The plugin checks the run row: same</text>
<text x="409" y="1011" font-size="12" fill="#000">pid, same start time. It returns the</text>
<text x="409" y="1028" font-size="12" fill="#000">VM name and the sandbox ID.</text>
<text x="385" y="1054" font-size="12" font-weight="bold" fill="#000">4</text>
<text x="409" y="1054" font-size="12" fill="#000">The agent matches the VM entry. It</text>
<text x="409" y="1071" font-size="12" fill="#000">sends the SVID and the key to the</text>
<text x="409" y="1088" font-size="12" fill="#000">delegate. Zero SVIDs is a refusal.</text>
<text x="730" y="840" font-size="14" font-weight="bold" fill="#000">Lifetimes and names</text>
<text x="730" y="874" font-size="12" fill="#000">The VM never sees the key or a socket of</text>
<text x="730" y="891" font-size="12" fill="#000">the agent.</text>
<text x="730" y="917" font-size="12" fill="#000">The pid is an input, not a selector. It</text>
<text x="730" y="934" font-size="12" fill="#000">changes at each start.</text>
<text x="730" y="960" font-size="12" fill="#000">The server default for the life of an</text>
<text x="730" y="977" font-size="12" fill="#000">SVID is 4 hours.</text>
<text x="730" y="1003" font-size="12" fill="#000">The ID: spiffe://mcp.local/node/sandbox-</text>
<text x="730" y="1020" font-size="12" fill="#000">dev/user/&lt;user&gt;/vm/&lt;vm&gt;</text>
</svg>
