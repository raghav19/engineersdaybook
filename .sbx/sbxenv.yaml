---
schemaVersion: "1"
name: sandbox-dev
agent: sbx-kit-shell
workspace:
  path: ..
  clone: true
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  - docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ghcr.io/raghav19/dev-agent-sandbox/dev-tools@sha256:c77dc7414307060ccb4ceea7a19ff53ab643d0a1268ce6de21513b17547fd28e # task sandbox:build pins this to the digest it pushed
sandboxOptions:
  cpus: 2
  memory: 2g
# Registered with the host's sbx MCP gateway. The agent reaches them only through the gateway. GitHub is not here: it needs
# request headers and an OAuth client, which this block cannot declare, so `task sandbox:mcp-github` registers it.
mcp:
  servers:
    - name: drawio
      url: https://mcp.draw.io/mcp
    - name: flux-schema-catalog
      url: https://schemas.fluxoperator.dev/mcp
