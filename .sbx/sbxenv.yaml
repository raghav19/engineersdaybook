---
schemaVersion: "1"
name: sandbox-dev
agent: sbx-kit-shell
workspace:
  path: ..
  clone: true
args:
  appId:
    description: GitHub App id. Not a secret.
    default: "4999686"
  installationId:
    description: GitHub App installation id. Not a secret.
    default: "162969352"
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  - docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ghcr.io/raghav19/dev-agent-sandbox/dev-tools@sha256:0fdaacfd7af526f8711a7f1889367a65218e43c60653f1b2c45e3f8d6c772f82 # task sandbox:build pins this to the digest it pushed
sandboxOptions:
  cpus: 2
  memory: 2g
secrets:
  github-mcp:
    command: ${{ env.fileDir }}/scripts/mint-gh-app-token.sh ${{ env.args.appId }} ${{ env.args.installationId }}
    refresh: 55m
bindings:
  github-mcp:
    apiKey:
      domains:
        - api.githubcopilot.com
