schemaVersion: "1"
name: sandbox-dev
agent: sbx-kit-shell
workspace:
  path: ..
  clone: true
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  - docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ghcr.io/raghav19/dev-agent-sandbox/dev-tools@sha256:6b5709c0d9f58c0e1982b5a2d334cc4aad4bd2dcfe938cfe74b395def2078e88
  - ghcr.io/raghav19/dev-agent-sandbox/policy@sha256:83c0b0e1abedb69ee174cc05eb0119004c56898377c4df8dd8b3fe25fc50f0a7
sandboxOptions:
  cpus: 4
  memory: 4g
additionalWorkspaces:
  # The join token and the trust bundle of the SPIRE agent in the VM (agent/spire.sh). Outside the repo, read-only. It shows at the same
  # absolute path in the VM. The same path is in agent/spire.sh and in the start command of the dev-tools kit: change all three together.
  - path: /home/rana/.sbx/spire
    readOnly: true
lifecycle:
  initialize:
    # Runs on the host before every create and run. Exit code 3 (no cluster, no SPIRE server) lets the run go on without a token. Any other
    # failure, for example an unset SANDBOX_GITHUB_ID, stops it. The script makes no token while an attested agent has a valid SVID: the agent renews it.
    - name: Make the SPIRE join token
      command: '${{ env.fileDir }}/agent/spire.sh enroll || [ $? -eq 3 ]'
      timeout: 2m
  preRemove:
    # Before the sandbox is removed: evict its agent and delete its alias entries on the SPIRE server. A failure only warns and the removal goes on.
    - name: Remove the SPIRE agent of the sandbox
      command: '${{ env.fileDir }}/agent/spire.sh remove'
      timeout: 2m
