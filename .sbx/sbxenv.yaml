schemaVersion: "1"
name: sandbox-dev
agent: sbx-kit-shell
workspace:
  path: ..
  clone: true
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  - docker.io/docker/sbx-kit-claude-mixin:2.1.285
  - ghcr.io/raghav19/dev-agent-sandbox/dev-tools@sha256:6b5709c0d9f58c0e1982b5a2d334cc4aad4bd2dcfe938cfe74b395def2078e88
  - ghcr.io/raghav19/dev-agent-sandbox/policy@sha256:83c0b0e1abedb69ee174cc05eb0119004c56898377c4df8dd8b3fe25fc50f0a7
sandboxOptions:
  cpus: 4
  memory: 4g
additionalWorkspaces:
  # SPIRE join token and trust bundle, made by agent/spire.py. Read-only, same path in the VM.
  # Keep the path equal in agent/spire.py and in the start command of the dev-tools kit.
  - path: /home/rana/.sbx/spire
    readOnly: true
lifecycle:
  initialize:
    # Exit code 3 (cluster unreachable) lets the run go on. Any other failure stops it.
    - name: Make the SPIRE join token
      command: '${{ env.fileDir }}/agent/spire.py enroll || [ $? -eq 3 ]'
      timeout: 2m
  preRemove:
    # Evict the agent and delete its entries on the SPIRE server. A failure only warns.
    - name: Remove the SPIRE agent of the sandbox
      command: '${{ env.fileDir }}/agent/spire.py remove'
      timeout: 2m
