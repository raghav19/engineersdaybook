version: '3'

# The squid proxy the sbx daemon's own traffic goes through (sbx setting proxy.daemon). A plain Docker container from compose.yaml, with no systemd unit of
# its own: Docker's `restart: unless-stopped` keeps it up, and the daemon tasks in ../Taskfile.yml start it first and stop it last. Included by
# ../Taskfile.yml with flatten, so the task names keep the `sandbox:` prefix.
#
# sandbox:install-egress    once per machine: pull the squid image
# sandbox:start-egress      start the proxy and wait until it is healthy
# sandbox:stop-egress       stop the proxy and remove the container
#
# After editing squid.conf: task sandbox:stop-egress sandbox:start-egress (or sandbox:restart-daemon). squid reads the file at start.
# Logs:   docker logs -f sbx-daemon-egress   (a line appears when a connection closes, so the MCP servers' long-lived ones show up late)
# Check:  docker ps --filter name=sbx-daemon-egress   healthy

silent: true

# The rootless Docker socket. DOCKER_HOST is set per directory by mise, so these tasks set it themselves and work from anywhere.
env:
  DOCKER_HOST: unix://{{.XDG_RUNTIME_DIR}}/docker.sock

vars:
  COMPOSE: docker compose -f {{.ROOT_DIR}}/.sbx/daemon/egress/compose.yaml

tasks:
  sandbox:install-egress:
    desc: Once per machine. Pull the squid image for the daemon's egress proxy
    cmds:
      - "{{.COMPOSE}} pull"

  sandbox:start-egress:
    desc: Start the squid egress proxy for the sbx daemon and wait until it is healthy
    cmds:
      - "{{.COMPOSE}} up -d --wait"

  sandbox:stop-egress:
    desc: Stop the squid egress proxy and remove its container
    cmds:
      - "{{.COMPOSE}} down"

  # Not run by hand: tasks that need the proxy list it under deps, so they stop with a clear message instead of a raw sbx error.
  sandbox:check-egress:
    internal: true
    preconditions:
      - sh: test "$(docker inspect -f '{{`{{.State.Health.Status}}`}}' sbx-daemon-egress 2>/dev/null)" = healthy
        msg: "The egress proxy (sbx-daemon-egress) is not running and healthy. Run: task sandbox:start-daemon"
