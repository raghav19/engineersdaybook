# Egress proxy for the sbx daemon: `sbx settings set proxy.daemon http://127.0.0.1:3128`.
# Port 3128 is outside the 32768-60999 range where rootless Docker's pasta forwarder drops published ports, and the publish is loopback only.
# `task sandbox:start-egress` starts this (and sandbox:start-daemon runs it first); Docker restarts it at login. By hand: DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock docker compose -f <this file> up -d --wait
services:
  sbx-daemon-egress:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: sbx-daemon-egress
    # Docker restarts squid after a crash (about 7 s) but not after a manual `docker stop` or `docker kill`: bring it back with `up -d --wait`.
    restart: unless-stopped
    user: "13:13"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # `read_only` leaves squid nowhere to put its pid file, cache dirs or logs. All three are scratch, so tmpfs, owned by the uid above.
    tmpfs:
      - /run:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13

    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro

    ports:
      - "127.0.0.1:3128:3128"

    # `up --wait` returns only when squid accepts connections, so nothing sets proxy.daemon against a proxy that is not serving yet.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
