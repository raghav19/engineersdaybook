# Allowlist for the sbx daemon's own outbound traffic (sbx settings: proxy.daemon). The VM's traffic does not come here: that is governed
# by the sbx egress policy (the kit's allow and deny lists in ../../agent/dev-tools.yaml).
#
# To change what the daemon may reach, edit the dstdomain lines below and run `docker compose restart` in this folder.
# Squid sees the host and port of a tunnel, not paths or MCP tool names.

http_port 3128
pinger_enable off

# The MCP servers the gateway calls (registered by `task sandbox:mcp`). github.com is the OAuth token refresh.
acl mcp_hosts dstdomain mcp.draw.io
acl mcp_hosts dstdomain schemas.fluxoperator.dev
acl mcp_hosts dstdomain api.githubcopilot.com
acl mcp_hosts dstdomain github.com

# Docker sign-in, registries and kit pulls.
acl daemon_hosts dstdomain hub.docker.com
acl daemon_hosts dstdomain login.docker.com
acl daemon_hosts dstdomain marlin-2.docker.com
acl daemon_hosts dstdomain auth.docker.io
acl daemon_hosts dstdomain registry-1.docker.io
acl daemon_hosts dstdomain production.cloudfront.docker.com
acl daemon_hosts dstdomain ghcr.io
acl daemon_hosts dstdomain pkg-containers.githubusercontent.com

# Claude sign-in token the daemon refreshes for the sandbox.
acl daemon_hosts dstdomain api.anthropic.com
acl daemon_hosts dstdomain platform.claude.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow mcp_hosts
http_access allow daemon_hosts
http_access deny all

cache deny all
access_log stdio:/dev/stdout
