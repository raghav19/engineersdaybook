# syntax=docker/sandbox-kit:3
# dev-agent-sandbox tools: one mixin with everything this repo adds to the Docker Claude and shell kits.
# The tools in the repo's mise.toml and .sbx/tools.toml and their completions are baked in, so nothing is installed at boot.
# Built with the repo root as build context, see the Taskfile.
schemaVersion: "3"
kind: mixin
displayName: dev-tools
description: >-
  Exact-version dev tools from the repo's mise.toml and .sbx/tools.toml (kubectl, helm, kustomize, fzf, starship, fd, task, yq, terraform,
  terragrunt, flux),
  their bash completions and the bash setup, plus the GitHub MCP credential.
version: "0.1.0"

args:
  workspace:
    default: "/home/rana/Projects/engineersdaybook"
    pattern: '^/.+'
    description: Path of the repo inside the sandbox, which is the same path as on the host. mise trusts the mise.toml found there.
    buildArg: WORKSPACE

capabilities:
  # Egress rules for the sandboxed environment. @2 adds method and path rules; deny wins over any allow,
  # including the host's own sbx policy. The deny below stops gh or curl from using the injected token to
  # delete repositories through the REST API. It does not block other writes: add methods to widen it.
  # The credential's own host (api.githubcopilot.com) must stay in this allow list: sbx refuses a kit whose credential
  # injects on a host that the kit's own network policy does not allow.
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - api.githubcopilot.com
          - marketplace.visualstudio.com
          - "**.vsassets.io"
          - registry.terraform.io      # Terraform provider index
          - releases.hashicorp.com     # Terraform provider downloads
        deny:
          - hosts: [api.github.com]
            methods: [DELETE]
            paths: [/repos/**]

  # The GitHub credential. Inject-only: no apiKey.name, so no environment variable and nothing at all inside the VM.
  # The service is named github-mcp, not github: `github` is an sbx built-in whose default domains include
  # api.github.com, so gh and git would also get the token. A custom name is injected only on the domains below.
  - type: com.docker.sandbox/credential@1
    config:
      service: github-mcp
      phase: runtime
      apiKey:
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"

  # The Terraform provider cache (TF_PLUGIN_CACHE_DIR in .sbx/tools.toml), one per sandbox. sbx keeps it across
  # stop and start and deletes it with the sandbox. It comes up root-owned, so the boot command below gives it to agent.
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.cache/terraform-providers
      size: 5g

  # The shell setup is a file in the agent's home (written at every start, as the agent user), sourced from ~/.bashrc by
  # the boot command below. The tools are on PATH as mise shims (the image's ENV), so no `mise activate`.
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/.dev-tools-shellrc
          description: Interactive bash setup, sourced from ~/.bashrc
          content: |
            [[ $- == *i* ]] || return
            for f in /opt/sandbox/completions/*; do [ -r "$f" ] && . "$f"; done
            command -v fzf >/dev/null && eval "$(fzf --bash)"
            command -v starship >/dev/null && eval "$(starship init bash)"
      startup:
        - command:
            - sh
            - -c
            - |
              ldconfig                    # the VS Code server, which Remote-SSH downloads on the first connect, needs libstdc++
              usermod -s /bin/bash agent  # an SSH session otherwise starts /bin/sh
              grep -qs 'dev-tools-shellrc' /home/agent/.bashrc || echo '. /home/agent/.dev-tools-shellrc' >> /home/agent/.bashrc
              chown agent:agent /home/agent/.bashrc
              # The provider cache volume, and ~/.cache, which sbx creates as root to mount it (mise writes its own cache there).
              chown agent:agent /home/agent/.cache /home/agent/.cache/terraform-providers
              # mkfs leaves a root-only lost+found in the volume, and Terraform fails to scan a cache it cannot read.
              rm -rf /home/agent/.cache/terraform-providers/lost+found
          user: "0"
          description: Set bash as the login shell, source the shell setup from ~/.bashrc, give agent the provider cache

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        You are running inside a jailed sandbox (a microVM) for developers of this repository.
        GitHub access is provided by the hosted GitHub MCP server in the repository's .mcp.json.
        You hold no GitHub credential: the host injects a short-lived token, only on requests to
        the MCP server. Use the MCP tools for anything on GitHub; git push, gh and direct API
        calls from here have no credential and will fail. Your repository is a private clone:
        commit your work on a branch, and the developer fetches it from the sandbox remote.

# The content recipe. Everything is staged under /out and lands on the workload as-is (see the create-v3-kit RECIPES.md).
# The build context is the repo root; dev-tools.yaml.dockerignore keeps only mise.toml and .sbx/tools.toml.
build: |
  # syntax=docker/dockerfile:1
  FROM dhi.io/debian-base:trixie-dev AS build
  ARG MISE_VERSION=v2026.10.0

  # Set once, read by mise and the tasks. mise sits in /usr/local/bin because the shims it makes link to that path.
  ENV MISE_DATA_DIR=/opt/mise \
      MISE_CACHE_DIR=/tmp/mise-cache \
      MISE_INSTALL_PATH=/usr/local/bin/mise \
      COMPLETIONS_DIR=/out/opt/sandbox/completions

  RUN apt-get update \
   && apt-get install -y --no-install-recommends curl ca-certificates git xz-utils bzip2 \
   && rm -rf /var/lib/apt/lists/*

  # mise, then exactly the tools in the repo's mise.toml and .sbx/tools.toml, which are copied in as they are: the second is mise's system config, so mise merges the two.
  RUN curl -fsSL https://mise.run | MISE_VERSION=$MISE_VERSION sh
  WORKDIR /repo
  COPY mise.toml ./
  COPY .sbx/tools.toml /etc/mise/conf.d/sandbox.toml
  RUN mise trust /repo/mise.toml && mise install --yes

  # The bash completions come from a task in .sbx/tools.toml.
  RUN mise run sandbox:completions

  # The two files are also the VM's system config (config.toml and conf.d, both loaded), so the shims resolve from any directory.
  COPY mise.toml /out/etc/mise/config.toml
  COPY .sbx/tools.toml /out/etc/mise/conf.d/sandbox.toml
  RUN mkdir -p /out/usr/local/bin && cp -a /opt/mise /out/opt/mise && cp /usr/local/bin/mise /out/usr/local/bin/mise \
   && chown -R 0:0 /out

  FROM scratch
  COPY --from=build /out /
  ARG WORKSPACE
  # The tools are the mise shims, which also apply the repo's [env]. MISE_TRUSTED_CONFIG_PATHS trusts the clone's mise.toml,
  # which nothing else would.
  ENV PATH=/opt/mise/shims \
      MISE_DATA_DIR=/opt/mise \
      MISE_TRUSTED_CONFIG_PATHS=$WORKSPACE
