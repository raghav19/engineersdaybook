version: '3'

# Included by the root Taskfile.yml (dir: .sbx, flatten: true), so the task names carry the `sandbox:` prefix themselves and work from the
# repo root, from any subfolder and from this folder.
#
# This file only orchestrates. The two policies live in their own folders, each with its own Taskfile included below:
#   agent/    what runs inside the VM: the kit, its egress allow and deny lists, the tools, the skills
#   daemon/   what the sbx daemon and its MCP gateway may reach: the MCP registrations, the daemon's systemd unit, and the squid allowlist and its container
#             (daemon/egress/). Once per machine: sandbox:install-egress, sandbox:install-daemon. Then sandbox:start-daemon / stop-daemon / restart-daemon
#
# sandbox:login   once per machine: log docker and sbx in to ghcr.io with the token in the root .env.secrets.json
# sandbox:run     developer: `sbx env run . --detached`, register and attach the MCP servers, open VS Code on it
#
# sbxenv.yaml declares the sandbox (kits, size, clone workspace). `sbx env run` prints that plan and asks for approval. The README has the one-time setup.

includes:
  agent:
    taskfile: agent/Taskfile.yml
    flatten: true
  daemon:
    taskfile: daemon/Taskfile.yml
    flatten: true

silent: true

vars:
  GHCR_USER: raghav19
  NAME:
    sh: yq .name {{.ROOT_DIR}}/.sbx/sbxenv.yaml

tasks:
  sandbox:login:
    desc: Once per machine. Log docker and sbx in to ghcr.io with the token in .env.secrets.json (the kit is a private package)
    cmds:
      # Extract the GitHub token from the secrets file and use it to log in to Docker and sbx.
      - |
        token=$(sops -d --extract '["GITHUB_TOKEN"]' "{{.ROOT_DIR}}/.env.secrets.json")
        printf %s "$token" | docker login ghcr.io -u {{.GHCR_USER}} --password-stdin
        printf %s "$token" | sbx secret set -f --registry ghcr.io --username {{.GHCR_USER}} --password-stdin

  sandbox:run:
    desc: Developer. Create or start the sandbox and open VS Code on it, then return (detached)
    deps: [sandbox:check-daemon, sandbox:check-egress] # the sandbox's MCP calls go through the daemon, and the daemon's through the proxy
    cmds:
      - sbx env run {{.ROOT_DIR}}/.sbx --detached {{.CLI_ARGS}} # sandbox started
      - task: sandbox:install-mcp # install MCP servers to running sandbox
      - task: sandbox:setup-vscode # configure VS Code for the sandbox
      - code --folder-uri "vscode-remote://ssh-remote+{{.NAME}}.sbx$(git rev-parse --show-toplevel)" # open VS Code on the sandbox
