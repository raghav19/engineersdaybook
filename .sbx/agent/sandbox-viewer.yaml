# What the agent in the sandbox may read on a kind cluster. Applied by `just sandbox agent kubeconfig-install`, which also binds the built-in `view` role in each listed
# namespace (viewer_namespaces in agent.just). Nothing here can write, and nothing can read a Secret: `view` has no Secrets, and the rules below name none.
# Keep the age key (`sops-age`) and the pull and upstream credentials out of every rule you add.
#
# The ServiceAccount has its own namespace, so it does not mix with the workloads of a shared cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-viewer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-viewer
  namespace: sandbox-viewer
---
# `view` is namespaced, so it has no cluster-scoped kinds and none of the stack's custom resources. This role adds get/list/watch on the namespaces
# themselves, nodes, volumes, storage classes, CSI drivers, CRDs and webhook configurations, and on every resource of the groups below. The groups are
# the one cluster-wide grant: they hold the stack's infrastructure objects (gateways, Flux and SPIRE resources), and some of their kinds are cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-viewer
rules:
- apiGroups: [ "" ]
  resources: [ namespaces, nodes, persistentvolumes ]
  verbs: [ get, list, watch ]
- apiGroups: [ storage.k8s.io ]
  resources: [ storageclasses, csidrivers ]
  verbs: [ get, list, watch ]
- apiGroups: [ apiextensions.k8s.io ]
  resources: [ customresourcedefinitions ]
  verbs: [ get, list, watch ]
- apiGroups: [ admissionregistration.k8s.io ]
  resources: [ validatingwebhookconfigurations, mutatingwebhookconfigurations ]
  verbs: [ get, list, watch ]
- apiGroups: [ gateway.networking.k8s.io, agentgateway.dev, fluxcd.controlplane.io, spire.spiffe.io ]
  resources: [ "*" ]
  verbs: [ get, list, watch ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-viewer
subjects:
- kind: ServiceAccount
  name: sandbox-viewer
  namespace: sandbox-viewer
