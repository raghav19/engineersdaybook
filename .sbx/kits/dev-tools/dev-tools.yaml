# syntax=docker/sandbox-kit:3
# dev-agent-sandbox tools: one mixin with the tools this repo adds to the Docker Claude and shell kits.
# The tools in tools.toml and their completions are baked in, so nothing is installed at boot. The recipe is dev-tools.dockerfile.
# The egress rules and the agent note are the policy kit (../policy/).
schemaVersion: "3"
kind: mixin
displayName: dev-tools
description: >-
  Exact-version dev tools from tools.toml
sourceUrl: https://github.com/raghav19/engineersdaybook
version: "0.2.0"

args:
  workspace:
    default: "/home/rana/Projects/engineersdaybook"
    pattern: '^/.+'
    description: Path of the repo inside the sandbox, which is the same path as on the host. mise trusts the mise.toml found there.
    buildArg: WORKSPACE

capabilities:
  # The Terraform provider cache (TF_PLUGIN_CACHE_DIR in tools.toml), one per sandbox. sbx keeps it across
  # stop and start and deletes it with the sandbox. It comes up root-owned, so the boot command below gives it to agent.
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.cache/terraform-providers
      size: 5g

  # The shell setup is a file in the agent's home (written at every start, as the agent user), sourced from ~/.bashrc by
  # the boot command below. The tools are on PATH as mise shims (the image's ENV), so no `mise activate`.
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/.dev-tools-shellrc
          description: Interactive bash setup, sourced from ~/.bashrc
          content: |
            [[ $- == *i* ]] || return
            eval "$(mise activate bash)"
            [ -r /usr/share/bash-completion/bash_completion ] && . /usr/share/bash-completion/bash_completion
            for f in /opt/sandbox/completions/* ~/.local/share/sandbox/completions/*; do [ -r "$f" ] && . "$f"; done
            alias k=kubectl
            alias f=flux
            # Claude Code through the Headroom proxy (127.0.0.1:8787, started at boot by the startup command below). Plain `claude` reaches it
            # through the env in .claude/settings.json. claude-hr is the same path with the proxy started by wrap if it is down.
            claude-hr() { headroom wrap claude --code-memory none -- "$@"; }
            complete -o default -F __start_kubectl k
            complete -o default -F __start_flux f
            command -v fzf >/dev/null && eval "$(fzf --bash)"
            command -v starship >/dev/null && eval "$(starship init bash)"
      startup:
        - command:
            - sh
            - -c
            - |
              ldconfig                    # the VS Code server, which Remote-SSH downloads on the first connect, needs libstdc++
              usermod -s /bin/bash agent  # an SSH session otherwise starts /bin/sh
              grep -qs 'dev-tools-shellrc' /home/agent/.bashrc || echo '. /home/agent/.dev-tools-shellrc' >> /home/agent/.bashrc
              chown agent:agent /home/agent/.bashrc
              # The provider cache volume, and ~/.cache, which sbx creates as root to mount it (mise writes its own cache there).
              chown agent:agent /home/agent/.cache /home/agent/.cache/terraform-providers
              # mkfs leaves a root-only lost+found in the volume, and Terraform fails to scan a cache it cannot read.
              rm -rf /home/agent/.cache/terraform-providers/lost+found
          user: "0"
          description: Set bash as the login shell, source the shell setup from ~/.bashrc, give agent the provider cache
        - command:
            - sh
            - -c
            - cd "${{ kit.args.workspace }}" && prek install --allow-missing-config # the git hook is not versioned, so a fresh clone has none
          user: agent
          description: Install the prek pre-commit hook in the workspace clone
        - command:
            - sh
            - -c
            - setsid nohup headroom proxy --port 8787 >/dev/null 2>&1 & # binds 127.0.0.1 only; the log is ~/.headroom/logs/proxy.log
          user: agent
          description: Start the Headroom proxy in the background
