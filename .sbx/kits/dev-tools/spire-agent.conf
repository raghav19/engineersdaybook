# The SPIRE agent of the sandbox VM. It attests the VM as a node to the SPIRE server in the kind cluster. Image path: /etc/spire/agent.conf.
# The start command in dev-tools.yaml adds the two files that the host script (just sandbox agent spire-enroll) makes: -trustBundle and -joinTokenFile.
# These values are for the local kind cluster. Another cluster needs its own trust_domain, server_address and server_port.
agent {
  # The SVID of the agent is kept here. After a stop and start of the sandbox the agent reuses it while it is valid.
  data_dir            = "/home/agent/.spire/data"
  socket_path         = "/home/agent/.spire/agent.sock"

  # trust_domain in code/mcp-sandbox/part-3-mcp-guardrails/config/cloud/kind/identity.yaml
  trust_domain        = "mcp.local"

  # The SPIRE server: NodePort 30081 of the cluster, published on the host as 127.0.0.1:18081 (clusters/kind/kind-config.yaml).
  # The VM reaches the host as host.docker.internal through the sbx proxy.
  server_address      = "host.docker.internal"
  server_port         = "18081"

  trust_bundle_format = "spiffe"
  log_level           = "INFO"
}

plugins {
  # A join token works once and cannot re-attest. Stored SVID: see KeyManager.
  NodeAttestor     "join_token" { plugin_data {} }

  # "disk" keeps the key and SVID in data_dir. "memory" would lose them at each restart.
  KeyManager       "disk"       { plugin_data { directory = "/home/agent/.spire/data" } }

  # Matches a process by uid. Workload entries (a later phase) use selectors such as unix:uid:1001.
  WorkloadAttestor "unix"       { plugin_data {} }
}
