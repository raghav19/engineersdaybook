# The gVisor runtime of the builder (runtime runsc-builder). See https://gvisor.dev/docs/user_guide/networking/
# A runtime with another name needs the full path. Change it if your runsc is somewhere else.

[engine.runtimes]
runsc-builder = ["/usr/local/bin/runsc"]

[engine.runtimes_flags]
runsc-builder = [
    # Rootless runsc cannot make a systemd scope. The service limits in sandbox-builder.container replace the limits of Podman.
    "ignore-cgroups",
    # gVisor keeps its own network stack. The relay needs only the loopback.
    "network=none",
    # buildkitd makes its socket in a mounted host folder, and the relay connects to the socket of the builder proxy.
    "host-uds=all",
]
