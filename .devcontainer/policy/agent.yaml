# The policy of the proxy (service proxy in ../compose.yaml), the only way out of the agent sandbox. Docs: https://github.com/ironsh/iron-proxy. Flow: ../README.md#egress-request-flow
# The proxy ends TLS with its own CA and allows only the hosts below. Any other host gets 403.
# The sandbox holds placeholders. The proxy swaps each one for the real value from its environment. This file has variable names, never values.
# Each placeholder in ../compose.yaml, managed-settings.json and docker-config.json must equal a proxy_value line below.
# Only the tunnel listens on the internal network. iron-proxy requires the DNS, HTTP and HTTPS listeners. They stay on the loopback, where the sandbox cannot reach them.
dns:
  listen: "127.0.0.1:18084"
  proxy_ip: "127.0.0.1"
proxy:
  http_listen: "127.0.0.1:18081"
  https_listen: "127.0.0.1:18082"
  # The tunnel takes CONNECT and SOCKS5. It must equal the proxy IP and port of HTTPS_PROXY in ../compose.yaml.
  tunnel_listen: "10.200.0.2:18080"
tls:
  ca_cert: /etc/iron-proxy/ca.crt
  ca_key: /etc/iron-proxy/ca.key
metrics:
  listen: "127.0.0.1:18083"
transforms:
  - name: allowlist
    config:
      domains:
        # Claude Code
        - api.anthropic.com
        - claude.ai
        - console.anthropic.com
        - platform.claude.com
        - code.claude.com
        # Qwen Code (Token Plan, Singapore)
        - token-plan.ap-southeast-1.maas.aliyuncs.com
        # GitHub is in rules below.
        # MCP servers
        - mcp.draw.io
        - schemas.fluxoperator.dev
        # Container images. Docker Hub needs the registry, the token service and a CDN. The CDN host changes, so *.docker.com covers it.
        - registry-1.docker.io
        - auth.docker.io
        - "*.docker.com"
        # GHCR blobs. The host ghcr.io is in rules below.
        - pkg-containers.githubusercontent.com
        # Tool downloads
        - proxy.golang.org
        - sum.golang.org
        - releases.hashicorp.com
        - registry.terraform.io
        - mise.jdx.dev
        - astral.sh
        - "*.astral.sh"
        - pypi.org
        - files.pythonhosted.org
        - registry.npmjs.org
        # Chart and OCI registries that the cluster uses. blob.istio.io redirects to istio-release.r2.istio.io.
        - istio.io
        - "*.istio.io"
        - istio-release.storage.googleapis.com
        - cr.agentgateway.dev
        - quay.io
        - "*.quay.io"
        - charts.dexidp.io
        # Schemas
        - www.schemastore.org
        # Documentation and project sites, for research
        - artifacthub.io
        - backstage.io
        - kind.sigs.k8s.io
        - just.systems
        - fluxcd.io
        - fluxoperator.dev
        - spiffe.github.io
        - docs.ansible.com
        - argo-cd.readthedocs.io
        - pkl-lang.org
        - kubernetes.io
        - helm.sh
        - kubectl.docs.kubernetes.io
        - docs.aws.amazon.com
        - docs.k3s.io
        - agentgateway.dev
        - cuelang.org
        - spiffe.io
        - owasp.org
        - fluxcd.control-plane.io
        - doc.traefik.io
        - cloud.google.com
        - "*.substack.com"
        # Other
        - crl.microsoft.com
      # ghcr.io: reads in any namespace, writes in the namespace raghav19 only. Other writes get 403.
      # The proxy decides at the CONNECT, before it sees a path, so each host needs a CONNECT rule.
      rules:
        - {host: ghcr.io, methods: [CONNECT]}
        - {host: ghcr.io, methods: [GET, HEAD], paths: ["/token", "/v2/", "/v2/*"]}
        - {host: ghcr.io, methods: [POST, PATCH, PUT], paths: ["/v2/raghav19/*"]}
        # GitHub: reads are open. Writes go to raghav19/engineersdaybook only, so an injected agent cannot send data to another repository, a gist or an issue elsewhere.
        # The proxy cannot read the body of a request.
        # Static hosts: reads only.
        - {host: "*.githubusercontent.com", methods: [CONNECT, GET, HEAD]}
        - {host: github.githubassets.com, methods: [CONNECT, GET, HEAD]}
        - {host: www.githubstatus.com, methods: [CONNECT, GET, HEAD]}
        # Git over HTTPS. A clone or a pull is a POST of git-upload-pack (any repository). A push is a POST of git-receive-pack (this repository only).
        - {host: github.com, methods: [CONNECT]}
        - {host: github.com, methods: [GET, HEAD]}
        - {host: github.com, methods: [POST], paths: ["/*/*/git-upload-pack"]}
        - {host: github.com, methods: [POST], paths: ["/raghav19/engineersdaybook/git-receive-pack", "/raghav19/engineersdaybook.git/git-receive-pack"]}
        # REST API: reads are open. Writes are limited to issues and pulls of this repository. A merge is a PUT, so it gets 403.
        # Every other write gets 403 (file, branch, release, workflow, gist, fork). GraphQL gets 403 too, because its path does not show what a query writes.
        - {host: api.github.com, methods: [CONNECT]}
        - {host: api.github.com, methods: [GET, HEAD]}
        - {host: api.github.com, methods: [POST, PATCH], paths: ["/repos/raghav19/engineersdaybook/issues", "/repos/raghav19/engineersdaybook/issues/*", "/repos/raghav19/engineersdaybook/pulls", "/repos/raghav19/engineersdaybook/pulls/*"]}
        # The GitHub MCP server. Only the URL /mcp/ is open. The proxy does not limit the tools. The settings files and the central gateway do.
        - {host: api.githubcopilot.com, methods: [CONNECT]}
        - {host: api.githubcopilot.com, methods: [GET, POST, DELETE], paths: ["/mcp", "/mcp/"]}
  - name: secrets
    config:
      secrets:
        # GitHub: git (Basic authentication), the API and the GitHub MCP server.
        - source: {type: env, var: GH_TOKEN}
          replace: {proxy_value: sandbox-placeholder-GH_TOKEN, match_headers: [Authorization]}
          rules:
            - {host: github.com}
            - {host: api.github.com}
            - {host: api.githubcopilot.com}
        # Claude Code
        - source: {type: env, var: CLAUDE_CODE_OAUTH_TOKEN}
          replace: {proxy_value: sandbox-placeholder-CLAUDE_CODE_OAUTH_TOKEN, match_headers: [Authorization]}
          rules:
            - {host: api.anthropic.com}
        # Qwen Code (Token Plan, Singapore)
        - source: {type: env, var: QWEN_API_KEY}
          replace: {proxy_value: sandbox-placeholder-QWEN_API_KEY, match_headers: [Authorization]}
          rules:
            - {host: token-plan.ap-southeast-1.maas.aliyuncs.com}
        # GitHub Container Registry: the login of crane (push and pull)
        - source: {type: env, var: GITHUB_TOKEN}
          replace: {proxy_value: sandbox-placeholder-GHCR_PUSH_TOKEN, match_headers: [Authorization]}
          rules:
            - {host: ghcr.io}
log:
  level: info
