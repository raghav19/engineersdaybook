# The policy of the builder proxy (service builder-proxy in ../compose.yaml). It holds no token and no CA. Docs: https://github.com/ironsh/iron-proxy
# The mode sni-only passes TLS through to the real host and checks only the host name. A build step cannot get a token, and the builder cannot reach the proxy of the agent sandbox.
# The other listeners use the same loopback ports as agent.yaml, each in its own container.
dns:
  listen: "127.0.0.1:18084"
  proxy_ip: "127.0.0.1"
proxy:
  http_listen: "127.0.0.1:18081"
  https_listen: "127.0.0.1:18082"
  # The tunnel takes CONNECT. It must equal the builder proxy IP and port in ../compose.yaml and ../agent/configs/tools/docker-config.json.
  tunnel_listen: "10.200.0.10:18080"
tls:
  mode: sni-only
metrics:
  listen: "127.0.0.1:18083"
transforms:
  - name: allowlist
    config:
      domains:
        # Image registries for FROM
        - registry-1.docker.io
        - auth.docker.io
        - "*.docker.com"
        - ghcr.io
        - pkg-containers.githubusercontent.com
        - quay.io
        - "*.quay.io"
        # Packages for RUN
        - proxy.golang.org
        - sum.golang.org
        - registry.npmjs.org
        - pypi.org
        - files.pythonhosted.org
        - releases.hashicorp.com
        - deb.debian.org
        - security.debian.org
        - dl-cdn.alpinelinux.org
        # Source and release downloads
        - github.com
        - api.github.com
        - "*.githubusercontent.com"
