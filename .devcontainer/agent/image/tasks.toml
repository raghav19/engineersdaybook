# The system config of mise in the image: the env, the shell hook and the tasks. The tools are in tools/, one file for each group. See https://mise.jdx.dev/configuration.html
# mise reads this file and tools/ from /etc/mise/conf.d/. The mise of the host does not load them.
# The root mise.toml is for the host only (kind, bws). If both sides use a tool (kubectl, helm, kustomize), both files list it.

# EDITOR is in the Dockerfile ENV, so it applies outside a mise shell too.
[env]
LANG = "C.UTF-8"
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/terraform-providers"
CHECKPOINT_DISABLE = "1"  # Terraform does not check its version at checkpoint-api.hashicorp.com
COMPLETIONS_DIR = "{{ get_env(name='COMPLETIONS_DIR', default=env.HOME ~ '/.local/share/bash-completion/completions') }}"  # the Dockerfile sets the same path at build time
DO_NOT_TRACK = "1"
DOTNET_SYSTEM_GLOBALIZATION_INVARIANT = "1"  # marksman (the Markdown language server) runs on .NET. The image has no ICU library, and this setting lets .NET start without it
HF_HUB_OFFLINE = "1"
# Under gVisor, Herdr lists no agents without this setting. See https://github.com/herdrdev/herdr/issues/1982
HERDR_PROCESS_DETECTION = "child-groups"
# Each Plannotator review binds the first free port of this range. The range must equal the line in agent/ports. See ../../README.md#open-a-port-of-the-sandbox-on-the-host
PLANNOTATOR_PORT = "19432-19436"
PLANNOTATOR_BROWSER = "none"  # the sandbox has no browser. Plannotator prints the URL, and you open it on the host
# Ponytail (the task sandbox:start installs the plugin) puts no codebase map in the session context. This saves input tokens.
PONYTAIL_MAP = "0"
PONYTAIL_DEFAULT_MODE = "full"

[hooks.enter]
# The alias k is kubectl with completion. The alias tu is the launcher of the token usage plugin of Herdr. Herdr writes it at each start.
shell = "bash"
script = """
alias k=kubectl
complete -F __start_kubectl k
alias tu=~/.local/state/herdr/plugins/pseudovar.token-usage/bin/tu
"""

# The Dockerfile runs this task. See https://mise.jdx.dev/tasks/
[tasks."sandbox:completions"]
description = "Write the bash completions into $COMPLETIONS_DIR"
run = """
mkdir -p "$COMPLETIONS_DIR"
kubectl completion bash > "$COMPLETIONS_DIR/kubectl"
helm completion bash > "$COMPLETIONS_DIR/helm"
kustomize completion bash > "$COMPLETIONS_DIR/kustomize"
k9s completion bash > "$COMPLETIONS_DIR/k9s"
fd --gen-completions bash > "$COMPLETIONS_DIR/fd"
flux completion bash > "$COMPLETIONS_DIR/flux"
just --completions bash > "$COMPLETIONS_DIR/just"
yq shell-completion bash > "$COMPLETIONS_DIR/yq"
herdr completion bash > "$COMPLETIONS_DIR/herdr"
docker completion bash > "$COMPLETIONS_DIR/docker"
crane completion bash > "$COMPLETIONS_DIR/crane"
uv generate-shell-completion bash > "$COMPLETIONS_DIR/uv"
gitleaks completion bash > "$COMPLETIONS_DIR/gitleaks"
flux9s completions bash > "$COMPLETIONS_DIR/flux9s"
starship completions bash > "$COMPLETIONS_DIR/starship"
echo complete -C terraform terraform > "$COMPLETIONS_DIR/terraform"
echo complete -C terragrunt terragrunt > "$COMPLETIONS_DIR/terragrunt"
"""

# The task appends once at build time. A second run adds the lines twice.
[tasks."sandbox:shell"]
description = "Append the mise, starship and fzf lines to ~/.bashrc"
run = '''
{
  echo 'eval "$(mise activate bash)"'
  echo 'eval "$(starship init bash)"'
  echo 'eval "$(fzf --bash)"'
} >> "$HOME/.bashrc"
'''

[tasks."sandbox:herdr-plugins"]
description = "Install the Herdr plugins at their pinned commits"
# The token usage plugin reads the logs of Claude Code and makes no network call at run time.
run = "herdr plugin install --yes --ref 7f2689bb0880c72fe7465a1dbd44519fb5cb4476 pseudovar/herdr-plugin-token-usage"

[tasks."fresh:plugins"]
description = "Install the Fresh packages at their pinned commits"
# One row for each package: name, kind (plugin, language or theme), repo, commit (a full hash, no tag) and subdir (. for the whole repo).
# A test can set FRESH_CONFIG_DIR to use another folder.
shell = "bash -c"
run = '''
set -euo pipefail
cfg="${FRESH_CONFIG_DIR:-$HOME/.config/fresh}"
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
while read -r name kind repo commit subdir; do
  # The kind gives the folder: plugin to plugins/packages, language to languages/packages, theme to themes/packages.
  dest="$cfg/${kind}s/packages/$name"
  # The file .commit holds the commit of the last install. If it is the pinned commit, skip the package.
  if [ "$(cat "$dest/.commit" 2>/dev/null)" = "$commit" ]; then
    echo "ok  $name (installed)"
    continue
  fi
  # Fetch only the pinned commit, with no history.
  git -C "$tmp" init -q "$name"
  git -C "$tmp/$name" fetch -q --depth 1 "$repo" "$commit"
  git -C "$tmp/$name" checkout -q FETCH_HEAD
  # A monorepo has more than one package, so copy the subdir and not the repo.
  rm -rf "$dest"
  mkdir -p "${dest%/*}"
  cp -r "$tmp/$name/$subdir" "$dest"
  rm -rf "$dest/.git"
  echo "$commit" >"$dest/.commit"
  echo "ok  $name (installed now)"
done <<'EOF'
todo-highlighter        plugin   https://github.com/sinelaw/fresh-plugins       3f327361b8b64e6e192386e5badda9d22241c854 todo-highlighter
color-highlighter       plugin   https://github.com/sinelaw/fresh-plugins       3f327361b8b64e6e192386e5badda9d22241c854 color-highlighter
dotfiles-fresh-language language https://github.com/2fd/dotfiles-fresh-language 2b8c0e58721001dba0b7f9bf7608ee8b52e04261 .
catppuccin              theme    https://github.com/sinelaw/fresh-plugins       3f327361b8b64e6e192386e5badda9d22241c854 themes/catppuccin
EOF
'''

# The start step of the agent sandbox. sandbox-agent.container runs it with podman exec, as the user agent, after the relay starts. Flow: ../../README.md#run-flow
# It prepares the home and the clone, installs the plugins and writes /tmp/sandbox-ready. A step does nothing if its work exists.
# Variables: SANDBOX_WORKSPACE and REPO_URL come from sandbox-agent.container. SANDBOX_BRANCH is optional (default: the branch of the host checkout).
[tasks."sandbox:start"]
description = "Prepare the home and the clone, install the plugins, write /tmp/sandbox-ready"
shell = "bash -c"
run = '''
set -eu
ws=${SANDBOX_WORKSPACE:?SANDBOX_WORKSPACE is not set}
rm -f /tmp/sandbox-ready # a restarted container keeps its /tmp
fail() { echo "sandbox:start: $*" >&2; exit 1; }

# /home/agent is a volume. Copy the skeleton of the image at each start. The folders of the agent stay: the clone, .claude, .qwen, .herdr and .cache.
# Trap: -f is required. Git pack files in the plugin checkouts are mode 0444, and cp -a cannot overwrite them at the second start.
cp -af /usr/share/sandbox/home/. "$HOME/" || fail "could not copy the home skeleton"
mkdir -p "$HOME/.claude" "$HOME/.qwen" "$HOME/.herdr" "$HOME/.cache/terraform-providers" || fail "could not make the folders of the home"

# The clone is private, because /run/sandbox/source (the .git folder of the host repo) is read-only. A push goes to GitHub, to a feature branch.
if [ ! -d "$ws/.git" ]; then
  git clone --no-hardlinks ${SANDBOX_BRANCH:+--branch "$SANDBOX_BRANCH"} /run/sandbox/source "$ws" || fail "git clone failed (branch: ${SANDBOX_BRANCH:-the default})"
  git -C "$ws" remote set-url origin "$REPO_URL" || fail "could not set origin to $REPO_URL"
fi
(cd "$ws" && prek install --allow-missing-config) || fail "prek install failed"

# The home volume keeps session.json and session-snapshots in ~/.herdr, so a new sandbox restores the panes.
mkdir -p "$HOME/.config/herdr" "$HOME/.herdr/session-snapshots"
ln -sfn "$HOME/.herdr/session.json" "$HOME/.config/herdr/session.json"
ln -sfn "$HOME/.herdr/session-snapshots" "$HOME/.config/herdr/session-snapshots"

# Plugins of Claude Code go to the home volume. A failure prints a warning and does not stop the task.
claude plugin marketplace add DietrichGebert/ponytail#v5.3.2 && claude plugin install ponytail@ponytail \
  || echo "sandbox:start: warning: the ponytail plugin is not installed" >&2
claude plugin marketplace add /home/agent/token-economizer && claude plugin install tokeneconomizer@tokeneconomizer \
  || echo "sandbox:start: warning: the TokenEconomizer plugin is not installed" >&2

# The container stays up after you close the terminal. Herdr and Claude Code keep running in it. `podman stop sandbox-agent` stops it.
touch /tmp/sandbox-ready
'''
