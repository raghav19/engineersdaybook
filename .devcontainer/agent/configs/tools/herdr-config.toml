# Herdr config. The catppuccin theme is Catppuccin Mocha.

# Skip the first-run dialog. A top-level key must come before the first table.
onboarding = false

[theme]
# Set name to catppuccin (Catppuccin Mocha) or tokyo-night. Then run: herdr server reload-config
name = "catppuccin"

[terminal]
default_shell = "/bin/bash"
shell_mode = "login"
new_cwd = "/home/agent/engineersdaybook"

# Token usage plugin (pseudovar.token-usage). The rows show the usage of each agent pane in the sidebar. The prefix+u key opens the dashboard.
# The plugin writes more settings with `tu setup --apply` (tab bar, workspace rows, alert toasts). The image does not use them.
# The colors in the rules are Catppuccin Mocha: red, yellow and green.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "$tu_sub", dim = true }],
  [{ token = "$tu", rules = [{ starts_with = "■", fg = "#f38ba8", bold = true }, { starts_with = "▲", fg = "#f9e2af" }, { starts_with = "▽", fg = "#a6e3a1" }] }],
  [{ token = "$tu_more", dim = true }],
]

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "pseudovar.token-usage.open"
description = "token usage dashboard"

# Review pane plugin (persiyanov.reviewr). The prefix+d key opens or closes it beside the agent. A new worktree opens it.
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review the diff"
