<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1040" height="760" viewBox="0 0 1040 760" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker>
</defs>
<rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>
<text x="20" y="38" font-size="22" font-weight="bold" fill="#000000">How Quadlet controls the sandbox</text>

<rect x="20" y="290" width="300" height="110" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="170" y="318.8" font-weight="bold">The four .container files</text><text x="170" y="339.8">sandbox-agent, sandbox-builder</text><text x="170" y="360.8">sandbox-proxy</text><text x="170" y="381.8">sandbox-builder-proxy</text></g>

<rect x="380" y="290" width="220" height="110" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="490" y="329.3" font-weight="bold">Quadlet generator</text><text x="490" y="350.3">reads the .container files</text><text x="490" y="371.3">writes the .service files</text></g>

<rect x="20" y="470" width="320" height="70" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="180" y="499.8" font-weight="bold">Limits are in the service</text><text x="180" y="520.8">gVisor ignores --memory and --cpus</text></g>

<rect x="20" y="570" width="320" height="84" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="180" y="596.3" font-weight="bold">PartOf the agent</text><text x="180" y="617.3">A stop of the agent stops</text><text x="180" y="638.3">the builder and both proxies</text></g>

<rect x="680" y="80" width="340" height="640" rx="12" fill="#ffffff" stroke="#666666" stroke-width="2"/>
<line x1="680" y1="120" x2="1020" y2="120" stroke="#666666" stroke-width="1"/>
<g font-size="16" text-anchor="start" fill="#000000" font-weight="bold"><text x="692" y="105.3">Services: one cgroup each</text></g>

<rect x="710" y="140" width="280" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="850" y="176.8" font-weight="bold">sandbox-builder-proxy.service</text><text x="850" y="197.8">256 MB, 256 threads</text></g>

<rect x="710" y="294" width="280" height="84" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="850" y="330.8" font-weight="bold">sandbox-builder.service</text><text x="850" y="351.8">2 GB, 2 CPUs, 1024 threads</text></g>

<rect x="710" y="448" width="280" height="84" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="850" y="484.8" font-weight="bold">sandbox-agent.service</text><text x="850" y="505.8">3 GB, 4 CPUs, 2048 threads</text></g>

<rect x="710" y="602" width="280" height="84" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<g font-size="16" text-anchor="middle" fill="#000000"><text x="850" y="638.8" font-weight="bold">sandbox-proxy.service</text><text x="850" y="659.8">512 MB, 512 threads</text></g>

<path d="M320,345 L380,345" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M600,345 L680,345" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M850,294 L850,224" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M850,448 L850,378" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M850,532 L850,602" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="862" y="264" font-size="14" text-anchor="start" fill="#000000">Requires</text>
<text x="862" y="418" font-size="14" text-anchor="start" fill="#000000">Requires</text>
<text x="862" y="572" font-size="14" text-anchor="start" fill="#000000">Requires</text>
