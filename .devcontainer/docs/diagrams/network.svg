<rect x="355" y="495" width="230" height="80" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="470" y="509.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="470" dy="0" font-weight="bold">Volume buildkit-sock</tspan><tspan x="470" dy="17">a folder on the host</tspan><tspan x="470" dy="17">buildkitd.sock: a Unix</tspan><tspan x="470" dy="17">socket, not a network</tspan></text>
<rect x="60" y="665" width="360" height="150" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="240" y="711.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="240" dy="0" font-weight="bold">builder: 10.200.0.11</tspan><tspan x="240" dy="19">gVisor: userspace kernel</tspan><tspan x="240" dy="19">HTTPS_PROXY=http://10.200.0.10:18080</tspan><tspan x="240" dy="19">RUN steps: the same proxy</tspan></text>
<rect x="60" y="840" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="856.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the Internet</tspan><tspan x="240" dy="17">internal: true, so network unreachable</tspan></text>
<rect x="60" y="900" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="916.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the host</tspan><tspan x="240" dy="17">inhibit_ipv4: the bridge has no host IP</tspan></text>
<rect x="760" y="650" width="360" height="180" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="940" y="689" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="940" dy="0" font-weight="bold">builder-proxy</tspan><tspan x="940" dy="17">runc, uid 10001</tspan><tspan x="940" dy="17">tunnel on 10.200.0.10:18080</tspan><tspan x="940" dy="17">(CONNECT)</tspan><tspan x="940" dy="17">127.0.0.1 only: DNS, HTTP,</tspan><tspan x="940" dy="17">HTTPS, metrics</tspan><tspan x="940" dy="17">sni-only, no token</tspan></text>
<rect x="710" y="710" width="100" height="60" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
<text x="760" y="732" text-anchor="middle" dominant-baseline="central" font-size="13"><tspan x="760" dy="0" font-weight="bold">10.200.0.10</tspan><tspan x="760" dy="16">build</tspan></text>
<rect x="1070" y="710" width="100" height="60" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
