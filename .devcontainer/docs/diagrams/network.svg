<text x="20" y="77.5" text-anchor="start" dominant-baseline="central" font-size="16" font-style="italic"><tspan x="20" dy="0" font-weight="bold">Host: rootful Docker</tspan></text>
<rect x="30" y="110" width="760" height="380" rx="16" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="127.5" text-anchor="start" dominant-baseline="central" font-size="16" font-style="italic"><tspan x="40" dy="0" font-weight="bold">Network sandbox: internal, 10.200.0.0/29</tspan></text>
<rect x="30" y="580" width="760" height="380" rx="16" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40" y="597.5" text-anchor="start" dominant-baseline="central" font-size="16" font-style="italic"><tspan x="40" dy="0" font-weight="bold">Network build: internal, 10.200.0.8/29</tspan></text>
<rect x="1010" y="110" width="350" height="850" rx="16" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1020" y="127.5" text-anchor="start" dominant-baseline="central" font-size="16" font-style="italic"><tspan x="1020" dy="0" font-weight="bold">Network default: Compose bridge</tspan></text>
<rect x="60" y="185" width="360" height="150" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="240" y="231.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="240" dy="0" font-weight="bold">agent: 10.200.0.3</tspan><tspan x="240" dy="19">gVisor</tspan><tspan x="240" dy="19">HTTPS_PROXY=http://10.200.0.2:18080</tspan><tspan x="240" dy="19">NO_PROXY=localhost,127.0.0.1</tspan></text>
<rect x="60" y="360" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="376.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the Internet</tspan><tspan x="240" dy="17">internal: true, so network unreachable</tspan></text>
<rect x="60" y="420" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="436.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the host</tspan><tspan x="240" dy="17">inhibit_ipv4: the bridge has no host IP</tspan></text>
<rect x="710" y="195" width="360" height="130" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="890" y="226" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="890" dy="0" font-weight="bold">proxy (the agent proxy)</tspan><tspan x="890" dy="17">runc, uid 10001</tspan><tspan x="890" dy="17">10.200.0.2:18080: tunnel (CONNECT, SOCKS5)</tspan><tspan x="890" dy="17">127.0.0.1 only: DNS, HTTP, HTTPS, metrics</tspan><tspan x="890" dy="17">ends TLS, swaps the tokens</tspan></text>
<rect x="450" y="500" width="230" height="70" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
<text x="565" y="518" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="565" dy="0" font-weight="bold">Volume buildkit-sock</tspan><tspan x="565" dy="17">buildkitd.sock, a Unix</tspan><tspan x="565" dy="17">socket, not a network</tspan></text>
<rect x="60" y="665" width="360" height="150" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="240" y="711.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="240" dy="0" font-weight="bold">builder: 10.200.0.11</tspan><tspan x="240" dy="19">gVisor</tspan><tspan x="240" dy="19">HTTPS_PROXY=http://10.200.0.10:18080</tspan><tspan x="240" dy="19">RUN steps: the same proxy</tspan></text>
<rect x="60" y="840" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="856.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the Internet</tspan><tspan x="240" dy="17">internal: true, so network unreachable</tspan></text>
<rect x="60" y="900" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="916.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the host</tspan><tspan x="240" dy="17">inhibit_ipv4: the bridge has no host IP</tspan></text>
<rect x="710" y="675" width="360" height="130" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="890" y="706" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="890" dy="0" font-weight="bold">builder-proxy</tspan><tspan x="890" dy="17">runc, uid 10001</tspan><tspan x="890" dy="17">10.200.0.10:18080: tunnel (CONNECT)</tspan><tspan x="890" dy="17">127.0.0.1 only: DNS, HTTP, HTTPS, metrics</tspan><tspan x="890" dy="17">TLS passthrough (sni-only), no token</tspan></text>
<rect x="1450" y="450" width="220" height="80" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="1560" y="480.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1560" dy="0" font-weight="bold">Internet</tspan><tspan x="1560" dy="19">allowed hosts only</tspan></text>
