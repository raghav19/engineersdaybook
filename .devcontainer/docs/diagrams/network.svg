<text x="240" y="231.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="240" dy="0" font-weight="bold">agent: 10.200.0.3</tspan><tspan x="240" dy="19">gVisor: userspace kernel</tspan><tspan x="240" dy="19">HTTPS_PROXY=http://10.200.0.2:18080</tspan><tspan x="240" dy="19">NO_PROXY=localhost,127.0.0.1</tspan></text>
<rect x="60" y="360" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="376.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the Internet</tspan><tspan x="240" dy="17">internal: true, so network unreachable</tspan></text>
<rect x="60" y="420" width="360" height="50" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="240" y="436.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="240" dy="0" font-weight="bold">No route to the host</tspan><tspan x="240" dy="17">inhibit_ipv4: the bridge has no host IP</tspan></text>
<rect x="760" y="170" width="360" height="180" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="940" y="209" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="940" dy="0" font-weight="bold">proxy (the agent proxy)</tspan><tspan x="940" dy="17">runc, uid 10001</tspan><tspan x="940" dy="17">tunnel on 10.200.0.2:18080</tspan><tspan x="940" dy="17">(CONNECT, SOCKS5)</tspan><tspan x="940" dy="17">127.0.0.1 only: DNS, HTTP,</tspan><tspan x="940" dy="17">HTTPS, metrics</tspan><tspan x="940" dy="17">ends TLS, swaps the tokens</tspan></text>
