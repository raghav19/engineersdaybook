<text x="760" y="252" text-anchor="middle" dominant-baseline="central" font-size="13"><tspan x="760" dy="0" font-weight="bold">10.200.0.2</tspan><tspan x="760" dy="16">sandbox</tspan></text>
<rect x="1070" y="230" width="100" height="60" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1"/>
