<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Helvetica, Arial, sans-serif" fill="#000000">
<defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect width="1400" height="780" fill="#ffffff"/>
<text x="20" y="30" dominant-baseline="central" font-size="22" font-weight="bold">How to design an agent sandbox</text>
<rect x="280" y="80" width="1100" height="500" rx="16" fill="#fafafa" stroke="#666666" stroke-width="2"/>
<text x="290" y="97.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="290" dy="0" font-weight="bold">Host computer</tspan></text>
<rect x="300" y="150" width="620" height="390" rx="16" fill="#ffffff" stroke="#6c8ebf" stroke-width="4"/>
<text x="348" y="167.5" text-anchor="start" dominant-baseline="central" font-size="16"><tspan x="348" dy="0" font-weight="bold">The wall: a user-space kernel or a microVM</tspan><tspan x="348" dy="19">The agent calls this kernel, not the host kernel.</tspan><tspan x="348" dy="19">A plain container shares the host kernel.</tspan></text>
<rect x="20" y="240" width="220" height="70" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="130.0" y="266.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="130.0" dy="0" font-weight="bold">Your request</tspan><tspan x="130.0" dy="17">a task for the agent</tspan></text>
<rect x="330" y="230" width="270" height="90" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="465.0" y="266.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="465.0" dy="0" font-weight="bold">Agent</tspan><tspan x="465.0" dy="17">the model and its client</tspan></text>
<rect x="620" y="230" width="270" height="90" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
<text x="755.0" y="266.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="755.0" dy="0" font-weight="bold">Software</tspan><tspan x="755.0" dy="17">the tools that the task needs</tspan></text>
<rect x="330" y="400" width="270" height="110" rx="10" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="465.0" y="421.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="465.0" dy="0" font-weight="bold">Workspace</tspan><tspan x="465.0" dy="17">only the files and folders</tspan><tspan x="465.0" dy="17">that the task needs.</tspan><tspan x="465.0" dy="17">Mount the rest read-only,</tspan><tspan x="465.0" dy="17">or leave it out.</tspan></text>
<rect x="620" y="400" width="270" height="110" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="755.0" y="429.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="755.0" dy="0" font-weight="bold">Saved state</tspan><tspan x="755.0" dy="17">Decide what stays after</tspan><tspan x="755.0" dy="17">a restart: a volume,</tspan><tspan x="755.0" dy="17">a snapshot or nothing.</tspan></text>
<rect x="1000" y="230" width="350" height="90" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1175.0" y="258.0" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1175.0" dy="0" font-weight="bold">Network gate</tspan><tspan x="1175.0" dy="17">No network device. One way out, to a proxy.</tspan><tspan x="1175.0" dy="17">Listed hosts pass. The proxy blocks the rest.</tspan></text>
<rect x="1000" y="400" width="350" height="110" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
<text x="1175.0" y="429.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1175.0" dy="0" font-weight="bold">Key holder</tspan><tspan x="1175.0" dy="17">Real keys stay outside the wall.</tspan><tspan x="1175.0" dy="17">The sandbox holds placeholders. The proxy</tspan><tspan x="1175.0" dy="17">swaps in a key for its listed hosts only.</tspan></text>
<rect x="1000" y="660" width="350" height="90" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="1175.0" y="696.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="1175.0" dy="0" font-weight="bold">Outside services</tspan><tspan x="1175.0" dy="17">APIs, websites and registries</tspan></text>
<rect x="300" y="660" width="620" height="90" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
<text x="610.0" y="679.5" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="610.0" dy="0" font-weight="bold">You</tspan><tspan x="610.0" dy="17">Approve each risky action. Follow each step in a log.</tspan><tspan x="610.0" dy="17">Stop the sandbox at any time.</tspan><tspan x="610.0" dy="17">Undo the changes of one task, not the whole workspace.</tspan></text>
<line x1="240" y1="275.0" x2="330" y2="275.0" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="465.0" y1="320" x2="465.0" y2="400" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="890" y1="275.0" x2="1000" y2="275.0" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<text x="945.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-style="italic">requests</text>
<line x1="1175.0" y1="320" x2="1175.0" y2="400" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="1175.0" y1="510" x2="1175.0" y2="660" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<line x1="610.0" y1="660" x2="610.0" y2="540" stroke="#333333" stroke-width="2" marker-end="url(#a-dark)"/>
<text x="618.0" y="600.0" text-anchor="start" dominant-baseline="central" font-size="14" font-style="italic">allow or deny</text>
<circle cx="324" cy="174" r="16" fill="#6c8ebf"/>
<text x="324" y="174" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">1</text>
<circle cx="334" cy="404" r="16" fill="#6c8ebf"/>
<text x="334" y="404" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">2</text>
<circle cx="624" cy="404" r="16" fill="#6c8ebf"/>
<text x="624" y="404" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">5</text>
<circle cx="1004" cy="234" r="16" fill="#6c8ebf"/>
<text x="1004" y="234" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">3</text>
<circle cx="1004" cy="404" r="16" fill="#6c8ebf"/>
<text x="1004" y="404" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">4</text>
<circle cx="304" cy="664" r="16" fill="#6c8ebf"/>
<text x="304" y="664" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#ffffff">6</text>
</svg>
