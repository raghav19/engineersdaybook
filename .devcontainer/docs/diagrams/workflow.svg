<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="530" viewBox="0 0 1520 530" font-family="Helvetica, Arial, sans-serif" fill="#000000">
<defs>
<marker id="m333333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker>
</defs>
<rect width="1520" height="530" fill="#ffffff"/>
<text x="20" y="30" text-anchor="start" dominant-baseline="central" font-size="22"><tspan x="20" dy="0" font-weight="bold">Developer workflow of the agent sandbox</tspan></text>
<rect x="20" y="70" width="1480" height="190" rx="16" fill="none" stroke="#666666" stroke-width="2"/>
<text x="30" y="87.5" text-anchor="start" dominant-baseline="central" font-size="16" font-style="italic"><tspan x="30" dy="0" font-weight="bold">Build: when agent/ changes</tspan></text>
<rect x="50" y="120" width="250" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="175" y="165.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="175" dy="0" font-weight="bold">Edit agent/</tspan><tspan x="175" dy="19">Dockerfile, tools/*.toml</tspan></text>
<rect x="340" y="120" width="250" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="465" y="156" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="465" dy="0" font-weight="bold">Commit</tspan><tspan x="465" dy="19">the tag is the git tree</tspan><tspan x="465" dy="19">sha of agent/</tspan></text>
<rect x="630" y="120" width="250" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="755" y="156" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="755" dy="0" font-weight="bold">Build and push</tspan><tspan x="755" dy="19">devcontainer build --push,</tspan><tspan x="755" dy="19">layer cache in :cache</tspan></text>
<rect x="920" y="120" width="250" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1045" y="156" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1045" dy="0" font-weight="bold">ghcr.io</tspan><tspan x="1045" dy="19">sandbox-dev:&lt;tag&gt;,</tspan><tspan x="1045" dy="19">a private package</tspan></text>
<rect x="1210" y="120" width="250" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<text x="1335" y="156" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1335" dy="0" font-weight="bold">Pin the digest</tspan><tspan x="1335" dy="19">image line in compose.yaml,</tspan><tspan x="1335" dy="19">then PR and merge</tspan></text>
<rect x="20" y="310" width="1480" height="190" rx="16" fill="none" stroke="#666666" stroke-width="2"/>
<text x="30" y="327.5" text-anchor="start" dominant-baseline="central" font-size="16" font-style="italic"><tspan x="30" dy="0" font-weight="bold">Use: each session</tspan></text>
<rect x="50" y="360" width="250" height="110" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="175" y="396" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="175" dy="0" font-weight="bold">Start</tspan><tspan x="175" dy="19">devcontainer up: init.sh,</tspan><tspan x="175" dy="19">then the 4 containers</tspan></text>
<rect x="340" y="360" width="250" height="110" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="465" y="405.5" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="465" dy="0" font-weight="bold">Open Herdr</tspan><tspan x="465" dy="19">devcontainer exec herdr</tspan></text>
<rect x="630" y="360" width="250" height="110" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="755" y="396" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="755" dy="0" font-weight="bold">The agent works</tspan><tspan x="755" dy="19">Claude or Qwen in its clone,</tspan><tspan x="755" dy="19">a branch for each task</tspan></text>
<rect x="920" y="360" width="250" height="110" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="1045" y="396" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1045" dy="0" font-weight="bold">Push and open a PR</tspan><tspan x="1045" dy="19">through the agent proxy,</tspan><tspan x="1045" dy="19">this repo only</tspan></text>
<rect x="1210" y="360" width="250" height="110" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="1335" y="396" text-anchor="middle" dominant-baseline="central" font-size="16"><tspan x="1335" dy="0" font-weight="bold">You review and merge</tspan><tspan x="1335" dy="19">on GitHub. The proxy</tspan><tspan x="1335" dy="19">blocks a merge.</tspan></text>
<path d="M300 175 L340 175" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M590 175 L630 175" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M880 175 L920 175" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M1170 175 L1210 175" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M300 415 L340 415" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M590 415 L630 415" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M880 415 L920 415" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M1170 415 L1210 415" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<path d="M1335 230 L1335 271 Q1335 295 1311 295 L261.5 295 Q237.5 295 237.5 319 L237.5 360" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<text x="786.25" y="280" text-anchor="middle" dominant-baseline="central" font-size="14"><tspan x="786.25" dy="0">devcontainer up pulls the pinned image</tspan></text>
</svg>
