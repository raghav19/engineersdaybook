# This file lists the tools of the sandbox, the Terraform cache settings and the bash completions.
# The Dockerfile puts these exact versions in the image, as /etc/mise/conf.d/sandbox.toml.
# The root mise.toml is for the host only (kind, msb, bws). The image does not read it.
# If both sides use a tool (kubectl, helm, kustomize), both files list it.
# The file is not named mise.toml, because the mise of the host would load it from this folder and ask you to trust it.
# node (npm is part of it) and python are here because the sbx shell kit supplied them. python is 3.13, as in the repo scripts and tools.
# uv is here because the mise pypi backend needs it at build time for headroom-ai. The build image has no uv or pipx.

# The mise shims in the sandbox set these values.
[env]
EDITOR = "code --wait"
LANG = "C.UTF-8"
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/terraform-providers"
CHECKPOINT_DISABLE = "1"  # Terraform does not check its version at checkpoint-api.hashicorp.com
COMPLETIONS_DIR = "{{ get_env(name='COMPLETIONS_DIR', default=env.HOME ~ '/.local/share/bash-completion/completions') }}"  # the Dockerfile sets the same path at build time
KUBECONFIG = "/run/sandbox/source/.msb/kubeconfig"  # a path in the host repo, which is read-only in the VM. The kube step writes the file on the host. It is not ported yet.
# Headroom (sandbox-boot starts it) sends no telemetry, makes no update check and downloads nothing from Hugging Face. huggingface.co is not in the egress allow list.
HEADROOM_TELEMETRY = "off"
HEADROOM_BEACON = "off"
HEADROOM_UPDATE_CHECK = "off"
DO_NOT_TRACK = "1"
HF_HUB_OFFLINE = "1"
UV_PYTHON_INSTALL_DIR = "/opt/mise/uv-python"  # at build time, the Python of the headroom-ai venv. The image copies /opt/mise with the venv. Without this value, uv uses ~/.local/share/uv.
# Ponytail (dev-tools.yaml installs the plugin at boot) puts no codebase map in the session context. This saves input tokens.
PONYTAIL_MAP = "0"
PONYTAIL_DEFAULT_MODE = "full"

[tools]
node = "24.22"  # the LTS release. npm comes with it
python = "3.13"
just = "1.59"
yq = "4.54"
jq = "1.8"
fd = "10.5"
kubectl = "1.37"
helm = "4.3"
kustomize = "5.8"
terragrunt = "1.1"
terraform = "1.16"
flux2 = "2.9"
"github:home-operations/flate" = "0.6"
"github:fluxcd/flux-schema" = "0.15"
prek = "0.5"
claude = "2.1.309"  # Claude Code, from the aqua registry with a SHA256 check. DISABLE_UPDATES=1 in sandbox.yaml: change the version here and rebuild
ruff = "0.17"
gitleaks = "8.30"
yamlfmt = "0.21"
uv = "0.13"
ty = "0.0.85"
"pypi:headroom-ai" = { version = "0.41.0", extras = "sandbox", install_env = { UV_PYTHON = "3.13" } }  # Claude Code token proxy. The sandbox extra has no torch. See docs/research/headroom.md. install_env: the build image has no Python, so uv gets the newest version (3.15), and onnxruntime has no cp315 wheel
"github:spiffe/spire" = { version = "1.15.3", asset_pattern = "spire-{{ version }}-linux-amd64-musl.tar.gz", filter_bins = "spire-agent" }  # SPIRE agent for the node identity of the VM. It has the same version as the SPIRE server

# The Dockerfile runs this task after it installs the tools. COMPLETIONS_DIR comes from [env]. The build sets it.
# If you run the task in the VM, the default is ~/.local/share/bash-completion/completions. Bash loads completions from this folder when it needs them.
[tasks."sandbox:completions"]
description = "Write the bash completions into $COMPLETIONS_DIR"
run = """
mkdir -p "$COMPLETIONS_DIR"
kubectl completion bash > "$COMPLETIONS_DIR/kubectl"
helm completion bash > "$COMPLETIONS_DIR/helm"
kustomize completion bash > "$COMPLETIONS_DIR/kustomize"
fd --gen-completions bash > "$COMPLETIONS_DIR/fd"
flux completion bash > "$COMPLETIONS_DIR/flux"
just --completions bash > "$COMPLETIONS_DIR/just"
yq shell-completion bash > "$COMPLETIONS_DIR/yq"
echo complete -C terraform terraform > "$COMPLETIONS_DIR/terraform"
echo complete -C terragrunt terragrunt > "$COMPLETIONS_DIR/terragrunt"
"""
