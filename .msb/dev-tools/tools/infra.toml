# The tools for the cluster and for infrastructure.
# The Dockerfile builds each file in its own stage, so a new version in one file rebuilds only that stage.
[tools]
kubectl = "1.37"
helm = "4.3"
kustomize = "5.8"
terragrunt = "1.1"
terraform = "1.16"
flux2 = "2.9"
"github:home-operations/flate" = "0.6"
"github:fluxcd/flux-schema" = "0.15"
"github:spiffe/spire" = { version = "1.15.3", asset_pattern = "spire-{{ version }}-linux-amd64-musl.tar.gz", filter_bins = "spire-agent" }  # SPIRE agent for the node identity of the VM. It has the same version as the SPIRE server
