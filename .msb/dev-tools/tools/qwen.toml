# Qwen Code, the terminal agent of Alibaba. It changes often, so it has its own file.
# The Dockerfile builds each file in its own stage, so a new version in one file rebuilds only that stage.
[tools]
node = "24.22"  # the npm: tool below needs node at build time. It is the same version as in runtimes.toml, so the final image has one copy
"npm:@qwen-code/qwen-code" = "0.26.4"  # the command is `qwen`. Change the version here and rebuild
