[package]
name = "lapce-lsp-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.100"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = { version = "=0.9.8", default-features = false, features = ["parse", "serde"] }
lapce-plugin = { git = "https://github.com/lapce/lapce-plugin-rust.git", rev = "a529f3ab570889890db178622b6104ed17b2168d" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
