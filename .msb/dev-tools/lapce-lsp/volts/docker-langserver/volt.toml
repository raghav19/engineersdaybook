name = "lsp-docker-langserver"
version = "0.1.0"
author = "sandbox"
display-name = "docker-langserver"
description = "Starts the docker-langserver language server from the image of the sandbox."
wasm = "lapce-lsp-launcher.wasm"

[activation]
language = ["dockerfile"]
workspace-contains = ["**/Dockerfile", "**/Containerfile"]

# The launcher reads this table. The program must be in the PATH of the VM.
[server]
command = "docker-langserver"
args = ["--stdio"]
language = "dockerfile"
patterns = ["**/Dockerfile", "**/Containerfile"]
