name = "lsp-ruff"
version = "0.1.0"
author = "sandbox"
display-name = "ruff"
description = "Starts the ruff language server from the image of the sandbox."
wasm = "lapce-lsp-launcher.wasm"

[activation]
language = ["python"]
workspace-contains = ["**/*.py"]

# The launcher reads this table. The program must be in the PATH of the VM.
[server]
command = "ruff"
args = ["server"]
language = "python"
patterns = ["**/*.py"]
