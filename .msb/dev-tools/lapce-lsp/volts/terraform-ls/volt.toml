name = "lsp-terraform-ls"
version = "0.1.0"
author = "sandbox"
display-name = "terraform-ls"
description = "Starts the terraform-ls language server from the image of the sandbox."
wasm = "lapce-lsp-launcher.wasm"

[activation]
workspace-contains = ["**/*.tf"]

# The launcher reads this table. The program must be in the PATH of the VM.
# lsp-langid fills in the language id that Lapce leaves empty for Terraform files, and terraform-ls needs it.
[server]
command = "lsp-langid"
args = ["terraform", "terraform-ls", "serve"]
patterns = ["**/*.tf"]
