name = "lsp-yaml-language-server"
version = "0.1.0"
author = "sandbox"
display-name = "yaml-language-server"
description = "Starts the yaml-language-server language server from the image of the sandbox."
wasm = "lapce-lsp-launcher.wasm"

[activation]
language = ["yaml"]
workspace-contains = ["**/*.yaml", "**/*.yml"]

# The launcher reads this table. The program must be in the PATH of the VM.
[server]
command = "yaml-language-server"
args = ["--stdio"]
language = "yaml"
patterns = ["**/*.yaml", "**/*.yml"]
