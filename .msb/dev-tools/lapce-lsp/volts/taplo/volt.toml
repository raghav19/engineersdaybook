name = "lsp-taplo"
version = "0.1.0"
author = "sandbox"
display-name = "taplo"
description = "Starts the taplo language server from the image of the sandbox."
wasm = "lapce-lsp-launcher.wasm"

[activation]
language = ["toml"]
workspace-contains = ["**/*.toml"]

# The launcher reads this table. The program must be in the PATH of the VM.
[server]
command = "taplo"
args = ["lsp", "stdio"]
language = "toml"
patterns = ["**/*.toml"]
