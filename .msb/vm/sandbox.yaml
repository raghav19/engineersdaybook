# This file declares the whole VM of the msb sandbox. `just msb run` makes the VM from it.
# If you change the file, run `just msb rm && just msb run`. This makes the VM again.
# Schema: https://docs.microsandbox.dev/cli/configuration.md
# ${NAME} is a host value. `just msb run` puts the host values in its environment.

image:
  # `just msb build` pushes the image and pins its digest here (@sha256:...)
  oci: ghcr.io/raghav19/engineersdaybook/dev-sbx@sha256:e332ceb04037f64ef2ba9ac3ea72aace8dc4dd43db1eb883ff7fc30ac6d8aa4a
  upper_size: "20G"
# msb pulls the private image from ghcr.io with this login. It reads the token from the environment: the Bitwarden key GITHUB_TOKEN, which `bws run` gives to `just msb run`.
# `read:packages` is enough to pull. The key has `write:packages`, because `just msb build` pushes with it.
registry:
  username: raghav19
  password_env: GITHUB_TOKEN
cpus: 4
memory: "3G"
shell: "/bin/bash"
env:
  SANDBOX_WORKSPACE: /home/agent/engineersdaybook # the path of the clone. The justfile (MSB_WORKSPACE) has the same value.
  SANDBOX_BRANCH: ${SANDBOX_BRANCH} # the branch of the host checkout. The clone starts on it.
  REPO_URL: https://github.com/raghav19/engineersdaybook # the URL of origin in the clone.
  GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME} # git reads the identity from these four variables. So the VM needs no git config for it.
  GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME}
  GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL}
  GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL}
  MISE_TRUSTED_CONFIG_PATHS: /home/agent/engineersdaybook # mise trusts the mise.toml files in the clone.
  MISE_IGNORED_CONFIG_PATHS: /home/agent/engineersdaybook/mise.toml # mise ignores the root mise.toml of the clone, because it lists host tools.
  CLAUDE_CONFIG_DIR: /home/agent/.claude # the claude-home volume holds the settings.
  DISABLE_UPDATES: "1" # the claude that mise installs does not update itself.
  HEADROOM_ALLOW_UNAUTHENTICATED_BIND: "1" # Headroom 0.41 refuses to bind 0.0.0.0 without this. sandbox-boot binds 0.0.0.0 so the host can reach port 8787. Only the host loopback publishes it. TODO: test HEADROOM_PROXY_TOKEN in place of this value. Check that Claude Code still works through the proxy with a token.
  HEADROOM_HARD_WATCHDOG_SECS: "0" # 0 turns off the Headroom watchdog. The watchdog stops Headroom after the host suspends the VM for more than 90 seconds. Nothing starts Headroom again until the next `just msb run`.
  KUBECONFIG: /home/agent/.kube/config # the kubeconfig of the sandbox agent. sandbox-boot writes it. It has the placeholder of the secret K8S_TOKEN and no credential.
mounts:
  - "${SANDBOX_GIT_DIR}:/run/sandbox/source:ro"
  - "${SANDBOX_OMARCHY_THEME}:/home/agent/.local/state/omarchy/current/theme:ro"
  # The node key, the node certificate and the trust bundle of the SPIRE agent. `just msb node-cert` copies them from the cluster before the VM starts.
  - "${SANDBOX_NODE_DIR}:/run/sandbox/node:ro"
  # The Claude Code login and settings. `just msb rm --volumes` removes them.
  - named: claude-home
    target: /home/agent/.claude
    create: ensure-exists
  # The images that podman pulls and builds in the VM. They stay when you remove the VM, so a new VM does not pull them again.
  # `just msb rm --volumes` removes them. sandbox-boot gives the folder to the agent user.
  - named: podman-storage
    target: /home/agent/.local/share/containers
    create: ensure-exists
  # The Terraform provider cache (TF_PLUGIN_CACHE_DIR in image/mise.toml). It stays when you remove the VM.
  # A new VM does not download the providers again. `just msb rm --volumes` removes the cache. sandbox-boot gives the folder to the agent user.
  - named: terraform-providers
    target: /home/agent/.cache/terraform-providers
    create: ensure-exists
  # The layout of Herdr (session.json and session-snapshots, linked by sandbox-boot). A new VM restores the panes of the last VM.
  # Herdr saves about 7 seconds after a change. The default worktree folder of Herdr (~/.herdr/worktrees) is in this volume too.
  # `just msb rm --volumes` removes the layout and those worktrees.
  - named: herdr
    target: /home/agent/.herdr
    create: ensure-exists
  # The sessions of Qwen Code, so that `qwen --resume` finds them in a new VM. `just msb rm --volumes` removes them.
  - named: qwen-home
    target: /home/agent/.qwen
    create: ensure-exists
  # The history, the settings and the memory of Headroom (savings_events.jsonl and more). A new VM keeps the savings history. `just msb rm --volumes` removes them.
  - named: headroom-home
    target: /home/agent/.headroom
    create: ensure-exists
secrets:
  GH_TOKEN:
    allow: [github.com, api.github.com, api.githubcopilot.com]
    # Without passthrough, msb blocks that request with 403 "Request blocked by secret policy". Passthrough sends the placeholder only, never the token.
    # Each secret passes through to the model API of the other agents. Qwen Code shows the 403 as "API Error: 403 status code (no body)", 
    # and the session then fails on every request, because it sends the whole history each time.
    passthrough: [api.anthropic.com, token-plan.ap-southeast-1.maas.aliyuncs.com]
  CLAUDE_CODE_OAUTH_TOKEN:
    allow: [api.anthropic.com]
    passthrough: [token-plan.ap-southeast-1.maas.aliyuncs.com]
  QWEN_API_KEY:
    allow: [token-plan.ap-southeast-1.maas.aliyuncs.com]
    passthrough: [api.anthropic.com]
  GHCR_PUSH_TOKEN:
    allow: [ghcr.io]
    passthrough: [api.anthropic.com, token-plan.ap-southeast-1.maas.aliyuncs.com]
  # A token of the ServiceAccount sandbox-agent (read-only in the cluster). The justfile makes it on the host (`kubectl create token`) and msb reads it from the environment. It never enters the VM.
  # The host replaces the placeholder in requests to the k3s API server. That needs TLS interception on port 6443, so msb.py passes --tls-intercept-port and the CA of k3s (the justfile writes the CA file).
  # Without the token, `msb run` fails. So the VM never falls back to another credential.
  K8S_TOKEN:
    allow: [host.microsandbox.internal]
    passthrough: [api.anthropic.com, token-plan.ap-southeast-1.maas.aliyuncs.com]
network:
  tls:
    enabled: true
    # The SPIRE agent must see the real certificate of the SPIRE server. Its SPIFFE ID is a URI SAN. The TLS proxy of msb replaces it with its own certificate, which has no URI SAN.
    bypass: [spire.localhost]
  # The ports of the VM that the host can reach, as [bind:]host:guest. The bind address is the loopback of the host.
  ports:
    - "127.0.0.1:8787:8787" # the Headroom proxy: http://127.0.0.1:8787/dashboard on the host
  allow:
    # Claude Code
    - api.anthropic.com
    - claude.ai
    - console.anthropic.com
    - platform.claude.com
    - code.claude.com
    # Qwen Code: the Token Plan (international, Singapore) endpoint
    - token-plan.ap-southeast-1.maas.aliyuncs.com
    # GitHub: git, API, release downloads and the GitHub MCP server
    - github.com
    - api.github.com
    - api.githubcopilot.com
    - "*.githubusercontent.com"
    - github.githubassets.com
    - www.githubstatus.com
    # MCP servers
    - mcp.draw.io
    - schemas.fluxoperator.dev
    # Container images (podman). Docker Hub needs the registry, the token service and a CDN for the blobs.
    # The CDN host changes (cloudflare, cloudfront), so *.docker.com covers it.
    - registry-1.docker.io
    - auth.docker.io
    - "*.docker.com"
    # GitHub Container Registry. ghcr.io serves the token and the manifests. It redirects the blobs to pkg-containers.githubusercontent.com.
    - ghcr.io
    - pkg-containers.githubusercontent.com
    # Tool downloads
    - releases.hashicorp.com
    - registry.terraform.io
    - mise.jdx.dev
    - astral.sh
    - "*.astral.sh"
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    # Chart and OCI registries that the cluster uses (blob.istio.io redirects to istio-release.r2.istio.io)
    - istio.io
    - "*.istio.io"
    - istio-release.storage.googleapis.com
    - cr.agentgateway.dev
    - quay.io
    - "*.quay.io"
    - charts.dexidp.io
    # Schemas
    - www.schemastore.org
    # Documentation and project sites, for research
    - artifacthub.io
    - backstage.io
    - kind.sigs.k8s.io
    - just.systems
    - fluxcd.io
    - fluxoperator.dev
    - spiffe.github.io
    - docs.ansible.com
    - argo-cd.readthedocs.io
    - pkl-lang.org
    - kubernetes.io
    - helm.sh
    - kubectl.docs.kubernetes.io
    - docs.aws.amazon.com
    - docs.k3s.io
    - agentgateway.dev
    - cuelang.org
    - spiffe.io
    - owasp.org
    - fluxcd.control-plane.io
    - docs.microsandbox.dev
    - doc.traefik.io
    - cloud.google.com
    # Other
    - crl.microsoft.com
