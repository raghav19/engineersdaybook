# Everything the sandbox has: the dev tools, the Terraform cache settings and the bash completions. Dockerfile bakes these exact versions
# into the image (as /etc/mise/conf.d/sandbox.toml). The root mise.toml is for the host only (kind, msb, bws) and the image never reads it,
# so a tool both sides use (kubectl, helm, kustomize) is listed in both files.
# It is not named mise.toml on purpose: the host's mise would load it from this folder and ask to trust it.
# node and python are not here: the sandbox's shell kit ships them. uv is here only because the mise pypi backend (headroom-ai) needs it at
# build time (the build image has no uv or pipx). It takes the place of the shell kit's uv on PATH.

# Applied by the mise shims in the sandbox. The provider cache is a volume of the dev-tools kit.
[env]
EDITOR = "code --wait"
LANG = "C.UTF-8"
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/terraform-providers"
CHECKPOINT_DISABLE = "1"  # no Terraform version check to checkpoint-api.hashicorp.com
COMPLETIONS_DIR = "{{ get_env(name='COMPLETIONS_DIR', default=env.HOME ~ '/.local/share/sandbox/completions') }}"  # dev-tools.dockerfile sets it at build; by hand in the VM /opt/sandbox is root-owned
KUBECONFIG = "/run/sandbox/source/.msb/kubeconfig"  # the host repo, read-only in the VM; written on the host by the kube step (not ported yet)
# Headroom (claude-hr in dev-tools.yaml): no telemetry beacon, no update check, no Hugging Face download (huggingface.co is not on the egress allow list)
HEADROOM_TELEMETRY = "off"
HEADROOM_BEACON = "off"
HEADROOM_UPDATE_CHECK = "off"
DO_NOT_TRACK = "1"
HF_HUB_OFFLINE = "1"
UV_PYTHON_INSTALL_DIR = "/opt/mise/uv-python"  # at build, the Python of the headroom-ai venv: under /opt/mise the image copies it with the venv (else uv puts it in ~/.local/share/uv)
# Ponytail (plugin installed at boot by dev-tools.yaml): no codebase map in the session context, which saves input tokens
PONYTAIL_MAP = "0"
PONYTAIL_DEFAULT_MODE = "full"

[tools]
just = "1.59"
yq = "4.54"
jq = "1.8"
fzf = "0.74"
starship = "1.26"
fd = "10.5"
kubectl = "1.37"
helm = "4.3"
kustomize = "5.8"
terragrunt = "1.1"
terraform = "1.16"
flux2 = "2.9"
"github:home-operations/flate" = "0.6"
"github:fluxcd/flux-schema" = "0.15"
prek = "0.5"
claude = "2.1.309"  # Claude Code, from the aqua registry with a SHA256 check. DISABLE_UPDATES=1 in sandbox.yaml: change the version here and rebuild
ruff = "0.17"
gitleaks = "8.30"
yamlfmt = "0.21"
uv = "0.13"
ty = "0.0.85"
"pypi:headroom-ai" = { version = "0.41.0", extras = "sandbox", install_env = { UV_PYTHON = "3.13" } }  # Claude Code token proxy; the sandbox extra has no torch. docs/research/headroom.md. install_env: the build image has no Python, so uv fetches the newest (3.15), and onnxruntime has no cp315 wheel
"github:spiffe/spire" = { version = "1.15.3", asset_pattern = "spire-{{ version }}-linux-amd64-musl.tar.gz", filter_bins = "spire-agent" }  # SPIRE agent for the VM node identity, same version as the SPIRE server

# dev-tools.dockerfile runs this with the tools in place. COMPLETIONS_DIR comes from [env]: the build sets it, and run by hand in the VM it
# defaults to ~/.local/share/sandbox/completions, which the shell setup in dev-tools.yaml also sources (/opt/sandbox is root-owned there).
[tasks."sandbox:completions"]
description = "Write the bash completions that the shell setup in dev-tools.yaml sources into $COMPLETIONS_DIR"
run = """
mkdir -p "$COMPLETIONS_DIR"
kubectl completion bash > "$COMPLETIONS_DIR/kubectl"
helm completion bash > "$COMPLETIONS_DIR/helm"
kustomize completion bash > "$COMPLETIONS_DIR/kustomize"
starship completions bash > "$COMPLETIONS_DIR/starship"
fd --gen-completions bash > "$COMPLETIONS_DIR/fd"
flux completion bash > "$COMPLETIONS_DIR/flux"
just --completions bash > "$COMPLETIONS_DIR/just"
yq shell-completion bash > "$COMPLETIONS_DIR/yq"
echo complete -C terraform terraform > "$COMPLETIONS_DIR/terraform"
echo complete -C terragrunt terragrunt > "$COMPLETIONS_DIR/terragrunt"
"""
