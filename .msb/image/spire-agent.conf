# The SPIRE agent of the VM. The Dockerfile installs this file as /etc/spire/agent.conf. The msb sandbox does not start the agent yet, because the SPIRE step is not ported.
# The values are for the local kind cluster.
agent {
  # The SVID and the key of the agent
  data_dir            = "/home/agent/.spire/data"
  socket_path         = "/home/agent/.spire/agent.sock"

  # The trust_domain of config/cloud/kind/identity.yaml
  trust_domain        = "mcp.local"

  # The SPIRE server is on host port 18081 (kind-config.yaml). The VM uses the name host.microsandbox.internal.
  server_address      = "host.microsandbox.internal"
  server_port         = "18081"

  trust_bundle_format = "spiffe"
  log_level           = "INFO"
}

plugins {
  # A join token that works one time
  NodeAttestor     "join_token" { plugin_data {} }

  # Keep the key and the SVID in data_dir after a restart
  KeyManager       "disk"       { plugin_data { directory = "/home/agent/.spire/data" } }

  # Match a process by its uid
  WorkloadAttestor "unix"       { plugin_data {} }
}
