# SPIRE agent of the sandbox VM, installed as /etc/spire/agent.conf. (Not started yet in the msb sandbox: the SPIRE step is not ported.)
# The values are for the local kind cluster.
agent {
  # SVID and key of the agent
  data_dir            = "/home/agent/.spire/data"
  socket_path         = "/home/agent/.spire/agent.sock"

  # trust_domain of config/cloud/kind/identity.yaml
  trust_domain        = "mcp.local"

  # SPIRE server: host port 18081 (kind-config.yaml), reached as host.microsandbox.internal
  server_address      = "host.microsandbox.internal"
  server_port         = "18081"

  trust_bundle_format = "spiffe"
  log_level           = "INFO"
}

plugins {
  # One-time join token
  NodeAttestor     "join_token" { plugin_data {} }

  # Keep the key and SVID in data_dir across restarts
  KeyManager       "disk"       { plugin_data { directory = "/home/agent/.spire/data" } }

  # Match a process by uid
  WorkloadAttestor "unix"       { plugin_data {} }
}
