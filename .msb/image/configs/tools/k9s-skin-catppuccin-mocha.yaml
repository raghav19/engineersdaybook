# Catppuccin Mocha skin for k9s. The background stays the color of the terminal.
k9s:
  body:
    fgColor: "#cdd6f4"
    bgColor: default
    logoColor: "#89b4fa"
  prompt:
    fgColor: "#cdd6f4"
    bgColor: default
    suggestColor: "#cba6f7"
  help:
    fgColor: "#cdd6f4"
    bgColor: default
    sectionColor: "#a6e3a1"
    keyColor: "#89b4fa"
    numKeyColor: "#f38ba8"
  frame:
    title:
      fgColor: "#89dceb"
      bgColor: default
      highlightColor: "#fab387"
      counterColor: "#f9e2af"
      filterColor: "#cba6f7"
    border:
      fgColor: "#45475a"
      focusColor: "#89b4fa"
    menu:
      fgColor: "#cdd6f4"
      keyColor: "#89b4fa"
      numKeyColor: "#f38ba8"
    crumbs:
      fgColor: "#1e1e2e"
      bgColor: default
      activeColor: "#89b4fa"
    status:
      newColor: "#89dceb"
      modifyColor: "#89b4fa"
      addColor: "#a6e3a1"
      pendingColor: "#fab387"
      errorColor: "#f38ba8"
      highlightColor: "#f9e2af"
      killColor: "#cba6f7"
      completedColor: "#6c7086"
  info:
    fgColor: "#fab387"
    sectionColor: "#cdd6f4"
  views:
    table:
      fgColor: "#cdd6f4"
      bgColor: default
      cursorFgColor: "#1e1e2e"
      cursorBgColor: "#89b4fa"
      markColor: "#cba6f7"
      header:
        fgColor: "#f9e2af"
        bgColor: default
        sorterColor: "#89dceb"
    xray:
      fgColor: "#cdd6f4"
      bgColor: default
      cursorColor: "#89b4fa"
      cursorTextColor: "#1e1e2e"
      graphicColor: "#89dceb"
    charts:
      bgColor: default
      defaultDialColors:
        - "#89b4fa"
        - "#f38ba8"
      defaultChartColors:
        - "#89b4fa"
        - "#f38ba8"
      resourceColors:
        cpu:
          - "#89dceb"
          - "#89b4fa"
        mem:
          - "#fab387"
          - "#f9e2af"
    yaml:
      keyColor: "#89b4fa"
      colonColor: "#6c7086"
      valueColor: "#cdd6f4"
    logs:
      fgColor: "#cdd6f4"
      bgColor: default
      indicator:
        fgColor: "#cdd6f4"
        bgColor: "#45475a"
        toggleOnColor: "#a6e3a1"
        toggleOffColor: "#6c7086"
  dialog:
    fgColor: "#cdd6f4"
    bgColor: default
    buttonFgColor: "#1e1e2e"
    buttonBgColor: "#6c7086"
    buttonFocusFgColor: "#1e1e2e"
    buttonFocusBgColor: "#89b4fa"
    labelFgColor: "#f9e2af"
    fieldFgColor: "#cdd6f4"
