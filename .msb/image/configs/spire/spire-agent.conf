# The SPIRE agent of the VM. The Dockerfile installs this file as /etc/spire/agent.conf, owned by root. sandbox-boot starts the agent as root.
# The agent runs as root, because the node key is a mode 600 file of the host (mounted read-only at /run/sandbox/node) and the user agent (Claude Code) must not read it.
# So everything that the agent reads or writes is owned by root: this file, data_dir, the folder of the socket and the log. A user of the VM can only use the socket.
agent {
  # The SVID and the key of the agent
  data_dir            = "/var/lib/spire-agent"
  socket_path         = "/run/spire/agent.sock"

  # The trust_domain of config/cloud/k3s/identity.yaml in part 3
  trust_domain        = "mcp.local"

  # The SPIRE server is behind the gateway of the k3s cluster on the host, on the standard port 443. The gateway passes the TLS through to the server.
  # The gateway picks the route by the name spire.localhost. sandbox-boot maps that name to the host address (host.microsandbox.internal).
  server_address      = "spire.localhost"
  server_port         = "443"

  # The agent checks the server against this bundle when it starts without a cached one. `just msb node-cert` writes the current bundle (`bundle show -format spiffe`).
  trust_bundle_path   = "/run/sandbox/node/bundle.json"
  trust_bundle_format = "spiffe"
  log_level           = "INFO"
}

plugins {
  # The node key and the node certificate of the host folder. The agent reads both again at each attestation, and it attests again each time its own SVID rotates.
  # So the certificate in the folder must be valid at all times. cert-manager renews it 30 days before its end, and `just msb node-cert` copies the new one.
  NodeAttestor     "x509pop"    { plugin_data {
    private_key_path = "/run/sandbox/node/node.key"
    certificate_path = "/run/sandbox/node/node.crt"
  } }

  # Keep the key and the SVID in data_dir after a restart
  KeyManager       "disk"       { plugin_data { directory = "/var/lib/spire-agent" } }

  # Match a process by its uid
  WorkloadAttestor "unix"       { plugin_data {} }
}
