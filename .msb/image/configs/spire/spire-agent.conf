# The SPIRE agent of the VM. The Dockerfile installs this file as /home/agent/.config/spire/agent.conf. The msb sandbox does not start the agent yet:
# `msb.py attest` (a later part of the chain, docs/zero-trust-node-attestation.md) puts the node certificate and the trust bundle in the VM and starts it.
agent {
  # The SVID and the key of the agent
  data_dir            = "/home/agent/.spire/data"
  socket_path         = "/home/agent/.spire/agent.sock"

  # The trust_domain of config/cloud/kind/identity.yaml
  trust_domain        = "mcp.local"

  # The SPIRE server is the NodePort 30081 of the k3s cluster on the host. The VM uses the name host.microsandbox.internal.
  server_address      = "host.microsandbox.internal"
  server_port         = "30081"

  # The agent checks the server against this bundle. The host writes it (`bundle show -format spiffe`). Without it, the agent does not start.
  trust_bundle_path   = "/home/agent/.spire/bundle.json"
  trust_bundle_format = "spiffe"
  log_level           = "INFO"
}

plugins {
  # The node key and the node certificate. sandbox-boot makes the key and the CSR. The host signs the CSR and writes the certificate.
  NodeAttestor     "x509pop"    { plugin_data {
    private_key_path = "/home/agent/.spire/node.key"
    certificate_path = "/home/agent/.spire/node.crt"
  } }

  # Keep the key and the SVID in data_dir after a restart
  KeyManager       "disk"       { plugin_data { directory = "/home/agent/.spire/data" } }

  # Match a process by its uid
  WorkloadAttestor "unix"       { plugin_data {} }
}
