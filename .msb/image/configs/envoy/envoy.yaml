# Envoy of the msb sandbox VM. The Dockerfile installs this file as /etc/envoy/envoy.yaml, owned by root. sandbox-boot starts Envoy as the Unix user envoy.
# That user is the selector of the workload entry platform/addons/spire/workload-entry.yaml, so only this process gets the SPIFFE ID
# spiffe://mcp.local/microvm/raghav19/envoy. Envoy gets its SVID from the SPIRE agent over SDS on the agent socket.
# Nothing in this file names a user or an ID: the SDS name `default` is the one SVID of this workload, and `ROOTCA` is the trust bundle.
# The upstream below is a placeholder. SDS secrets load only when a cluster uses them, so it makes the SVID show in the admin /certs.
# The client hop to the Istio ingress gateway replaces it.
# The admin interface has no login. It listens on loopback only, and it shows certificates, not keys.
# SDS needs a node id and cluster. The agent does not check them.
node: {id: sandbox-envoy, cluster: sandbox}

admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 9901}

static_resources:
  clusters:
    - name: spire_agent
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: spire_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: {path: /run/spire/agent.sock} # socket_path of configs/spire/spire-agent.conf

    - name: upstream_placeholder
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: upstream_placeholder
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 9} # nothing listens: no call is made
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificate_sds_secret_configs:
              - name: default
                sds_config: &sds
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - envoy_grpc: {cluster_name: spire_agent}
            validation_context_sds_secret_config:
              name: ROOTCA
              sds_config: *sds
