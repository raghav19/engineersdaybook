# The default mounts and settings of each container that podman starts in the VM.
# msb intercepts HTTPS and puts its CA in the trust store of the VM, not in the trust store of a container.
# This mount makes a container trust the same CAs as the VM. Without it, a download over HTTPS in a RUN step fails.
[containers]
volumes = ["/etc/ssl/certs:/etc/ssl/certs:ro"]
