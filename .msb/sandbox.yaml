# This file declares the whole VM of the msb sandbox. `just msb run` makes the VM from it.
# After you change the file, run `just msb rm && just msb run` to make the VM again.
# Schema: https://docs.microsandbox.dev/cli/configuration.md
# ${NAME} is a host value. `just msb run` puts the host values in its environment.
# Not ported from .sbx yet: the SPIRE agent, the kind kubeconfig and the Flux Operator UI.

image:
  oci: engineersdaybook-sandbox:local # `just msb image-build` builds and loads it
  upper_size: "20G"
pull_policy: never

cpus: 4
memory: "4G"
shell: "/bin/bash" # the shell of SSH sessions and of `msb exec`. VS Code terminals use bash. The login shell adds the mise shims to the PATH.

# sandbox-boot runs as root. It prepares the agent user, clones the repo and starts Headroom. Then it waits. See image/sandbox-boot.
cmd: ["/usr/local/bin/sandbox-boot"]

env:
  SANDBOX_WORKSPACE: /home/agent/engineersdaybook # the path of the clone. The justfile (MSB_WORKSPACE) has the same value.
  SANDBOX_BRANCH: ${SANDBOX_BRANCH} # the branch of the host checkout. The clone starts on it.
  REPO_URL: https://github.com/raghav19/engineersdaybook # the URL of origin in the clone
  GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME} # git reads the identity from these four variables, so the VM needs no git config for it
  GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME}
  GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL}
  GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL}
  MISE_TRUSTED_CONFIG_PATHS: /home/agent/engineersdaybook # mise trusts the mise.toml files in the clone
  MISE_IGNORED_CONFIG_PATHS: /home/agent/engineersdaybook/mise.toml # mise ignores the root mise.toml of the clone, because it lists host tools
  CLAUDE_CONFIG_DIR: /home/agent/.claude # the claude-home volume holds the login and the settings
  DISABLE_UPDATES: "1" # the claude that mise installs does not update itself

mounts:
  # The git directory of the host repo, read-only. The VM can read the committed history. It cannot read the rest of your working tree,
  # so it cannot read untracked files or .env. sandbox-boot clones the directory, so the VM works on a private clone.
  # This also works if the host checkout is a git worktree. msb 0.7.10 refuses a relative path to a parent folder, so the path is a host value.
  - "${SANDBOX_GIT_DIR}:/run/sandbox/source:ro"
  # The Claude Code login and settings. `just msb rm --volumes` removes them.
  - named: claude-home
    target: /home/agent/.claude
    create: ensure-exists

# The GitHub token does not enter the VM. The VM has a placeholder. The host replaces it with the token, for these hosts only.
# The host replaces it in Basic auth (git over HTTPS) and in Bearer auth (REST API and GitHub MCP). The token is the host value GITHUB_TOKEN.
secrets:
  GITHUB_TOKEN:
    allow: [github.com, api.github.com, api.githubcopilot.com]

# The egress allow list. If `allow` has entries, the VM denies all other hosts. To add a host, run `just msb allow-host <host>`.
# The pattern *.example.com matches the subdomains only. If a site needs the bare domain, the list has it too.
network:
  tls:
    enabled: true # the host reads HTTPS requests. The host rules and the token replacement need this.
  allow:
    # Claude Code
    - api.anthropic.com
    - claude.ai
    - console.anthropic.com
    - platform.claude.com
    - code.claude.com
    # GitHub: git, API, release downloads and the GitHub MCP server
    - github.com
    - api.github.com
    - api.githubcopilot.com
    - "*.githubusercontent.com"
    - github.githubassets.com
    - www.githubstatus.com
    # MCP servers
    - mcp.draw.io
    - schemas.fluxoperator.dev
    # Tool downloads
    - releases.hashicorp.com
    - registry.terraform.io
    - mise.jdx.dev
    - astral.sh
    - "*.astral.sh"
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    # Chart and OCI registries that the cluster uses (blob.istio.io redirects to istio-release.r2.istio.io)
    - istio.io
    - "*.istio.io"
    - istio-release.storage.googleapis.com
    - cr.agentgateway.dev
    - quay.io
    - "*.quay.io"
    - charts.dexidp.io
    # Schemas
    - www.schemastore.org
    # Documentation and project sites, for research
    - kind.sigs.k8s.io
    - just.systems
    - fluxcd.io
    - fluxoperator.dev
    - spiffe.github.io
    - docs.ansible.com
    - argo-cd.readthedocs.io
    - pkl-lang.org
    - kubernetes.io
    - helm.sh
    - kubectl.docs.kubernetes.io
    - docs.aws.amazon.com
    - agentgateway.dev
    - cuelang.org
    - spiffe.io
    - owasp.org
    - fluxcd.control-plane.io
    - docs.microsandbox.dev
    # VS Code and Copilot
    - marketplace.visualstudio.com
    - "*.vsassets.io"
    - "*.vscode-cdn.net"
    # Other
    - crl.microsoft.com
