# What the host needs to run the sandbox (the sandbox's own tools are in .sbx/tools.toml):
# task runs the Taskfile, yq and jq are used by its tasks, sops decrypts .env.secrets.json (host secrets, never loaded into the environment).
# sbx itself is not installed by mise: see the README in code/mcp-sandbox/part-2.1-sandboxing-agents.
[tools]
task = "3.54"
yq = "4.54"
jq = "1.8"
sops = "3.13"
kind = "0.33.0"
kubectl = "1.37"
kustomize = "5.8.3"
helm = "4.3.0"
cloud-provider-kind = "0.12.0"

[env]
EDITOR="code --wait"