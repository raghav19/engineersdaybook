
# Applied by the mise shims, on the host and in the sandbox. In the sandbox the provider cache is a volume of the dev-tools kit.
[env]
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/terraform-providers"
CHECKPOINT_DISABLE = "1"  # no Terraform version check to checkpoint-api.hashicorp.com

# The tasks that build the sbx sandbox image live in the dev-tools kit.
[task_config]
includes = ["code/mcp-sandbox/part-2.1-sandboxing-agents/dev-tools/tasks.toml"]

# Exact versions: the sandbox image bakes exactly these (code/mcp-sandbox/part-2.1-sandboxing-agents/dev-tools).
# node, python and uv are not here: the sandbox's shell kit ships them.
[tools]
fzf = "0.74"
starship = "1.26"
fd = "10.5"
kubectl = "1.37"
helm = "4.3"
kustomize = "5.8"
task = "3.54"
yq = "4.54"
terragrunt = "1.1"
terraform = "1.16"
flux2 = "2.9"


[tasks.vscode-ssh-setup]
description = "Link workspace SSH config + apply global Remote-SSH settings (Linux)"
run = """
#!/usr/bin/env bash
set -euo pipefail

WORKSPACE_DIR="${MISE_PROJECT_ROOT:-$(pwd)}"
REPO_SSH_CONFIG="$WORKSPACE_DIR/.vscode/ssh_config"
VSCODE_SETTINGS="$HOME/.config/Code/User/settings.json"

if [ ! -f "$REPO_SSH_CONFIG" ]; then
    echo "❌ No SSH config found at: $REPO_SSH_CONFIG"
    exit 1
fi

echo "🚀 VSCode Remote-SSH setup for: $WORKSPACE_DIR"

# ─── 1. VSCode Settings (app scope + configFile pointer) ─
mkdir -p "$(dirname "$VSCODE_SETTINGS")"
[ -f "$VSCODE_SETTINGS" ] || echo '{}' > "$VSCODE_SETTINGS"

PERF=$(jq -n \
  --arg cfg "$REPO_SSH_CONFIG" \
  '{
    "remote.SSH.configFile": $cfg,
    "remote.SSH.useLocalServer": true,
    "remote.SSH.useExecServer": false,
    "remote.SSH.enableDynamicForwarding": false,
    "remote.SSH.enableAgentForwarding": false,
    "remote.SSH.connectTimeout": 30,
    "remote.SSH.showLoginTerminal": false,
    "remote.SSH.localServerDownload": "always",
  }')

MERGED=$(jq --argjson p "$PERF" '. * $p' "$VSCODE_SETTINGS")
if [ "$MERGED" != "$(cat "$VSCODE_SETTINGS")" ]; then
    echo "$MERGED" | jq '.' > "$VSCODE_SETTINGS"
    echo "✅ VSCode settings updated (configFile → $REPO_SSH_CONFIG)"
else
    echo "ℹ️  VSCode settings already optimal"
fi

echo "🎉 Done! Restart VSCode to apply."
"""

[tasks.setup-skills]
description = 'Setup skills for the project'
run = """
#!/usr/bin/env bash

npx skills add mattpocock/skills \
        --agent claude-code \
        --yes

npx skills add danyuchn/asd-ste100-skill \
        --agent claude-code \
        --yes

npx skills add jfr992/terragrunt-skill \
        --agent claude-code \
        --yes

npx skills add antonbabenko/agent-plugins \
        --agent claude-code \
        --yes

npx skills add aws/agent-toolkit-for-aws/skills \
        --agent claude-code \
        --skill aws-containers \
        --skill aws-compute \
        --skill aws-iam \
        --skill aws-networking \
        --skill aws-security \
        --skill aws-storage \
        --skill aws-auth \
        --yes

npx skills add fluxcd/agent-skills \
        --agent claude-code \
        --yes
"""
