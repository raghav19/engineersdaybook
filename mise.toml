[tools]
just = "1.59"
yq = "4.54"
jq = "1.8"
bitwarden-secrets-manager = "2.1"
age = "1.3"  # encrypts and decrypts the Bitwarden access token (.msb/, prerequisite 4)
kind = "0.33"
kubectl = "1.37"
kustomize = "5.8"
helm = "4.3"
flux2 = "2.9"
"github:home-operations/flate" = "0.6"
"github:fluxcd/flux-schema" = "0.15"
uv = "0.13"
ty = "0.0"
k9s = "0.51"
"aqua:superradcompany/microsandbox" = "0.7"  # msb, the CLI of the microsandbox sandbox (.msb/)
qwen-code = "0.26"  # Qwen Code, the command qwen. It runs on node, which the host provides

[hooks.enter]
shell = "bash"
script = """
eval "$(just --completions bash 2>/dev/null)" 2>/dev/null || true
eval "$(yq completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(kind completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(kubectl completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(kustomize completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(helm completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(flux completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(flate completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(flux-schema completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(uv generate-shell-completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(k9s completion bash 2>/dev/null)" 2>/dev/null || true
eval "$(msb completion bash 2>/dev/null)" 2>/dev/null || true
"""
