# Shows the rendered manifest diff of part 3 in the pull request. A change under platform/ (what Flux delivers) starts it. Three steps:
# hydrate (render with flate and validate every component: package-artifact), publish (push each component that has a diff: publish-artifact),
# diff (the job summary and the comment: the output of `just <component>/diff`, unchanged). The recipes are in lib/workflow/.
name: manifest-diff

on:
  pull_request:
    paths:
      - code/mcp-sandbox/part-3-mcp-guardrails/platform/**

concurrency:
  group: manifest-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # publish-artifact: push the artifact to ghcr.io
  pull-requests: write # the comment

jobs:
  manifest-diff:
    # a pull request from a fork has a read-only token: it cannot push
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/mcp-sandbox/part-3-mcp-guardrails
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # v7.0.1. fetch-depth 0: the recipes read the stack at origin/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # v5.2.1. Only the tools that the recipes run: the versions are in the root mise.toml
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          install_args: just yq jq flux2 github:home-operations/flate uv

      # Every component is hydrated. A component with no diff is not pushed. These four are not pinned in the stack, so their diff is always the
      # whole artifact: remove a name when its component is pinned. Hydrate writes the list of components that the next steps read
      - name: Hydrate (render and validate)
        env:
          SKIP: platform/ext-mcp platform/policies/ext-mcp-checks platform/policies/ext-mcp-isolation platform/policies/mcp-mtls
        run: |
          for c in $(find platform -name justfile -exec dirname {} \; | sort); do
            case " $SKIP " in *" $c "*) continue ;; esac
            echo "$c" >> "$RUNNER_TEMP/components"
            just "$c/package-artifact"
          done

      # diff compares with the artifact that origin/main pins, so it does not depend on the push
      - name: Publish (push each component that has a diff)
        run: |
          touch "$RUNNER_TEMP/changed"
          for c in $(cat "$RUNNER_TEMP/components"); do
            out=$(just "$c/diff")
            grep -q '^@@' <<<"$out" || { echo "skip $c: no diff"; continue; }
            echo "$c" >> "$RUNNER_TEMP/changed"
            just "$c/publish-artifact"
          done

      - name: Diff (job summary and comment)
        run: |
          {
            echo '## Rendered manifest diff'
            echo
            [ -s "$RUNNER_TEMP/changed" ] || echo 'No rendered manifest changes.'
            for c in $(cat "$RUNNER_TEMP/changed"); do
              out=$(just "$c/diff")
              printf '### %s\n\n````diff\n%s\n````\n\n' "$c" "$out"
            done
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          # a comment holds 65,536 characters
          head -c 60000 "$RUNNER_TEMP/report.md" | gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none -F -
