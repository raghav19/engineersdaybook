# Shows the rendered manifest diff of part 3 in the pull request. A change under platform/ (what Flux delivers) starts it. For each component that the PR changes:
# hydrate (render with flate and validate: package-artifact), publish (push the artifact: publish-artifact), then diff (against the artifact that origin/main pins: diff).
# The comment is the output of `just <component>/diff`, unchanged. The recipes are in lib/workflow/.
name: manifest-diff

on:
  pull_request:
    paths:
      - code/mcp-sandbox/part-3-mcp-guardrails/platform/**

concurrency:
  group: manifest-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # publish-artifact: push the artifact to ghcr.io
  pull-requests: write # the comment

jobs:
  manifest-diff:
    # a pull request from a fork has a read-only token: it cannot push
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/mcp-sandbox/part-3-mcp-guardrails
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # v7.0.1. fetch-depth 0: the recipes read the stack at origin/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # v5.2.1. Only the tools that the recipes run: the versions are in the root mise.toml
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          install_args: just yq jq flux2 github:home-operations/flate uv

      # a component is the nearest folder above a changed file that has a justfile
      - name: Select the changed components
        run: |
          set -o pipefail
          git diff --relative --name-only origin/main...HEAD -- platform | while read -r f; do
            d=$(dirname "$f")
            while [ "$d" != . ] && [ ! -f "$d/justfile" ]; do d=$(dirname "$d"); done
            [ "$d" = . ] || echo "$d"
          done | sort -u > "$RUNNER_TEMP/components"
          cat "$RUNNER_TEMP/components"

      - name: Hydrate (render and validate)
        run: for c in $(cat "$RUNNER_TEMP/components"); do just "$c/package-artifact"; done

      - name: Publish (push the artifact)
        run: for c in $(cat "$RUNNER_TEMP/components"); do just "$c/publish-artifact"; done

      - name: Diff
        run: |
          {
            echo '## Rendered manifest diff'
            echo
            [ -s "$RUNNER_TEMP/components" ] || echo 'No rendered manifest changes.'
            for c in $(cat "$RUNNER_TEMP/components"); do
              out=$(just "$c/diff")
              printf '### %s\n\n````diff\n%s\n````\n\n' "$c" "$out"
            done
          } > "$RUNNER_TEMP/report.md"

      - name: Write the job summary
        run: cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # a comment holds 65,536 characters
      - name: Create or update the pull request comment
        run: head -c 60000 "$RUNNER_TEMP/report.md" | gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none -F -
