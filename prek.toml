# Pre-commit checks, run by prek on every commit. The sandbox installs the hook at start (.sbx/kits/dev-tools/dev-tools.yaml).
# The builtin hooks need no network. gitleaks, yamlfmt and ruff come from mise, from the sandbox image (.sbx/kits/dev-tools/tools.toml).

exclude = '^_archive/'  # the old Jekyll site, with vendored minified files

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "gitleaks"
name = "gitleaks"
language = "system"
entry = "gitleaks git --pre-commit --staged --redact --verbose"
pass_filenames = false

[[repos.hooks]]
id = "yamlfmt"
name = "yamlfmt"
language = "system"
entry = "yamlfmt"
types = ["yaml"]

# ruff finds its settings per file: the nearest pyproject.toml with [tool.ruff] (tools/ sets line-length 140), else its defaults.
[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "ruff check --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "ruff format"
types = ["python"]

# ty reads ty.toml in the repo root. The build functions in tools/ are checked by their build recipe, with their own dependencies (types-pyyaml).
[[repos.hooks]]
id = "ty-check"
name = "ty check"
language = "system"
entry = "ty check"
types = ["python"]
exclude = '/tools/'
