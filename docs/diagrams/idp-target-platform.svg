<text x="577.5" y="75.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">2</text>
<path d="M 230 135 L 490 135" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="352.9" y="125.5" width="14.2" height="19" fill="#ffffff"/>
<text x="360" y="138.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">3</text>
<path d="M 635 210 L 635 170" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="627.9" y="180.5" width="14.2" height="19" fill="#ffffff"/>
<text x="635" y="193.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">4</text>
<path d="M 97 170 L 97 178 Q 97 190 109 190 L 1008 190 Q 1020 190 1020 202 L 1020 210" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="551.4" y="180.5" width="14.2" height="19" fill="#ffffff"/>
<text x="558.5" y="193.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">5</text>
