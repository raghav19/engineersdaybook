<text x="235" y="193.5" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333333">1</text>
<path d="M 135 100 L 135 84 Q 135 72 147 72 L 1008 72 Q 1020 72 1020 84 L 1020 100" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#a)"/>
