name: spkC
x-podman:
  in_pod: false
services:
  sandbox:
    image: localhost/spk-c-sbx:1
    container_name: spk-c-sandbox
    entrypoint: ["/entry.sh"]
    command: ["sleep", "600"]
    user: "0:0"
    working_dir: /home/agent
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=1777
      - /home/agent/.cache:size=256m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    environment:
      HOME: /home/agent
    volumes:
      - ./entry.sh:/entry.sh:ro
      - ./hostdir:/run/sandbox/source:ro
      - claude-home:/home/agent/.claude
      - podman-storage:/home/agent/.local/share/containers
      - terraform-providers:/home/agent/.cache/terraform-providers
    networks:
      sbxnet:
        ipv4_address: 10.89.32.10
  proxy:
    image: docker.io/library/alpine:3.22
    container_name: spk-c-proxy
    command: ["sleep", "600"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      sbxnet:
        ipv4_address: 10.89.32.2
        aliases: [api.example.test]
      egress: {}
networks:
  sbxnet:
    name: spk-c-sbxnet
    internal: true
    ipam:
      config:
        - subnet: 10.89.32.0/24
  egress:
    name: spk-c-egress
volumes:
  claude-home: {name: spk-c-claude-home}
  podman-storage: {name: spk-c-podman-storage}
  terraform-providers: {name: spk-c-terraform-providers}
