name: spkn2
x-podman:
  in_pod: false
networks:
  inner:
    name: spk-n2-inner
    internal: true
    x-podman.disable_dns: true
    ipam:
      config: [{subnet: 10.89.51.0/24}]
  outer:
    name: spk-n2-outer
    ipam:
      config: [{subnet: 10.89.52.0/24}]
secrets:
  spk-n2-ca-key:
    external: true
services:
  proxy:
    container_name: spk-n2-proxy
    image: docker.io/ironsh/iron-proxy@sha256:727da0cc35a6d73ed2913a38d56c4b9b4476c075149492e4fbf75552e83361ff
    command: ["-config", "/etc/iron-proxy/conf/proxy.yaml"]
    env_file: ./proxy.env
    user: "65534:65534"
    x-podman.uidmaps: ["0:200000:65536"]
    x-podman.gidmaps: ["0:200000:65536"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    security_opt: ["no-new-privileges"]
    extra_hosts: ["api.example.test:10.89.52.20", "other.example.test:10.89.52.20"]
    secrets:
      - source: spk-n2-ca-key
        target: /etc/iron-proxy/ca.key
        uid: "65534"
        gid: "65534"
        mode: "0400"
    volumes:
      - ./conf:/etc/iron-proxy/conf:ro
      - ./certs/ca/ca.crt:/etc/iron-proxy/ca.crt:ro
      - ./certs/up/bundle.crt:/up/bundle.crt:ro
      - ./secrets:/secrets
    networks:
      inner: {ipv4_address: 10.89.51.2}
      outer: {ipv4_address: 10.89.52.2}
  echo:
    container_name: spk-n2-echo
    image: docker.io/library/alpine:3.22
    command: ["/echo-bin"]
    volumes:
      - ./echo/echo-bin:/echo-bin:ro
      - ./certs/up:/up:ro
    networks:
      outer: {ipv4_address: 10.89.52.20}
  client:
    container_name: spk-n2-client
    image: localhost/spk-n2-client:1
    runtime: krun
    command: ["sleep", "infinity"]
    x-podman.uidmaps: ["0:100000:65536"]
    x-podman.gidmaps: ["0:100000:65536"]
    dns: [10.89.51.2]
    environment:
      CURL_CA_BUNDLE: /certs/ca.crt
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - ./certs/ca-client.crt:/certs/ca.crt:ro
    networks:
      inner: {ipv4_address: 10.89.51.3}
